<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="SAT and PERT practice with a Desmos Lab, animated math videos, and Bluebook-style questions.">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131A2B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kite Prep">
<meta name="application-name" content="Kite Prep">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Kite Prep</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: one column under a sticky bar; tabs dock to the bottom on phones and move into the bar on wide screens.
   Practice opens as a focused sheet; on wide screens reading passages split passage | question like the real tests.
   Motion: anything inside a .play container animates once, in document order (JS numbers the pieces). */
:root{
  --bg:#F4F6FB; --surface:#FFFFFF; --sunken:#ECF0F6; --ink:#0F1729; --muted:#5A6478; --rule:#DFE4EC;
  --brand:#2F5BEA; --brand-2:#1F44C9; --brand-soft:#E9EFFF; --brand-ink:#FFFFFF; --edge:#C3CCDA;
  --pencil:#2F5BEA; --pencil-soft:#E9EFFF; --pencil-ink:#1F44C9;
  --btn:#2F5BEA; --btn-ink:#FFFFFF; --mark:#2F5BEA; --mark-ink:#FFFFFF;
  --good:#12805A; --good-soft:#E1F4EC; --bad:#C2382F; --bad-soft:#FCE8E6; --warn:#A35F00; --warn-soft:#FCF0DA;
  --focus:#2F5BEA; --scrim:rgba(10,15,30,.46); --on-bad:#FFFFFF;
  --hi:#FFE27A; --ca:#2F5BEA; --cb:#A23BC4; --shadow:rgba(16,24,40,.08); --card-sh:0 1px 2px rgba(16,24,40,.04),0 2px 6px rgba(16,24,40,.05);
  --f-ui:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-read:'Source Serif 4', Georgia, 'Times New Roman', serif;
  --f-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r:10px; --rs:1; --gap:.42s; --lead:.15s;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1020; --surface:#131A2B; --sunken:#1B2337; --ink:#E9EDF6; --muted:#9AA4BA; --rule:#28324A;
  --brand:#7092FF; --brand-2:#9DB4FF; --brand-soft:#1C2850; --brand-ink:#0B1020; --edge:#3A4663;
  --pencil:#7092FF; --pencil-soft:#1C2850; --pencil-ink:#A9BDFF;
  --btn:#7092FF; --btn-ink:#0B1020; --mark:#7092FF; --mark-ink:#0B1020;
  --good:#3FC48E; --good-soft:#11291F; --bad:#F2766D; --bad-soft:#3A1A1A; --warn:#EBB04E; --warn-soft:#32260F;
  --focus:#9DB4FF; --scrim:rgba(0,0,0,.6); --on-bad:#0B1020;
  --hi:#5B4A12; --ca:#7092FF; --cb:#D99BF0; --shadow:rgba(0,0,0,.35); --card-sh:0 1px 2px rgba(0,0,0,.3); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0B1020; --surface:#131A2B; --sunken:#1B2337; --ink:#E9EDF6; --muted:#9AA4BA; --rule:#28324A;
  --brand:#7092FF; --brand-2:#9DB4FF; --brand-soft:#1C2850; --brand-ink:#0B1020; --edge:#3A4663;
  --pencil:#7092FF; --pencil-soft:#1C2850; --pencil-ink:#A9BDFF;
  --btn:#7092FF; --btn-ink:#0B1020; --mark:#7092FF; --mark-ink:#0B1020;
  --good:#3FC48E; --good-soft:#11291F; --bad:#F2766D; --bad-soft:#3A1A1A; --warn:#EBB04E; --warn-soft:#32260F;
  --focus:#9DB4FF; --scrim:rgba(0,0,0,.6); --on-bad:#0B1020;
  --hi:#5B4A12; --ca:#7092FF; --cb:#D99BF0; --shadow:rgba(0,0,0,.35); --card-sh:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }
:root[data-size="lg"]{ --rs:1.14 }

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
@media (min-width:900px){body::before{background:var(--bg)}}
body.prac::before{background:var(--surface)}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;margin:0}
h3.sm{font-size:15px;font-weight:750;margin-bottom:6px}
.wrap{max-width:46rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:860px){.wrap{max-width:58rem}}
.wrap.wide{max-width:72rem}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:650}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}

/* ---------- motion system */
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes sweep{from{background-size:0% 62%}}
@keyframes uline{from{background-size:0% 3px}}
@keyframes dimout{from{opacity:1}}
@keyframes drawx{from{transform:scaleX(0)}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}70%{opacity:1;transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes fadein{from{opacity:0}}
@keyframes slideR{from{opacity:0;transform:translateX(28px)}}
@keyframes slideL{from{opacity:0;transform:translateX(-28px)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes fly{0%{opacity:1;transform:rotate(var(--a)) translateX(4px) scale(1)}100%{opacity:0;transform:rotate(var(--a)) translateX(var(--d)) scale(.4)}}
@keyframes floatup{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-34px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--pencil)}50%{box-shadow:0 0 0 4px transparent}}
@keyframes breathe{0%,100%{transform:scale(.62)}50%{transform:scale(1)}}
@keyframes inout{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}
@keyframes outin{0%,45%{opacity:0}50%,95%{opacity:1}100%{opacity:0}}
@keyframes ringfill{from{stroke-dashoffset:var(--full)}}
@keyframes barfill{from{transform:scaleX(0)}}
.play .a{animation-duration:.5s;animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-delay:calc(var(--i,0) * var(--gap) + var(--lead))}
.play :is(mark,.cap b).a{animation-name:sweep;animation-duration:.55s}
.play :is(.k,.ln,.eql,.cap,.ann,.chip,.arr).a{animation-name:rise}
.play s.a{animation-name:dimout}
.play s.a::after{animation:drawx .4s cubic-bezier(.4,0,.2,1) both;animation-delay:inherit}
.play :is(ins,.pop,.bx,.bo).a{animation-name:pop;animation-timing-function:cubic-bezier(.2,1.4,.4,1)}
.play :is(.ua,.ub).a{animation-name:uline}
.play :is(.ua,.ub).a::after{animation:fadein .35s both;animation-delay:calc(var(--i,0) * var(--gap) + var(--lead) + .35s)}
.play .draw.a{animation-name:draw;animation-duration:.9s;animation-timing-function:ease-in-out}
:root[data-motion="off"] *, :root[data-motion="off"] *::before, :root[data-motion="off"] *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion: reduce){:root:not([data-motion="on"]) *, :root:not([data-motion="on"]) *::before, :root:not([data-motion="on"]) *::after{animation:none!important;transition:none!important}}

/* ---------- animated marks (static = final state) */
mark{color:inherit;background:linear-gradient(var(--hi),var(--hi)) 0 85%/100% 62% no-repeat;padding:0 .08em;border-radius:2px}
.cap b{font-weight:650;background:linear-gradient(var(--hi),var(--hi)) 0 85%/100% 62% no-repeat}
s{text-decoration:none;position:relative;opacity:.5;display:inline-block}
s::after{content:"";position:absolute;left:-2px;right:-2px;top:52%;height:2.5px;background:var(--bad);border-radius:2px;transform-origin:left center}
ins{text-decoration:none;display:inline-block;background:var(--pencil-soft);color:var(--pencil-ink);border-radius:5px;padding:0 .18em;font-weight:650}
.ua,.ub{position:relative;background:linear-gradient(var(--ca),var(--ca)) 0 100%/100% 3px no-repeat;padding-bottom:2px}
.ub{background-image:linear-gradient(var(--cb),var(--cb))}
.ua[data-l]::after,.ub[data-l]::after{content:attr(data-l);position:absolute;left:0;top:100%;margin-top:4px;font:650 10.5px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--ca);white-space:nowrap}
.ub[data-l]::after{color:var(--cb)}
.bx,.bo{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font:650 13.5px/1.2 var(--f-ui);background:var(--bad-soft);color:var(--bad)}
.bo{background:var(--good-soft);color:var(--good)}
.bx::before{content:"\2715";font-size:11px}
.bo::before{content:"\2713";font-size:12px}
.chip{display:inline-flex;align-items:center;padding:6px 12px;border-radius:999px;border:1.5px solid var(--rule);background:var(--surface);font:650 14px/1.2 var(--f-ui)}
.chip.hot{background:var(--pencil);border-color:var(--pencil);color:#15171C}
.arr{display:inline-block;color:var(--muted);font-weight:700}
.k{display:block}
span.k{display:inline-block}
.pop{transform-box:fill-box;transform-origin:center}
.draw{stroke-dasharray:1;stroke-dashoffset:0;fill:none}

/* ---------- bar + tabs */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--rule)}
.bar .wrap{display:flex;align-items:center;gap:10px;height:56px}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;cursor:pointer;font-weight:750;font-stretch:115%;font-size:16.5px;letter-spacing:-.01em;white-space:nowrap}
.brand svg{width:30px;height:16px;flex:0 0 auto}
.sync{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:0 0 auto}
.sync.db i{background:var(--good)}
@media (max-width:420px){.sync .sl{display:none}}
.gear{flex:0 0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;background:var(--surface);border-top:1px solid var(--rule);
  padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:6px 2px;border-radius:9px;font-size:11px;font-weight:650;color:var(--muted);cursor:pointer;position:relative;min-width:0}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .hl{fill:var(--pencil);stroke:var(--pencil)}
.badge{position:absolute;top:1px;left:calc(50% + 5px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:var(--on-bad);font:600 11px/18px var(--f-mono);text-align:center}
.badge.p{background:var(--pencil);color:#15171C}
main{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
main.fresh{animation:fadein .25s ease-out}
@media (min-width:900px){
  .tabs{position:static;background:none;border:0;padding:0;margin-left:18px;gap:2px}
  .tab{flex:0 0 auto;flex-direction:row;font-size:14px;padding:7px 11px;gap:7px}
  .tab svg{width:18px;height:18px}
  .tab[aria-current="page"]{background:var(--sunken)}
  .badge{position:static;margin-left:2px}
  main{padding-bottom:56px}
}

/* ---------- buttons, pills */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:var(--r);border:1px solid var(--rule);background:var(--surface);color:var(--ink);font-weight:650;cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .12s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.primary{background:var(--btn);color:var(--btn-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.small{min-height:36px;padding:6px 12px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .sub{font-weight:500;opacity:.75;font-size:13px}
.btn svg{width:17px;height:17px}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-weight:600;font-size:13.5px}
.pill{display:inline-flex;align-items:center;font-size:11.5px;font-weight:650;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--sunken);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ai{background:var(--pencil-soft);color:var(--pencil-ink)}
.sec{font:600 10.5px/1 var(--f-mono);letter-spacing:.04em;padding:3px 6px;border-radius:5px;border:1px solid var(--rule);color:var(--muted);white-space:nowrap}
.lvm{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.lvm i{display:block;width:4px;border-radius:1px;background:var(--rule)}
.lvm i:nth-child(1){height:5px}.lvm i:nth-child(2){height:8px}.lvm i:nth-child(3){height:12px}
.lvm.E i:nth-child(1),.lvm.M i:nth-child(-n+2),.lvm.H i{background:var(--ink)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:40px;min-height:40px;padding:6px 10px;border-radius:9px;border:1px solid var(--rule);background:var(--surface);cursor:pointer;font-weight:650;font-size:13.5px;color:var(--ink)}
.iconbtn svg{width:18px;height:18px}
.iconbtn:disabled{opacity:.4;cursor:not-allowed}
.iconbtn[aria-pressed="true"]{background:var(--pencil-soft);border-color:var(--pencil);color:var(--pencil-ink)}

/* ---------- home */
.pbanner{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;align-items:center;width:100%;margin-top:16px;padding:14px 16px;border-radius:14px;border:0;background:var(--ink);color:var(--bg);text-align:left;cursor:pointer}
.pbanner .pb-k{font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:650;opacity:.8}
.pbanner .pb-t{font-size:22px;font-weight:800;font-stretch:118%;letter-spacing:-.01em}
.pbanner .pb-go{grid-row:1 / span 2;grid-column:2;background:var(--pencil);color:#15171C;border-radius:10px;padding:10px 14px;font-weight:700;white-space:nowrap}
@media (max-width:420px){.pbanner .pb-go{padding:8px 10px;font-size:13.5px}}
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px 32px;align-items:end;padding-block:22px 18px}
.big{font-size:68px;line-height:.86;font-weight:800;font-stretch:125%;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.goal{margin-top:8px;font-size:13.5px;color:var(--muted)}
.scales{display:grid;gap:12px;min-width:0}
.srow2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:baseline;font-size:13.5px}
.srow2 b{font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-weight:600}
.track{grid-column:1 / -1;position:relative;height:10px;background:var(--sunken);border-radius:5px}
.track .fillbar{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:5px;transform-origin:left}
.track .gt{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1.5px;background:var(--pencil);border-radius:2px}
.axis{grid-column:1 / -1;display:flex;justify-content:space-between;font:500 10.5px var(--f-mono);color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:12px;height:6px;border-radius:3px;background:var(--ink)}
.legend i.g{width:3px;height:12px;background:var(--pencil)}
@media (max-width:600px){.hero{grid-template-columns:1fr}.big{font-size:60px}}
.cta{display:flex;gap:10px;flex-wrap:wrap;padding-block:4px 6px}
.cta .btn.primary{flex:1 1 15rem;min-height:52px;font-size:16px;justify-content:space-between}
.cta .btn:not(.primary){flex:1 1 auto;min-height:52px}
.prog{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px;margin-top:14px;padding-bottom:20px;border-bottom:1px solid var(--rule)}
@media (max-width:560px){.prog{grid-template-columns:1fr 1fr}.prog .lvcard{grid-column:1 / -1}}
.pcard{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:12px 14px;min-width:0}
.pcard .eyebrow{display:block;margin-bottom:6px}
.lvrow{display:flex;align-items:center;gap:12px}
.lvbadge{width:46px;height:46px;border-radius:50%;background:var(--pencil);color:#15171C;display:grid;place-items:center;font:800 20px var(--f-ui);font-stretch:118%;flex:0 0 auto}
.lvbar{height:8px;border-radius:4px;background:var(--sunken);overflow:hidden;margin-top:6px}
.lvbar i{display:block;height:100%;background:var(--ink);border-radius:4px;transform-origin:left}
.lvbar.play i{animation:barfill .9s cubic-bezier(.2,.8,.2,1) both .1s}
.lvtxt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.lvtxt b{color:var(--ink);font-size:15px}
.ringrow{display:flex;align-items:center;gap:10px}
.ring{width:52px;height:52px;flex:0 0 auto;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .bgc{stroke:var(--sunken)}
.ring .fgc{stroke:var(--good);stroke-linecap:round}
.ring.play .fgc{animation:ringfill 1s cubic-bezier(.2,.8,.2,1) both .15s}
.bigsm{font-size:22px;font-weight:800;font-stretch:115%;font-variant-numeric:tabular-nums;line-height:1.05}
.section{padding-block:24px 4px}
.section > h2{font-size:19px;font-weight:750;font-stretch:110%;letter-spacing:-.01em;margin-bottom:4px}
.section > .lede{color:var(--muted);font-size:14px;margin:0 0 12px}
.focus{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--rule);border-radius:14px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:14px 16px}
.frow + .frow{border-top:1px solid var(--rule)}
.fname{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fsub{font-size:13px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.fact{display:flex;gap:8px;grid-column:1 / -1}
.fact .btn{flex:1}
@media (min-width:600px){.fact{grid-column:auto}.fact .btn{flex:0 0 auto}}
.skillmap{display:grid;gap:22px;grid-template-columns:1fr}
@media (min-width:760px){.skillmap{grid-template-columns:1fr 1fr;gap:28px}}
.skillmap h3{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:650;margin:14px 0 4px}
.skillmap h3:first-child{margin-top:0}
.skillmap h3.sm{font-size:15px;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:750;margin-bottom:6px}
.sbtn{display:grid;grid-template-columns:minmax(0,1fr) 72px 36px;gap:10px;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--rule);padding:9px 2px;text-align:left;cursor:pointer;font-size:14.5px}
.sbtn:hover .sname{text-decoration:underline;text-underline-offset:3px}
.sname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbar{height:6px;border-radius:3px;background:var(--sunken);position:relative;overflow:hidden}
.sbar i{position:absolute;inset:0 auto 0 0;background:var(--muted);border-radius:3px}
.sbar.good i{background:var(--good)}.sbar.warn i{background:var(--warn)}.sbar.bad i{background:var(--bad)}
.snum{font:500 12px var(--f-mono);color:var(--muted);text-align:right}
.foot{color:var(--muted);font-size:12.5px;padding-block:22px 0}

/* ---------- PERT view */
.phero{padding-block:22px 8px;display:grid;gap:4px}
.phero .when{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.phero .day{font-size:48px;line-height:.95;font-weight:800;font-stretch:122%;letter-spacing:-.03em}
@media (max-width:420px){.phero .day{font-size:38px}}

.listhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:16px 8px;flex-wrap:wrap}

.qmeta{display:flex;gap:8px;align-items:center;font:500 11.5px var(--f-mono);color:var(--muted);margin-top:2px}
.qright{display:flex;gap:10px;align-items:center}
.st{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--rule);display:grid;place-items:center;font-size:11px;font-weight:800}

/* ---------- words */
.wbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px}
.flash3d{perspective:1200px;margin-top:14px}
.flash3d.play{animation:slideR .35s cubic-bezier(.2,.8,.2,1) both}
.flash{display:block;position:relative;width:100%;min-height:260px;border:0;padding:0;background:none;cursor:pointer;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.2,1);color:var(--ink)}

.face{position:absolute;inset:0;display:grid;align-content:center;justify-items:center;gap:10px;padding:26px 20px;border:1px solid var(--rule);border-radius:16px;background:var(--surface);text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}

/* ---------- practice sheet */

.ptitle2{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.timer{font:600 14px var(--f-mono);font-variant-numeric:tabular-nums}

.segs{display:flex;gap:3px}

.segbar{height:5px;border-radius:3px;background:var(--sunken);overflow:hidden}

.combo{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:var(--pencil);color:#15171C;font:750 12.5px var(--f-ui);white-space:nowrap}

}
.ptools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.pass{font-family:var(--f-read);font-size:calc(17.5px * var(--rs));line-height:1.62}
.pass p{margin:0 0 10px}
.pass .sn{border-radius:4px;transition:opacity .2s,background-color .2s;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.pass.focus .sn{opacity:.3;cursor:pointer}
.pass.focus .sn.on,.pass .sn.say{opacity:1;background:var(--hi)}
.notes{margin:10px 0 0;padding-left:1.15em}
.notes li{margin:5px 0}
.blank,.blankk{display:inline-block;width:3.4em;border-bottom:2px solid var(--ink);vertical-align:-2px;margin:0 2px}
.stem{font-family:var(--f-read);font-size:calc(17.5px * var(--rs));line-height:1.55}
.stem b,.pass b{font-weight:650}
.fig{margin:10px 0 4px;max-width:440px}
.fig svg{width:100%;height:auto;display:block}
.fig .ax{stroke:var(--muted);stroke-width:1.2}
.fig .gd{stroke:var(--rule);stroke-width:1}
.fig .pt{fill:var(--ink)}
.fig .ln{stroke:var(--pencil);stroke-width:2.5}

.fig .plsvg,.fig .grsvg{max-width:250px}
.fig .nlsvg{max-width:320px}
.nlsvg,.plsvg,.grsvg{width:100%;height:auto;display:block}
.nl,.nt{stroke:var(--muted);stroke-width:1.5}
.na{fill:var(--muted)}
.ntx{fill:var(--muted);font:500 11px var(--f-mono)}
.nr{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.nra{fill:var(--ink)}
.nc{fill:var(--surface);stroke:var(--ink);stroke-width:2.5}

.pg{stroke:var(--rule);stroke-width:1}

.ptx{fill:var(--muted);font:500 10px var(--f-mono)}
.ptl{fill:var(--muted);font:italic 600 13px var(--f-read)}
.pln{stroke:var(--ca);stroke-width:3;stroke-linecap:round}
.ppt{fill:var(--ca)}
.gs{fill:var(--ca);stroke:var(--surface);stroke-width:1}
.gu{fill:var(--surface);stroke:var(--rule);stroke-width:1}
.choices{display:grid;gap:10px;margin-top:16px}
.chrow{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px;align-items:stretch}
.chrow.done{grid-template-columns:minmax(0,1fr)}
.ch{display:flex;gap:12px;align-items:flex-start;width:100%;padding:12px 14px;border:1.5px solid var(--rule);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left;font-family:var(--f-read);font-size:calc(16.5px * var(--rs));line-height:1.45;position:relative;transition:border-color .15s,background-color .2s;color:var(--ink)}
.ch:hover:not(:disabled){border-color:var(--muted)}
.ch:disabled{cursor:default}
.bub{flex:0 0 auto;width:28px;height:28px;margin-top:-1px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font:700 13px var(--f-ui);position:relative;isolation:isolate}
.bub::before{content:"";position:absolute;inset:-1.5px;border-radius:50%;background:var(--mark);transform:scale(0);z-index:-1;transition:transform .18s cubic-bezier(.2,1.4,.4,1)}
.ct{min-width:0;padding-top:1px;flex:1}
.ct svg{display:block;max-width:100%;height:auto}
.ct .ntx{font-size:14px}
.ch.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ch.sel .bub{color:var(--mark-ink)}
.ch.sel .bub::before{transform:scale(1)}
.ch.ok{border-color:var(--good);background:var(--good-soft);box-shadow:none}

.ch.ok .bub::before{background:var(--good);transform:scale(1)}
.ch.no{border-color:var(--bad);background:var(--bad-soft);box-shadow:none}
.ch.no .bub{border-color:var(--bad);color:var(--surface)}
.ch.no .bub::before{background:var(--bad);transform:scale(1)}
.ch.no.shake{animation:shake .45s ease-out}
.ch.ok.glow{animation:pulse 1s ease-out 2}
.ch.struck .ct{text-decoration:line-through;text-decoration-thickness:1.5px;opacity:.42}
.ch.struck .bub{opacity:.42}
.xbtn{border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);cursor:pointer;color:var(--muted);font:700 13px var(--f-ui)}
.xbtn span{text-decoration:line-through;text-decoration-thickness:2px}
.xbtn[aria-pressed="true"]{background:var(--sunken);color:var(--ink);border-color:var(--muted)}
.burst{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;z-index:2}
.burst i{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:2px;background:var(--pencil);animation:fly .75s cubic-bezier(.1,.7,.3,1) both}
.burst i:nth-child(3n){background:var(--good);border-radius:50%}
.burst i:nth-child(4n){background:var(--ca)}
.xpf{position:absolute;right:14px;top:-6px;font:800 14px var(--f-ui);color:var(--good);pointer-events:none;animation:floatup 1.4s ease-out both .15s}
.spr{display:grid;gap:6px;margin-top:16px;max-width:20rem}
.spr label{font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.spr input{min-height:52px;border:1.5px solid var(--ink);border-radius:var(--r);background:var(--surface);padding:10px 14px;font:600 20px var(--f-mono)}

.spr input.no{border-color:var(--bad);background:var(--bad-soft)}

.spr .prev{font-family:var(--f-read);font-size:18px;min-height:1.6em}
.verdict{position:relative;display:flex;align-items:center;gap:10px;margin-top:18px;padding:12px 14px;border-radius:var(--r);font-weight:700}

.verdict .vt{margin-left:auto;font:500 12.5px var(--f-mono);color:var(--muted)}
.locked{margin-top:18px;padding:12px 14px;border-radius:var(--r);background:var(--sunken);color:var(--muted);font-size:14px}

/* ---------- step-by-step explanation */
.xpl{margin-top:16px;padding-top:14px;border-top:1px solid var(--rule)}
.xhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.xhead h3{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:650;margin-right:auto}
.xtools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.steps{display:grid;gap:6px;margin-top:10px}
.stp{padding:12px 14px;border-radius:12px;border:1px solid var(--rule);background:var(--surface)}
.stp.old{border-color:transparent;background:transparent;padding:3px 14px;opacity:.55}
.stp.cur{border:1.5px solid var(--ink);box-shadow:0 8px 22px var(--shadow)}
.stp.all{background:transparent;border-color:transparent;padding:4px 2px}
.stp.trap.cur{border-color:var(--bad);background:var(--bad-soft);box-shadow:none}
.stp.trap.all{border-left:3px solid var(--bad);padding-left:12px;border-radius:0}
.stp.cur.play{animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
.tg{display:inline-block;font:650 10.5px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--bad);margin-bottom:4px}
.ann{font:650 12px var(--f-ui);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.ann .m{text-transform:none;letter-spacing:0;font-size:1.15em}
.eql{font-family:var(--f-read);font-size:calc(21px * var(--rs));line-height:1.55;overflow-x:auto;overflow-y:hidden}
.stp.old .eql{font-size:calc(16px * var(--rs))}
.cap{font-family:var(--f-read);font-size:calc(17px * var(--rs));line-height:1.6}
.stp.old .cap{font-size:calc(14.5px * var(--rs))}
.stp.old .ann{font-size:10.5px}
.xnav{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.stp,.xnav,.verdict,.pass .sn,#xpl{scroll-margin-top:96px;scroll-margin-bottom:104px}
.dots{display:flex;gap:5px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--rule);transition:background-color .2s}
.dots i.on{background:var(--ink)}
.xcnt{font:500 12.5px var(--f-mono);color:var(--muted);margin-right:auto}
.xnav .btn.primary{min-width:8.5rem}
.dz{margin-top:12px;background:var(--sunken);border-radius:var(--r);padding:10px 12px;font-size:14.5px;line-height:1.5}

.dz b{font-weight:700}
.more{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.genmsg{margin-top:10px;font-size:14px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tutor{margin-top:16px;padding:14px;border:1px solid var(--rule);border-radius:14px;background:var(--surface)}
.tutor h3{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:650;margin-bottom:6px}
.tmsgs{display:grid;gap:10px;margin-bottom:10px}
.tm{font-size:calc(15px * var(--rs));line-height:1.55;padding:10px 12px;border-radius:12px;max-width:100%}
.tm.u{justify-self:end;background:var(--sunken);max-width:85%}
.tm.a{background:var(--pencil-soft);color:var(--ink)}
.tm.err{background:var(--bad-soft);color:var(--bad)}
.tchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tchips button{border:1px solid var(--rule);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.tform{display:flex;gap:8px}
.tform input{flex:1;min-width:0;min-height:44px;border:1px solid var(--rule);border-radius:var(--r);background:var(--bg);padding:8px 12px;font-size:15px}
.pfoot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--rule);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pfoot .in{max-width:72rem;margin:0 auto;display:flex;gap:10px;align-items:center}
.pfoot .grow{flex:1}
.pfoot .btn.primary{min-width:8.5rem}
.hintline{font-size:12.5px;color:var(--muted)}
@media (max-width:520px){.hintline{display:none}}

/* ---------- PERT-style calculator */
.calc{position:fixed;z-index:30;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:236px;max-width:calc(100% - 24px);background:var(--surface);border:1px solid var(--rule);border-radius:14px;box-shadow:0 14px 40px var(--shadow);padding:10px}
.calc.play{animation:rise .25s both}
.calc header{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:650;color:var(--muted);margin-bottom:6px}
.calc .disp{font:600 26px/1.2 var(--f-mono);text-align:right;padding:6px 8px;border-radius:8px;background:var(--sunken);overflow:hidden;white-space:nowrap;font-variant-numeric:tabular-nums}
.calc .opl{font:500 11px var(--f-mono);color:var(--muted);text-align:right;height:16px;margin-top:2px;overflow:hidden;white-space:nowrap}
.calc .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.calc .keys button{min-height:40px;border-radius:9px;border:1px solid var(--rule);background:var(--bg);font:600 17px var(--f-ui);cursor:pointer;color:var(--ink)}
.calc .keys button.op{background:var(--sunken)}
.calc .keys button.eq{background:var(--btn);color:var(--btn-ink);border-color:transparent}
.calc .cnote{font-size:11.5px;color:var(--muted);margin:8px 2px 0;line-height:1.35}

/* ---------- math */
.m{font-family:var(--f-read)}
.m i{font-style:italic;padding-right:.02em}
.m .rel{margin:0 .3em}
.m .bin{margin:0 .22em}
.m sup,.m sub{font-size:.72em;line-height:0}
.m sup{vertical-align:.6em}
.m sub{vertical-align:-.25em}
.m mark{padding:0 .1em}
.m ins.mi{margin:0 .15em;font-weight:inherit}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.88em;line-height:1.15;margin:0 .12em;white-space:nowrap}
.fn{border-bottom:1.2px solid currentColor;padding:0 .2em .06em}
.fd{padding:.06em .2em 0}
.rt{display:inline-flex;align-items:baseline;white-space:nowrap}
.rs{font-size:1.06em;margin-right:-.02em}
.rb{border-top:1.2px solid currentColor;padding:.04em .12em 0 .1em}
.ri{font-size:.62em;margin-right:-.42em;position:relative;top:-.62em}
.tx,.fnn{font-style:normal}
.fnn{margin-right:.2em}
.ov{text-decoration:overline}
.eqs{display:block;width:fit-content;margin:4px 0 14px;padding:6px 16px;border-left:3px solid var(--rule);font-size:18px;line-height:1.9}

/* ---------- tables */
.tw{overflow-x:auto;margin:12px 0}
.dt{border-collapse:collapse;font-family:var(--f-ui);font-size:14px;font-variant-numeric:tabular-nums}
.dt caption{caption-side:top;text-align:left;font-weight:650;font-size:13px;color:var(--muted);padding-bottom:6px}
.dt th,.dt td{border:1px solid var(--rule);padding:6px 12px;text-align:left}
.dt thead th{background:var(--sunken);font-weight:650}

/* ---------- dialogs */
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fadein .2s ease-out;
  padding:max(16px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px))}
.scrim.still{animation:none}
.dlg{background:var(--surface);color:var(--ink);width:100%;max-width:36rem;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.scrim:not(.still) .dlg{animation:rise .3s cubic-bezier(.2,.8,.2,1) both}
.dlg.wide{max-width:42rem}
@media (min-width:700px){.scrim{align-items:center;padding-bottom:16px}.dlg{border-radius:18px}}
.dlg header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.dlg header h2{font-size:19px;font-weight:750;font-stretch:110%}
.dlg header .iconbtn{margin-left:auto;flex:0 0 auto}
.dlg header .eyebrow{display:block}
.lesson{font-size:15.5px;line-height:1.6}
.lesson ul{padding-left:1.2em;margin:8px 0}
.lesson li{margin:6px 0}
.lesson .trap{background:var(--bad-soft);color:var(--ink);border-radius:var(--r);padding:10px 12px;margin-top:10px}
.lesson .tip{background:var(--sunken);border-radius:var(--r);padding:10px 12px;margin-top:10px}
.lstage{position:relative;min-height:236px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:22px 14px;border-radius:14px;background:var(--bg);border:1px solid var(--rule);overflow:hidden;--gap:.5s;--lead:.2s}
.lstage .sx{font-family:var(--f-read);font-size:calc(21px * var(--rs));line-height:2.2;margin:0;max-width:30rem}
.lstage .ln{font-family:var(--f-read);font-size:calc(22px * var(--rs));line-height:1.6;max-width:100%;overflow-x:auto;overflow-y:hidden}
.lstage .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin:4px 0}
.lstage .big{font-size:34px;line-height:1.1;font-weight:800;font-stretch:115%;letter-spacing:-.02em}
.lstage .sub{color:var(--muted);font-size:16px;margin:0}
.lstage .stack{display:grid;gap:8px;width:100%;max-width:26rem}
.lstage .optn{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:10px;border:1px solid var(--rule);background:var(--surface);text-align:left;font-size:14.5px}
.lstage .trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;max-width:26rem}
.lstage .card3{display:grid;gap:2px;padding:14px 8px;border-radius:12px;background:var(--surface);border:1px solid var(--rule)}
.lstage .card3 b{font-size:17px}
.lstage .card3 span{font-size:12.5px;color:var(--muted)}
.lstage .stairs{display:flex;align-items:flex-end;gap:8px;height:100px}
.lstage .stairs span{display:grid;place-items:end center;width:78px;padding-bottom:8px;border-radius:8px 8px 4px 4px;background:var(--sunken);font-weight:700;font-size:13px}
.lstage .stairs .st1{height:40px}.lstage .stairs .st2{height:66px}.lstage .stairs .st3{height:96px;background:var(--pencil);color:#15171C}
.lstage .umb{display:grid;gap:10px;justify-items:center}
.lstage .autol{font-family:var(--f-read);font-size:calc(20px * var(--rs));line-height:1.5;max-width:30rem}
.lstage .autol.trap{color:var(--bad)}
.lstage svg.mini{width:170px;height:auto;max-width:100%}
.lstage .nlsvg{max-width:300px}
.mini .l1{stroke:var(--ca);stroke-width:3.5;stroke-linecap:round}
.mini .l2{stroke:var(--cb);stroke-width:3.5;stroke-linecap:round}
.mini .run{stroke:var(--cb);stroke-width:3}
.mini .rise{stroke:var(--good);stroke-width:3}
.mini .dt{fill:var(--pencil);stroke:var(--ink);stroke-width:2}
.mini .tl{fill:var(--ink);font:650 12px var(--f-ui)}
.lcap{font-family:var(--f-read);font-size:calc(18px * var(--rs));line-height:1.5;margin:14px 2px 0;min-height:3em}
.lcap.play{animation:fadein .4s both}
.lnav{display:flex;align-items:center;gap:8px;margin-top:12px}
.lnav .dots{margin:0 auto}
.lend{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.astext{margin-top:14px;border-top:1px solid var(--rule);padding-top:10px}
.astext summary{cursor:pointer;font-weight:650;font-size:14px;color:var(--muted)}
.ref{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ref div{border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px}
.ref .rl{font-size:12px;color:var(--muted);font-weight:650;display:block;margin-bottom:4px}
.ref .rf{font-family:var(--f-read);font-size:16px}
.ref .full{grid-column:1 / -1}
.opts{display:grid;gap:16px}
.opts fieldset{border:0;padding:0;margin:0}
.opts legend{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:650;margin-bottom:6px}
.opts .help{font-size:13px;color:var(--muted);margin:6px 0 0}
.choicegrp{display:flex;gap:8px;flex-wrap:wrap}
.choicegrp button{border:1.5px solid var(--rule);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:650;cursor:pointer;color:var(--ink)}
.choicegrp button[aria-pressed="true"]{border-color:var(--ink);background:var(--sunken)}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
.navgrid button{min-height:44px;border:1.5px solid var(--rule);border-radius:9px;background:var(--surface);font:600 14px var(--f-mono);cursor:pointer;position:relative;color:var(--ink)}
.navgrid button.ans{background:var(--sunken);border-color:var(--muted)}
.navgrid button.cur{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.navgrid button.fl::after{content:"";position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--pencil)}
.dlg .drow{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.breathe{display:grid;place-items:center;margin:8px auto 4px;width:170px;height:170px;position:relative}
.breathe .orb{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--pencil-soft),var(--pencil));animation:breathe 8s ease-in-out infinite}
.breathe .w1,.breathe .w2{position:absolute;font-weight:750;color:#15171C}
.breathe .w1{animation:inout 8s linear infinite}
.breathe .w2{animation:outin 8s linear infinite}
.btimer{text-align:center;font:600 18px var(--f-mono);color:var(--muted)}

/* ---------- results */
.score2{display:flex;align-items:baseline;gap:6px;margin-top:8px}
.score2 b{font-size:64px;font-weight:800;font-stretch:125%;line-height:.9;letter-spacing:-.03em}
.score2 span{font-size:22px;color:var(--muted);font-weight:700}
.bytbl{width:100%;border-collapse:collapse;margin-top:14px;font-size:14.5px}
.bytbl td{padding:9px 2px;border-bottom:1px solid var(--rule)}
.bytbl td:last-child{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.readout{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--rule);font-size:14.5px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);
  padding:10px 12px 10px 16px;border-radius:12px;display:flex;gap:12px;align-items:center;width:max-content;max-width:calc(100% - 32px);font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:fadein .3s both}
.toast.lvl{background:var(--pencil);color:#15171C;font-weight:750}
.toast button{background:var(--bg);color:var(--ink);border:0;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer}
@media (min-width:900px){.toast{bottom:28px}}

/* ---------- Kite Prep theme: white cards, blue accents, Bluebook-style practice (OnePrep feel) */
.bar{background:var(--surface)}
.brand{gap:10px;font-size:19px;font-weight:800;letter-spacing:-.025em}
.brand svg.kite{width:32px;height:32px;border-radius:9px;box-shadow:0 2px 6px rgba(33,66,210,.25)}
.wm b{color:var(--ink);font-weight:800}
.wm i{font-style:normal;color:var(--brand);font-weight:800}
.tab{font-weight:600}
.tab[aria-current="page"]{color:var(--brand)}
.tab[aria-current="page"] .hl{fill:var(--brand);stroke:var(--brand)}
@media (max-width:899px){.tab[aria-current="page"]::before{content:"";position:absolute;top:-7px;left:26%;right:26%;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}}
.btn{border-radius:12px;transition:transform .12s,background-color .15s,border-color .15s,box-shadow .15s}
.btn:hover:not(:disabled){border-color:var(--edge)}
.btn.primary{box-shadow:0 1px 2px rgba(16,24,40,.12),inset 0 -2px 0 rgba(0,0,0,.12)}
.btn.primary:hover:not(:disabled){background:var(--brand-2);border-color:transparent}
.iconbtn{border-radius:10px}
.chip.hot,.badge.p,.cd,.combo,.toast.lvl,.lstage .stairs .st3,.breathe .w1,.breathe .w2{color:var(--brand-ink)}
.pbanner{background:linear-gradient(120deg,#3B67F5 0%,#1F3FC4 100%);color:#fff;box-shadow:0 8px 24px rgba(31,63,196,.25)}
.pbanner .pb-go{background:#fff;color:#1F3FC4}
.lvbadge{background:linear-gradient(135deg,#FFD25A,#F59E0B);color:#3B2600}
.lvbar i,.track .fillbar,.segbar i,.segs i.ans,.legend i{background:var(--brand)}
.segs i.cur{background:var(--brand-soft);box-shadow:0 0 0 1.5px var(--brand) inset}
.sbig.hot{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.sbig.hot span{color:var(--brand-ink);opacity:.85}
.mvn{background:var(--brand);color:var(--brand-ink)}
.dzbtn[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.dots i.on,.dzcn .dots i.on{background:var(--brand)}
.pcard,.focus,.tcard,.facts,.sbig,.chk,.move,.dzhero,.dzcard,.empty,.lstage{border-color:var(--rule);border-radius:16px;box-shadow:var(--card-sh)}
.qlist{border:1px solid var(--rule);border-radius:16px;background:var(--surface);overflow:hidden;box-shadow:var(--card-sh)}
.qrow{padding:12px 14px}
.qrow:hover{background:var(--bg)}
.qlist > li:last-child .qrow,.qlist > .qrow:last-child{border-bottom:0}
.lvm.E i:nth-child(1){background:var(--good)}
.lvm.M i:nth-child(-n+2){background:var(--warn)}
.lvm.H i{background:var(--bad)}
.lvchip{display:inline-flex;align-items:center;font:700 11.5px var(--f-ui);padding:3px 9px;border-radius:999px}
.lvchip.E{background:var(--good-soft);color:var(--good)}

.seg{background:var(--sunken)}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"],.seg .on{background:var(--surface);color:var(--brand);box-shadow:0 1px 2px rgba(16,24,40,.1)}
.filters select{border-radius:10px}
/* practice: Bluebook-style dashed bars, number box, blue choices */
body.prac{background:var(--surface)}
body.prac .dzhint{background:var(--bg)}

.ch{border-color:var(--edge);border-radius:12px}

  .sync .sl{display:inline!important}

}

/* ---------- Desmos pad: graph on top, expressions below (phones); docked on the right on wide screens */
:root{--dz-bg:#FFFFFF;--dz-minor:rgba(20,24,32,.055);--dz-major:rgba(20,24,32,.15);--dz-axis:rgba(20,24,32,.8);--dz-label:#3B414D;--dz-poi:#8E939D;--dz-lab-bg:rgba(255,255,255,.97);--dz-lab-ink:#15171C;--dz-target:rgba(20,24,32,.5);--dz-empty:#D3D7DE;--dz-cap:#EEF3FF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--dz-bg:#13161B;--dz-minor:rgba(255,255,255,.045);--dz-major:rgba(255,255,255,.12);--dz-axis:rgba(236,238,242,.78);--dz-label:#AEB5C1;--dz-poi:#8A909B;--dz-lab-bg:rgba(27,30,37,.97);--dz-lab-ink:#ECEEF2;--dz-target:rgba(236,238,242,.55);--dz-empty:#3A3F49;--dz-cap:#18213D}}
:root[data-theme="dark"]{--dz-bg:#13161B;--dz-minor:rgba(255,255,255,.045);--dz-major:rgba(255,255,255,.12);--dz-axis:rgba(236,238,242,.78);--dz-label:#AEB5C1;--dz-poi:#8A909B;--dz-lab-bg:rgba(27,30,37,.97);--dz-lab-ink:#ECEEF2;--dz-target:rgba(236,238,242,.55);--dz-empty:#3A3F49;--dz-cap:#18213D}
.dzp{position:fixed;left:0;right:0;top:0;height:100%;z-index:70;display:flex;flex-direction:column;background:var(--surface);color:var(--ink);animation:fadein .2s ease-out}
.dzp[hidden]{display:none}
body.dzopen:not(.dzdock){overflow:hidden}
.dzhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:0 0 auto;border-bottom:1px solid var(--rule);
  padding:calc(6px + env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) 6px max(12px,env(safe-area-inset-left,0px))}
.dzhl{display:flex;align-items:center;gap:9px;min-width:0}
.dzlogo svg{width:26px;height:26px;display:block}
.dzhtx{display:flex;flex-direction:column;min-width:0}
.dztitle{font-weight:750;font-size:15.5px;line-height:1.2;font-stretch:108%}
.dzsub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dzhr{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.dzhr .btn.small{min-height:36px;padding:6px 10px}
.dzreal{display:none!important}
@media (min-width:560px){.dzreal{display:inline-flex!important}}
.dzclose{min-width:40px;min-height:40px}
.dzgraph{position:relative;flex:0 0 auto;height:clamp(200px,40vh,440px);border-bottom:1px solid var(--rule);overflow:hidden;touch-action:none;background:var(--dz-bg)}
.dzp.typing .dzgraph{height:clamp(180px,34vh,380px)}
.dzp.kbon .dzgraph{height:clamp(160px,30vh,360px)}
.dzgraph canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.dzgraph canvas:active{cursor:grabbing}
.dzzoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.dzzoom button{width:36px;height:36px;border-radius:9px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);font:700 19px/1 var(--f-ui);display:grid;place-items:center;box-shadow:0 1px 3px var(--shadow);cursor:pointer;padding:0}
.dzzoom svg{width:17px;height:17px}
.dzzoom .dzdeg{font:700 10px var(--f-mono);letter-spacing:.03em}
.dzload{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:12.5px;color:var(--muted);display:none}
.dzp.loading .dzload{display:block}
.dzkey{position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none}
.dzkey.on{animation:keyfl 1.15s ease-out both}
.dzkey kbd{min-width:40px;height:36px;padding:0 8px;border-radius:9px;border:1.5px solid var(--ink);border-bottom-width:4px;background:var(--surface);color:var(--ink);font:700 18px var(--f-ui);display:grid;place-items:center}
.dzkey span{background:var(--ink);color:var(--bg);font:650 12.5px var(--f-ui);padding:5px 9px;border-radius:7px}
@keyframes keyfl{0%{opacity:0;transform:translateY(8px) scale(.9)}14%{opacity:1;transform:none}72%{opacity:1}100%{opacity:0}}
.dzcap{flex:0 0 auto;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));background:var(--dz-cap);border-bottom:1px solid var(--rule);max-height:38vh;overflow-y:auto}
.dzct{font-family:var(--f-read);font-size:calc(16.5px * var(--rs));line-height:1.45}
.dzct.in.play{animation:rise .35s both}
.dzct .m{white-space:nowrap}
.dzans{display:inline-flex;margin-top:8px;padding:5px 12px;border-radius:999px;background:var(--good-soft);color:var(--good);font:700 14.5px var(--f-ui)}
.dzcn{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
.dzcn .dots{display:flex;gap:4px;margin-right:auto}
.dzcn .dots i{width:7px;height:7px;border-radius:50%;background:var(--rule)}
.dzcn .dots i.on{background:var(--ink)}
.dzcc{font:600 12px var(--f-mono);color:var(--muted)}
.dzcn .btn.small{min-height:36px;padding:6px 12px}
.dztgt{display:flex;flex-direction:column;gap:4px}
.dzbig{font-size:calc(24px * var(--rs));font-family:var(--f-read);padding:2px 0;transition:color .2s}
.dzbig.ok{color:var(--good)}
.dzbig.ok::after{content:"  ✓";font-family:var(--f-ui);font-weight:800}
.dztip{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.dzpeek{flex:0 0 auto;border-bottom:1px solid var(--rule);background:var(--bg)}
.dzpk-t{display:flex;align-items:flex-start;gap:8px;width:100%;padding:8px 12px;border:0;background:none;text-align:left;cursor:pointer}
.dzpk-t .eyebrow{flex:0 0 auto;padding-top:2px}
.dzpk-s{flex:1;min-width:0;font:15px/1.4 var(--f-read);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dzpk-s .eqs{display:inline}
.dzpk-s table,.dzpk-s .tw{display:none}
.dzpeek .chev{flex:0 0 auto;color:var(--muted);transition:transform .2s}
.dzpeek.open .chev{transform:rotate(180deg)}
.dzpeek.open .dzpk-s{display:none}
.dzpk-b{padding:0 12px 10px}
.dzpk-full{display:none;font:15.5px/1.5 var(--f-read);margin-bottom:8px;max-height:30vh;overflow:auto}
.dzpeek.open .dzpk-full{display:block}
.dzpk-ch{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.dzpk-ch button{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1.5px solid var(--rule);background:var(--surface);border-radius:9px;padding:5px 10px;font:15px var(--f-read);cursor:pointer;max-width:70vw}
.dzpk-ch button b{font:700 12px var(--f-ui);width:20px;height:20px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;flex:0 0 auto}
.dzpk-ch button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dzpk-ch button[aria-pressed="true"] b{background:var(--mark);color:var(--mark-ink)}
.dzpk-ch svg{max-height:28px;width:auto}
.dzpk-sp{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.dzpk-sp input{width:110px;padding:6px 9px;border:1.5px solid var(--rule);border-radius:8px;background:var(--surface);font:600 16px var(--f-mono)}
.dzlist{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;min-height:64px}
.dzr{display:grid;grid-template-columns:42px minmax(0,1fr) 36px;border-bottom:1px solid var(--rule);min-height:54px;background:var(--surface);position:relative}
.dzr.on{background:var(--bg)}
.dzr.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.dzr.typing{background:var(--pencil-soft)}
.dzr.typing::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--pencil)}
.dzgut{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:var(--sunken);color:var(--muted);font:600 10.5px/1 var(--f-mono)}
.dzdot{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--c);background:var(--c);padding:0;cursor:pointer;visibility:hidden}
.dzdot.show{visibility:visible}
.dzdot.off{background:transparent}
.dzdot.ineq{border-radius:6px}
.dzdot.pt{width:16px;height:16px}
.dzmain{padding:6px 2px 6px 10px;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
.dzf{font-size:calc(19px * var(--rs));min-height:32px;display:flex;align-items:center;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.dzf::-webkit-scrollbar{display:none}
.dzmq{display:block;min-width:100%}
.dzp .mq-editable-field{border:0!important;box-shadow:none!important;cursor:text;min-width:100%;color:var(--ink)}
.dzp .mq-root-block{padding:5px 2px}
.dzp .mq-math-mode *{border-color:currentColor}
.dzp .mq-editable-field .mq-cursor{border-left:2px solid var(--ink);margin-left:-1px}
.dzp .mq-math-mode .mq-empty{background:var(--dz-empty)}
.dzp .mq-math-mode .mq-empty.mq-root-block{background:transparent}
.dzp .mq-math-mode{font-family:var(--f-read)}
.dzp .mq-math-mode var,.dzp .mq-math-mode .mq-nonSymbola{font-family:var(--f-read)}
.dzp .mq-math-mode .mq-operator-name{font-family:var(--f-ui);font-size:.88em}
.dzp .mq-selection,.dzp .mq-selection *{background:var(--focus)!important;color:#fff!important}
.dzpl{width:100%;border:0;background:transparent;color:var(--ink);font:500 17px var(--f-mono);padding:5px 0;outline:none}
.dzo{font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-family:var(--f-read)}
.dzo:empty{display:none}
.dzeq{color:var(--muted)}
.dzo .dzfr{margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--sunken);font:600 12.5px var(--f-mono);color:var(--ink)}
.dzo.err{color:var(--warn)}
.dzerr{font:500 13px var(--f-ui)}
.dzneed{font:600 12.5px var(--f-ui)}
.dzchip{border:1.5px solid var(--c);color:var(--ink);background:var(--surface);border-radius:999px;padding:4px 12px;font:650 13.5px var(--f-ui);cursor:pointer;min-height:32px}
.dzsl{display:flex;align-items:center;gap:8px;width:100%;font:500 11px var(--f-mono);color:var(--muted)}
.dzsl input{flex:1;min-width:0;accent-color:var(--c);height:28px}
.dzreg{display:flex;flex-wrap:wrap;gap:3px 14px;font:500 15px var(--f-read);color:var(--ink)}
.dzreg .r2{color:var(--muted)}
.dzmuted{font-style:italic}
.dzdel{border:0;background:none;color:var(--muted);font-size:21px;cursor:pointer;padding:0}
.dzdel:hover{color:var(--ink)}
.dzr.bad .dzgut{box-shadow:inset -2px 0 0 var(--warn)}
.dztbl{border-collapse:collapse;margin:2px 0 4px;font:500 15px var(--f-read)}
.dztbl th{font-weight:500;padding:3px 10px;border-bottom:1.5px solid var(--rule);text-align:center;min-width:76px}
.dztbl td{padding:0;border-bottom:1px solid var(--rule)}
.dztbl td+td,.dztbl th+th{border-left:1px solid var(--rule)}
.dztbl input{width:84px;border:0;background:transparent;text-align:center;font:500 15.5px var(--f-mono);padding:6px 4px;color:var(--ink)}
.dztbl input:focus{outline:2px solid var(--focus);outline-offset:-2px;border-radius:4px}
.dzadd{display:flex;gap:6px;padding:7px max(10px,env(safe-area-inset-right,0px)) 7px max(10px,env(safe-area-inset-left,0px));border-top:1px solid var(--rule);flex:0 0 auto;background:var(--surface)}
.dzadd button{border:1px solid var(--rule);background:var(--surface);border-radius:9px;padding:7px 12px;font:650 13.5px var(--f-ui);cursor:pointer;min-height:38px;color:var(--ink)}
.dzadd .dzkbd{margin-left:auto}
.dzadd .dzkbd[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dzkeys{flex:0 0 auto;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));background:var(--sunken);border-top:1px solid var(--rule)}
.dzkg{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px}
.dzkg.abc{grid-template-columns:repeat(10,minmax(0,1fr))}
.dzkg button,.dzknav button{height:40px;border-radius:8px;border:0;background:var(--surface);color:var(--ink);font:600 16px var(--f-ui);box-shadow:0 1px 0 var(--rule);cursor:pointer;padding:0;min-width:0;white-space:nowrap;overflow:hidden}
.dzkg.fn button{font-size:13px}
.dzkg button.n{background:var(--bg);font-family:var(--f-mono)}
.dzkg button[data-dz="kb"]{background:var(--ink);color:var(--bg);font-size:13px}
.dzknav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-top:5px}
.dzknav button{font-size:18px;background:var(--rule)}
.dzp.ghost .dzlist{pointer-events:none}
.dzp.ghost .dzadd,.dzp.ghost .dzkeys{display:none}
.dzp.ghost .dzhr [data-dz="clear"]{visibility:hidden}
.dzp.typing .dzadd,.dzp.typing .dzr .dzdel,.dzp.typing .dzhr [data-dz="clear"]{display:none}
@media (min-width:900px){
  .dzp.dock{left:auto;width:min(46vw,640px);border-left:1px solid var(--rule);box-shadow:-10px 0 30px var(--shadow)}
  .dzp.dock .dzgraph{height:clamp(240px,46vh,520px)}
  body.dzdock{padding-right:min(46vw,640px)}
  body.dzdock .pfoot{right:min(46vw,640px)}
  body.dzdock .toast{margin-left:calc(min(46vw,640px) / -2)}
}

/* ---------- Videos: full-screen animated walkthroughs */

  padding:calc(8px + env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}

.vtmini{width:min(100%,340px);align-self:center;opacity:.92;margin:0 0 2px}

.vtrow{padding:14px 16px;border-radius:16px;background:var(--surface);border:1.5px solid var(--rule)}

.vtrow.old .eql{font-size:calc(18px * var(--rs))}
.vtann{display:table;margin:0 auto 8px;font:650 14px var(--f-ui);color:var(--pencil-ink);background:var(--pencil-soft);padding:4px 12px;border-radius:999px}
.vtsay{font:calc(22px * var(--rs))/1.5 var(--f-read)}
.vtcap{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--rule);padding:10px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.vtcap[hidden]{display:none}
.vtsub{max-width:820px;margin:0 auto;font:calc(17px * var(--rs))/1.5 var(--f-read)}

.kara .kw:not(.on){color:var(--muted)}
.kara .m.kw:not(.on){opacity:.55}
.vtans{text-align:center;position:relative;padding:24px 0 6px}

.vtav{display:inline-flex;align-items:center;font:calc(32px * var(--rs))/1.3 var(--f-read);padding:12px 28px;border-radius:18px;background:var(--good-soft);color:var(--good);border:2px solid var(--good)}
.vtans .burst{left:50%;top:62%}
.vtend{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:24px}

.vtcd{width:100%;text-align:center;font:600 13px var(--f-ui);color:var(--muted)}
.vtbar{flex:0 0 auto;border-top:1px solid var(--rule);background:var(--surface);padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.vtprog{display:flex;gap:4px;max-width:820px;margin:2px auto 8px}

.vtprog button::after{content:"";position:absolute;left:0;top:0;bottom:0;width:calc(var(--f) * 100%);background:var(--ink);border-radius:inherit;transition:width .12s linear}

.vtchip svg{width:18px;height:18px}
.vtchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.xmedia .vlen{font:600 12.5px var(--f-mono);color:var(--pencil-ink)}

.vtrow .eql.cont{padding-top:0}

<script type="application/json" id="sat-data">{"profile":null,"learner":null,"domains":{"II":{"name":"Information and Ideas","sec":"RW","test":"SAT"},"CS":{"name":"Craft and Structure","sec":"RW","test":"SAT"},"EOI":{"name":"Expression of Ideas","sec":"RW","test":"SAT"},"SEC":{"name":"Standard English Conventions","sec":"RW","test":"SAT"},"ALG":{"name":"Algebra","sec":"M","test":"SAT"},"ADV":{"name":"Advanced Math","sec":"M","test":"SAT"},"PSD":{"name":"Problem-Solving and Data Analysis","sec":"M","test":"SAT"},"GEO":{"name":"Geometry and Trigonometry","sec":"M","test":"SAT"},"PM":{"name":"PERT Math","sec":"M","test":"PERT"},"PR":{"name":"PERT Reading","sec":"R","test":"PERT"},"PW":{"name":"PERT Writing","sec":"W","test":"PERT"}},"skills":{"bnd":{"name":"Boundaries","short":"Boundaries","dom":"SEC","lesson":"<p>Two complete sentences can be joined with a <b>period<\/b>, a <b>semicolon<\/b>, a <b>colon<\/b> (when the second explains the first), or a <b>comma + and/but/or/so<\/b>. A comma alone between them is a comma splice.<\/p>\n<ul><li>A colon or semicolon needs a complete sentence before it. Never put a colon right after <i>such as<\/i> or <i>including<\/i>.<\/li>\n<li>Extra information gets matching punctuation on both sides: two commas or two dashes.<\/li>\n<li>No punctuation between a subject and its verb, however long the subject is.<\/li>\n<li><i>However<\/i> and <i>therefore<\/i> starting a new sentence need a semicolon or period before them.<\/li>\n<li>List items that already contain commas are separated with semicolons.<\/li><\/ul>\n<p class=\"trap\">Trap: picking the punctuation that “sounds like a pause.” Punctuation follows sentence structure, not breathing.<\/p>"},"fss":{"name":"Form, Structure, and Sense","short":"Form & Sense","dom":"SEC","lesson":"<ul><li>Find the real subject (cross out <i>of …<\/i> phrases) and match the verb to it.<\/li>\n<li><i>its<\/i> = belonging to it; <i>it’s<\/i> = it is. Plural possessive: <i>scientists’<\/i>.<\/li>\n<li>Keep verb tense consistent with the rest of the passage.<\/li>\n<li>An opening phrase must be followed by the thing it describes.<\/li>\n<li>Every sentence needs a main verb. <i>-ing<\/i> and <i>to ___<\/i> forms can’t be the main verb.<\/li>\n<li>In flipped sentences (“Among the tools <b>is<\/b> a needle”), the subject comes after the verb.<\/li><\/ul>\n<p class=\"trap\">Trap: matching the verb to the noun right next to the blank instead of the true subject.<\/p>"},"tr":{"name":"Transitions","short":"Transitions","dom":"EOI","lesson":"<p>Cover the choices. Read the sentence before and after the blank and name the relationship yourself:<\/p>\n<ul><li><b>Same direction / example:<\/b> for example, in fact, similarly, moreover<\/li>\n<li><b>Contrast:<\/b> however, by contrast, even so, nevertheless, in reality<\/li>\n<li><b>Cause → effect:<\/b> therefore, for this reason, as a result, consequently<\/li>\n<li><b>Time:<\/b> later, previously, meanwhile, subsequently<\/li><\/ul>\n<p class=\"trap\">Trap: a transition that fits the second sentence alone but not its relationship to the first.<\/p>"},"rs":{"name":"Rhetorical Synthesis","short":"Notes Qs","dom":"EOI","lesson":"<ul><li>Read the goal in the question <b>first<\/b>. Skim the notes only after you know it.<\/li>\n<li>The right answer does exactly what the goal says: compare, contrast, introduce, emphasize, explain.<\/li>\n<li>Every wrong choice is accurate to the notes. Accuracy isn’t enough; the job has to match.<\/li>\n<li>For “an audience unfamiliar with X,” the answer has to say who or what X is.<\/li><\/ul>\n<p class=\"trap\">Trap: the choice with the most interesting fact instead of the one that matches the goal.<\/p>"},"wic":{"name":"Words in Context","short":"Word Choice","dom":"CS","lesson":"<ul><li>Predict your own word for the blank from clues in the text before reading the choices.<\/li>\n<li>Watch for signals that flip meaning: <i>although<\/i>, <i>but<\/i>, <i>however<\/i>, <i>instead<\/i>.<\/li>\n<li>Sort the choices by positive or negative first, then by exact meaning.<\/li>\n<li>A colon means the next part defines or explains the blank.<\/li><\/ul>\n<p class=\"trap\">Trap: a word that is related to the topic but doesn’t match the clue.<\/p>"},"coe":{"name":"Command of Evidence","short":"Evidence","dom":"II","lesson":"<ul><li>Data questions: check every number in the choice against the table <b>and<\/b> check that it addresses the claim (support vs. weaken).<\/li>\n<li>Most wrong choices state accurate data that doesn’t speak to the claim.<\/li>\n<li>“Which finding would support…” — pick the finding that tests the exact cause in the hypothesis while keeping everything else the same.<\/li><\/ul>\n<p class=\"trap\">Trap: a true data point about the wrong group or the wrong comparison.<\/p>"},"inf":{"name":"Inferences","short":"Inferences","dom":"II","lesson":"<ul><li>The answer must follow from the text, not from outside knowledge.<\/li>\n<li>Find the logical chain (because … so …) and finish it.<\/li>\n<li>Cut choices that go further than the text (<i>all<\/i>, <i>always<\/i>, <i>every country<\/i>).<\/li>\n<li>For “this conclusion assumes…” questions, pick the idea that must be true for the conclusion to hold.<\/li><\/ul>"},"cid":{"name":"Central Ideas and Details","short":"Main Idea","dom":"II","lesson":"<ul><li>The main idea covers the whole text, not one sentence of it.<\/li>\n<li>Say the main idea in your own words before reading the choices.<\/li><\/ul>\n<p class=\"trap\">Trap: a true detail from one line, presented as the main idea.<\/p>"},"tsp":{"name":"Text Structure and Purpose","short":"Structure","dom":"CS","lesson":"<ul><li>Ask what job the sentence does: introduce a problem, give an example, present a result, answer an earlier question, contrast a view.<\/li>\n<li>Read the sentences before and after the underlined part; the job depends on them.<\/li><\/ul>\n<p class=\"trap\">Trap: a choice that describes the right content with the wrong job.<\/p>"},"l1":{"name":"Linear equations in one variable","short":"1-var equations","dom":"ALG","lesson":"<ul><li>Distribute first, combine like terms, then get \\(x\\) alone.<\/li>\n<li>Clear fractions by multiplying every term by the common denominator.<\/li>\n<li>Word problems: total = fixed amount + rate × units.<\/li><\/ul>\n<p class=\"tip\">Desmos: type the whole equation (like \\(65 + 48x = 305\\)) and read the vertical line it draws.<\/p>"},"lf":{"name":"Linear functions","short":"Linear functions","dom":"ALG","lesson":"<ul><li>Slope = rate of change = \\(\\frac{\\text{change in } y}{\\text{change in } x}\\).<\/li>\n<li>\\(y\\)-intercept = starting value, when \\(x = 0\\).<\/li>\n<li>In \\(C = 100 - 8t\\), 8 is how much \\(C\\) drops for each 1-unit increase in \\(t\\).<\/li>\n<li>For \\(f(x) = ax + b\\), \\(a + b\\) is just \\(f(1)\\).<\/li><\/ul>"},"l2":{"name":"Linear equations in two variables","short":"2-var equations","dom":"ALG","lesson":"<ul><li>\\(Ax + By = C\\) has slope \\(-\\frac{A}{B}\\).<\/li>\n<li>Parallel lines: same slope. Perpendicular lines: negative reciprocal slopes.<\/li>\n<li>Price × quantity + price × quantity = total cost.<\/li><\/ul>"},"sys":{"name":"Systems of two linear equations in two variables","short":"Systems","dom":"ALG","lesson":"<ul><li>Elimination: add or subtract the equations to cancel a variable.<\/li>\n<li><b>No solution:<\/b> same slope, different intercepts (coefficients proportional, constants not).<\/li>\n<li><b>Infinitely many:<\/b> one equation is an exact multiple of the other.<\/li><\/ul>\n<p class=\"tip\">Desmos: graph both lines and tap where they cross.<\/p>"},"ineq":{"name":"Linear inequalities in one or two variables","short":"Inequalities","dom":"ALG","lesson":"<ul><li>“At most” → \\(\\le\\). “At least” → \\(\\ge\\).<\/li>\n<li>A point solves a system only if it works in <b>every<\/b> inequality. Plug in and check.<\/li>\n<li>Flip the sign when you multiply or divide by a negative.<\/li><\/ul>"},"eqx":{"name":"Equivalent expressions","short":"Equivalent exprs","dom":"ADV","lesson":"<ul><li>\\((a + b)^2 = a^2 + 2ab + b^2\\). Don’t forget the middle term.<\/li>\n<li>Subtracting a polynomial: the minus hits <b>every<\/b> term.<\/li>\n<li>Multiply powers → add exponents. Divide → subtract. Power of a power → multiply.<\/li>\n<li>\\(\\sqrt[n]{x^m} = x^{m/n}\\).<\/li><\/ul>\n<p class=\"tip\">Desmos: graph the original and each choice. The equivalent one lands exactly on top.<\/p>"},"nlf":{"name":"Nonlinear functions","short":"Nonlinear functions","dom":"ADV","lesson":"<ul><li>Exponential: \\(a(1 + r)^t\\) grows \\(r\\) percent per period; \\(a(1 - r)^t\\) decays.<\/li>\n<li>Vertex form \\(a(x - h)^2 + k\\): vertex \\((h, k)\\). It’s a maximum when \\(a < 0\\).<\/li>\n<li>Standard form: vertex at \\(x = -\\frac{b}{2a}\\).<\/li><\/ul>\n<p class=\"tip\">Desmos: graph it and tap the top, bottom, or intercepts.<\/p>"},"nle":{"name":"Nonlinear equations in one variable and systems of equations in two variables","short":"Nonlinear equations","dom":"ADV","lesson":"<ul><li>Factor, or use the quadratic formula.<\/li>\n<li>Discriminant \\(b^2 - 4ac\\): positive → 2 real solutions, zero → 1, negative → 0.<\/li>\n<li>Square-root equations: always check for fake (extraneous) solutions.<\/li>\n<li>\\(|A| = 9\\) means \\(A = 9\\) or \\(A = -9\\).<\/li><\/ul>\n<p class=\"tip\">Desmos: graph both sides and read the \\(x\\)-values where they meet.<\/p>"},"pct":{"name":"Percentages","short":"Percentages","dom":"PSD","lesson":"<ul><li>Percent change = \\(\\frac{\\text{new} - \\text{old}}{\\text{old}}\\).<\/li>\n<li>Successive changes multiply: up 40% then down 25% → \\(1.40 \\times 0.75\\).<\/li>\n<li>“\\(x\\) is \\(p\\)% of \\(y\\)” → \\(x = \\frac{p}{100}\\cdot y\\).<\/li><\/ul>\n<p class=\"trap\">Trap: adding or subtracting percents that should be multiplied.<\/p>"},"rat":{"name":"Ratios, rates, proportional relationships, and units","short":"Ratios & rates","dom":"PSD","lesson":"<ul><li>Find the unit rate first (miles per gallon, liters per minute).<\/li>\n<li>Convert units by multiplying by fractions equal to 1, like \\(\\frac{60 \\text{ min}}{1 \\text{ hr}}\\).<\/li>\n<li>A 5 : 2 ratio means 5 parts out of 7 total parts.<\/li><\/ul>"},"d1":{"name":"One-variable data: distributions and measures of center and spread","short":"Mean, median, spread","dom":"PSD","lesson":"<ul><li>An outlier pulls the mean but barely moves the median.<\/li>\n<li>Total = mean × number of values.<\/li>\n<li>Standard deviation = spread. Values bunched near the mean → smaller SD.<\/li><\/ul>"},"d2":{"name":"Two-variable data: models and scatterplots","short":"Scatterplots","dom":"PSD","lesson":"<ul><li>Slope of a best-fit line = predicted change in \\(y\\) for each 1-unit increase in \\(x\\).<\/li>\n<li>\\(y\\)-intercept = predicted \\(y\\) when \\(x = 0\\).<\/li><\/ul>"},"prob":{"name":"Probability and conditional probability","short":"Probability","dom":"PSD","lesson":"<ul><li>Probability = favorable ÷ total.<\/li>\n<li>“Given that…” or “of the students who…” shrinks the total to that group only.<\/li>\n<li>Without replacement: the second draw has one fewer item in the total.<\/li><\/ul>"},"area":{"name":"Area and volume","short":"Area & volume","dom":"GEO","lesson":"<ul><li>Cylinder \\(V = \\pi r^2 h\\). Cone \\(\\frac{1}{3}\\pi r^2 h\\). Sphere \\(\\frac{4}{3}\\pi r^3\\).<\/li>\n<li>These are on the reference sheet. Use it.<\/li><\/ul>"},"lat":{"name":"Lines, angles, and triangles","short":"Angles & triangles","dom":"GEO","lesson":"<ul><li>Triangle angles add to \\(180^\\circ\\). A straight line is \\(180^\\circ\\).<\/li>\n<li>Similar figures: lengths scale by \\(k\\), areas by \\(k^2\\).<\/li><\/ul>"},"trig":{"name":"Right triangles and trigonometry","short":"Right triangles & trig","dom":"GEO","lesson":"<ul><li>SOH-CAH-TOA.<\/li>\n<li>In a right triangle, \\(\\sin\\) of one acute angle = \\(\\cos\\) of the other.<\/li>\n<li>30-60-90 sides: \\(x, x\\sqrt{3}, 2x\\). 45-45-90 sides: \\(x, x, x\\sqrt{2}\\).<\/li>\n<li>Common triples: 3-4-5, 5-12-13, 6-8-10.<\/li><\/ul>"},"circ":{"name":"Circles","short":"Circles","dom":"GEO","lesson":"<ul><li>\\((x - h)^2 + (y - k)^2 = r^2\\): center \\((h, k)\\), radius \\(r\\).<\/li>\n<li>Expanded equation? Complete the square for \\(x\\) and for \\(y\\).<\/li>\n<li>Arc length = \\(\\frac{\\text{angle}}{360}\\cdot 2\\pi r\\).<\/li><\/ul>"},"pm-eq":{"name":"Linear and literal equations","short":"Equations","dom":"PM","lesson":"&lt;ul&gt;&lt;li&gt;An equation is a balance. Whatever you do to one side, do to the other side.&lt;/li&gt;&lt;li&gt;Undo adding and subtracting first. Then undo multiplying and dividing.&lt;/li&gt;&lt;li&gt;Check your answer by putting it back in. Both sides should match.&lt;/li&gt;&lt;li&gt;Distribute first. A negative in front of parentheses hits every term inside.&lt;/li&gt;&lt;li&gt;Solving for a letter works the same way. To get w alone in P = 2ℓ + 2w, subtract 2ℓ, then divide by 2.&lt;/li&gt;&lt;/ul&gt;"},"pm-ineq":{"name":"Inequalities and number lines","short":"Inequalities","dom":"PM","lesson":"&lt;ul&gt;&lt;li&gt;Solve an inequality the same way you solve an equation.&lt;/li&gt;&lt;li&gt;One new rule: when you multiply or divide by a negative, flip the sign.&lt;/li&gt;&lt;li&gt;On a number line, ≤ and ≥ get a filled circle. &lt; and &gt; get an open circle.&lt;/li&gt;&lt;li&gt;Shade toward the answers. Less than goes left. Greater than goes right.&lt;/li&gt;&lt;li&gt;Not sure which way? Test 0. If 0 makes it true, shade the side that has 0.&lt;/li&gt;&lt;/ul&gt;"},"pm-eval":{"name":"Evaluating and order of operations","short":"Order of operations","dom":"PM","lesson":"&lt;ul&gt;&lt;li&gt;Order of operations: parentheses, then exponents, then multiply and divide, then add and subtract.&lt;/li&gt;&lt;li&gt;Try it: 18 − 3 · 2² + 6 ÷ 2. The exponent goes first.&lt;/li&gt;&lt;li&gt;Multiply and divide go left to right as a pair. So do add and subtract. Don’t add first just because it comes first in PEMDAS.&lt;/li&gt;&lt;li&gt;Plugging in a negative? Put it in parentheses. (−2)² is 4, but −2² is −4.&lt;/li&gt;&lt;li&gt;The PERT calculator ignores order of operations. Do the multiplying and dividing yourself first.&lt;/li&gt;&lt;/ul&gt;"},"pm-exp":{"name":"Exponent rules","short":"Exponents","dom":"PM","lesson":"&lt;ul&gt;&lt;li&gt;Multiplying the same base? Add the exponents.&lt;/li&gt;&lt;li&gt;Dividing? Subtract them, top minus bottom.&lt;/li&gt;&lt;li&gt;A power of a power? Multiply them.&lt;/li&gt;&lt;li&gt;A negative exponent means the factor belongs on the other side of the fraction.&lt;/li&gt;&lt;li&gt;Anything to the zero power is 1. Numbers in front just multiply normally.&lt;/li&gt;&lt;/ul&gt;"},"pm-poly":{"name":"Polynomial operations","short":"Polynomials","dom":"PM","lesson":"&lt;ul&gt;&lt;li&gt;Combine like terms: same letter with the same exponent.&lt;/li&gt;&lt;li&gt;Subtracting a polynomial? The minus flips the sign of every term inside.&lt;/li&gt;&lt;li&gt;Multiplying two binomials: multiply every term by every term.&lt;/li&gt;&lt;li&gt;Dividing by one term: split it up and divide each piece. 3x ÷ 3x is 1, not 0.&lt;/li&gt;&lt;li&gt;Dividing by a binomial: factor the top, then cancel the matching factor.&lt;/li&gt;&lt;/ul&gt;"},"pm-fact":{"name":"Factoring and quadratic equations","short":"Factoring","dom":"PM","lesson":"&lt;ul&gt;&lt;li&gt;Always pull out the greatest common factor first.&lt;/li&gt;&lt;li&gt;For x² + bx + c, find two numbers that multiply to c and add to b.&lt;/li&gt;&lt;li&gt;A difference of squares splits into a minus and a plus.&lt;/li&gt;&lt;li&gt;To solve a quadratic, get 0 on one side, factor, then set each factor equal to 0.&lt;/li&gt;&lt;li&gt;The zero trick only works with 0. If the other side is 28, move the 28 over first.&lt;/li&gt;&lt;/ul&gt;"},"pm-line":{"name":"Lines, slope, and systems","short":"Lines & slope","dom":"PM","lesson":"&lt;ul&gt;&lt;li&gt;Slope is rise over run: how much the line goes up for each step to the right.&lt;/li&gt;&lt;li&gt;From two points, subtract the y’s, subtract the x’s, and divide.&lt;/li&gt;&lt;li&gt;In y = mx + b, m is the slope and b is where the line crosses the y-axis.&lt;/li&gt;&lt;li&gt;To write a line’s equation, find m, then plug in one point to find b.&lt;/li&gt;&lt;li&gt;A system’s solution is the point that works in both equations. Substitute one equation into the other.&lt;/li&gt;&lt;/ul&gt;"},"pr-main":{"name":"Main idea and key details","short":"Main idea","dom":"PR","lesson":"&lt;ul&gt;&lt;li&gt;The main idea is what the whole passage is about, not one detail from it.&lt;/li&gt;&lt;li&gt;Quick test: does the choice cover the beginning, the middle, and the end?&lt;/li&gt;&lt;li&gt;A summary keeps the key points and drops small details and opinions.&lt;/li&gt;&lt;li&gt;Watch for choices that are true but too narrow, or that claim more than the passage says.&lt;/li&gt;&lt;/ul&gt;"},"pr-inf":{"name":"Inference, evidence, and opinion","short":"Inference","dom":"PR","lesson":"&lt;ul&gt;&lt;li&gt;An inference is something the passage strongly suggests without saying it directly.&lt;/li&gt;&lt;li&gt;The answer must come from the passage, not from what you already know.&lt;/li&gt;&lt;li&gt;Be suspicious of extreme words like always, never, all, and only.&lt;/li&gt;&lt;li&gt;Fact or opinion? Facts can be checked. Opinions use words like I think, best, or smartest.&lt;/li&gt;&lt;li&gt;For a best-support question, find the sentence that proves that exact claim, not just the same topic.&lt;/li&gt;&lt;/ul&gt;"},"pr-word":{"name":"Words in context and tone","short":"Words & tone","dom":"PR","lesson":"&lt;ul&gt;&lt;li&gt;Cover the word. Read the sentence and put in your own word.&lt;/li&gt;&lt;li&gt;Then pick the choice closest to your word. Use clues in the sentences around it.&lt;/li&gt;&lt;li&gt;Connotation is the feeling a word carries. Thrifty sounds good. Cheap sounds bad.&lt;/li&gt;&lt;li&gt;Tone is the author’s attitude. Look at the words the author chooses.&lt;/li&gt;&lt;/ul&gt;"},"pr-struct":{"name":"Purpose and organization","short":"Purpose","dom":"PR","lesson":"&lt;ul&gt;&lt;li&gt;Author’s purpose: is the passage mainly trying to inform, persuade, or entertain?&lt;/li&gt;&lt;li&gt;Should and in my view point to persuading. Facts and explanations point to informing.&lt;/li&gt;&lt;li&gt;Common patterns: time order, cause and effect, compare and contrast, and problem and solution.&lt;/li&gt;&lt;li&gt;How does one sentence relate to another? Name its job: example, contrast, result, or answer to a worry.&lt;/li&gt;&lt;/ul&gt;"},"pw-sent":{"name":"Sentence structure","short":"Sentences","dom":"PW","lesson":"&lt;ul&gt;&lt;li&gt;A sentence needs a subject and a verb and has to make sense alone. Because the bus was late is a fragment.&lt;/li&gt;&lt;li&gt;Two sentences with only a comma between them is a comma splice. With nothing between them, it’s a run-on.&lt;/li&gt;&lt;li&gt;Fix it with a period, a semicolon, or a comma plus and, but, or so.&lt;/li&gt;&lt;li&gt;An opening phrase describes whatever comes right after the comma.&lt;/li&gt;&lt;li&gt;Items in a list need the same form.&lt;/li&gt;&lt;/ul&gt;"},"pw-gram":{"name":"Verbs, pronouns, and agreement","short":"Verbs & pronouns","dom":"PW","lesson":"&lt;ul&gt;&lt;li&gt;Subject and verb must agree. Each, every, and everyone are singular.&lt;/li&gt;&lt;li&gt;Keep the verb tense steady. Don’t jump from past to present in the same story.&lt;/li&gt;&lt;li&gt;A pronoun matches the noun it replaces. Plural noun, plural pronoun.&lt;/li&gt;&lt;li&gt;I or me? Cover the other person and listen.&lt;/li&gt;&lt;li&gt;Don’t switch from you to one or people partway through a sentence.&lt;/li&gt;&lt;/ul&gt;"},"pw-usage":{"name":"Word choice and usage","short":"Word choice","dom":"PW","lesson":"&lt;ul&gt;&lt;li&gt;Well describes an action. Good describes a thing.&lt;/li&gt;&lt;li&gt;After look, smell, taste, feel, and seem, use the adjectiv
