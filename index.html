\\)<\/div><div class=\"ln\">\\(\\hl{x \\le 3}\\)<\/div>"],["One new rule: when you multiply or divide by a negative, flip the sign.","<div class=\"ln\">\\(-3x > 6\\)<\/div><div class=\"ln\">\\(\\frac{-3x}{\\ins{-3}} \\; \\hl{<} \\; \\frac{6}{\\ins{-3}}\\)<\/div><div class=\"ln\">\\(x < -2\\)<\/div>"],["On a number line, ≤ and ≥ get a filled circle. &lt; and &gt; get an open circle.","<div class=\"k\"><svg class=\"nlsvg\" viewBox=\"0 0 300 44\" role=\"img\" aria-label=\"Closed circle at 3, shaded left\"><line class=\"nl\" x1=\"5\" y1=\"17\" x2=\"295\" y2=\"17\"/><path class=\"na\" d=\"M3 17 l8 -4.5 v9 z\"/><path class=\"na\" d=\"M297 17 l-8 -4.5 v9 z\"/><line class=\"nt\" x1=\"22\" y1=\"12\" x2=\"22\" y2=\"22\"/><text class=\"ntx\" x=\"22\" y=\"38\" text-anchor=\"middle\">−1<\/text><line class=\"nt\" x1=\"58.57\" y1=\"12\" x2=\"58.57\" y2=\"22\"/><text class=\"ntx\" x=\"58.57\" y=\"38\" text-anchor=\"middle\">0<\/text><line class=\"nt\" x1=\"95.14\" y1=\"12\" x2=\"95.14\" y2=\"22\"/><text class=\"ntx\" x=\"95.14\" y=\"38\" text-anchor=\"middle\">1<\/text><line class=\"nt\" x1=\"131.71\" y1=\"12\" x2=\"131.71\" y2=\"22\"/><text class=\"ntx\" x=\"131.71\" y=\"38\" text-anchor=\"middle\">2<\/text><line class=\"nt\" x1=\"168.29\" y1=\"12\" x2=\"168.29\" y2=\"22\"/><text class=\"ntx\" x=\"168.29\" y=\"38\" text-anchor=\"middle\">3<\/text><line class=\"nt\" x1=\"204.86\" y1=\"12\" x2=\"204.86\" y2=\"22\"/><text class=\"ntx\" x=\"204.86\" y=\"38\" text-anchor=\"middle\">4<\/text><line class=\"nt\" x1=\"241.43\" y1=\"12\" x2=\"241.43\" y2=\"22\"/><text class=\"ntx\" x=\"241.43\" y=\"38\" text-anchor=\"middle\">5<\/text><line class=\"nt\" x1=\"278\" y1=\"12\" x2=\"278\" y2=\"22\"/><text class=\"ntx\" x=\"278\" y=\"38\" text-anchor=\"middle\">6<\/text><line class=\"nr\" x1=\"168.29\" y1=\"17\" x2=\"9\" y2=\"17\"/><path class=\"nra\" d=\"M3 17 l9 -6 v12 z\"/><circle class=\"nc cl\" cx=\"168.29\" cy=\"17\" r=\"6\"/><\/svg><\/div><p class=\"sub k\">≤ filled: 3 is included<\/p><div class=\"k\"><svg class=\"nlsvg\" viewBox=\"0 0 300 44\" role=\"img\" aria-label=\"Open circle at 3, shaded left\"><line class=\"nl\" x1=\"5\" y1=\"17\" x2=\"295\" y2=\"17\"/><path class=\"na\" d=\"M3 17 l8 -4.5 v9 z\"/><path class=\"na\" d=\"M297 17 l-8 -4.5 v9 z\"/><line class=\"nt\" x1=\"22\" y1=\"12\" x2=\"22\" y2=\"22\"/><text class=\"ntx\" x=\"22\" y=\"38\" text-anchor=\"middle\">−1<\/text><line class=\"nt\" x1=\"58.57\" y1=\"12\" x2=\"58.57\" y2=\"22\"/><text class=\"ntx\" x=\"58.57\" y=\"38\" text-anchor=\"middle\">0<\/text><line class=\"nt\" x1=\"95.14\" y1=\"12\" x2=\"95.14\" y2=\"22\"/><text class=\"ntx\" x=\"95.14\" y=\"38\" text-anchor=\"middle\">1<\/text><line class=\"nt\" x1=\"131.71\" y1=\"12\" x2=\"131.71\" y2=\"22\"/><text class=\"ntx\" x=\"131.71\" y=\"38\" text-anchor=\"middle\">2<\/text><line class=\"nt\" x1=\"168.29\" y1=\"12\" x2=\"168.29\" y2=\"22\"/><text class=\"ntx\" x=\"168.29\" y=\"38\" text-anchor=\"middle\">3<\/text><line class=\"nt\" x1=\"204.86\" y1=\"12\" x2=\"204.86\" y2=\"22\"/><text class=\"ntx\" x=\"204.86\" y=\"38\" text-anchor=\"middle\">4<\/text><line class=\"nt\" x1=\"241.43\" y1=\"12\" x2=\"241.43\" y2=\"22\"/><text class=\"ntx\" x=\"241.43\" y=\"38\" text-anchor=\"middle\">5<\/text><line class=\"nt\" x1=\"278\" y1=\"12\" x2=\"278\" y2=\"22\"/><text class=\"ntx\" x=\"278\" y=\"38\" text-anchor=\"middle\">6<\/text><line class=\"nr\" x1=\"168.29\" y1=\"17\" x2=\"9\" y2=\"17\"/><path class=\"nra\" d=\"M3 17 l9 -6 v12 z\"/><circle class=\"nc\" cx=\"168.29\" cy=\"17\" r=\"6\"/><\/svg><\/div><p class=\"sub k\">&lt; open: 3 is not included<\/p>"],["Shade toward the answers. Less than goes left. Greater than goes right.","<div class=\"row\"><span class=\"chip k\">&lt; or ≤ ← left<\/span><span class=\"chip k\">&gt; or ≥ → right<\/span><\/div>"],["Not sure which way? Test 0. If 0 makes it true, shade the side that has 0.","<div class=\"ln\">\\(x \\le 3\\)<\/div><div class=\"ln\">\\(0 \\le 3\\)<\/div><div class=\"row\"><span class=\"bo\">true: shade the 0 side<\/span><\/div>"]],"pm-eval":[["Order of operations: parentheses, then exponents, then multiply and divide, then add and subtract.","<div class=\"row\"><span class=\"chip k\">( )<\/span><span class=\"arr k\">→<\/span><span class=\"chip k\">x²<\/span><span class=\"arr k\">→<\/span><span class=\"chip k\">× ÷<\/span><span class=\"arr k\">→<\/span><span class=\"chip k\">+ −<\/span><\/div>"],["Try it: 18 − 3 · 2² + 6 ÷ 2. The exponent goes first.","<div class=\"ln\">\\(18 - 3 \\cdot \\hl{2^2} + 6 \\div 2\\)<\/div><div class=\"ln\">\\(18 - \\hl{12} + \\hl{3}\\)<\/div><div class=\"ln\">\\(\\hl{9}\\)<\/div>"],["Multiply and divide go left to right as a pair. So do add and subtract. Don’t add first just because it comes first in PEMDAS.","<div class=\"ln\">\\(18 - 12 + 3\\)<\/div><div class=\"row\"><span class=\"bx\">18 − 15 = 3<\/span><span class=\"bo\">6 + 3 = 9<\/span><\/div>"],["Plugging in a negative? Put it in parentheses. (−2)² is 4, but −2² is −4.","<div class=\"ln\">\\((-2)^2 = \\hl{4}\\)<\/div><div class=\"ln\">\\(-2^2 = \\hl{-4}\\)<\/div>"],["The PERT calculator ignores order of operations. Do the multiplying and dividing yourself first.","<div class=\"ln\">\\(3 + 4 \\times 2\\)<\/div><div class=\"row\"><span class=\"bx\">calculator: 14<\/span><span class=\"bo\">you: 3 + 8 = 11<\/span><\/div>"]],"pm-exp":[["Multiplying the same base? Add the exponents.","<div class=\"ln\">\\(x^3 \\cdot x^4 = x^{\\hl{7}}\\)<\/div>"],["Dividing? Subtract them, top minus bottom.","<div class=\"ln\">\\(\\frac{x^5}{x^2} = x^{\\hl{3}}\\)<\/div>"],["A power of a power? Multiply them.","<div class=\"ln\">\\((x^{-2})^3 = x^{\\hl{-6}}\\)<\/div>"],["A negative exponent means the factor belongs on the other side of the fraction.","<div class=\"ln\">\\(y^{-5} = \\frac{1}{y^5}\\)<\/div><div class=\"ln\">\\(\\frac{3x^3}{y^5}\\)<\/div>"],["Anything to the zero power is 1. Numbers in front just multiply normally.","<div class=\"ln\">\\(x^0 = 1\\)<\/div><div class=\"ln\">\\((2x^3)(-3x) = \\hl{-6}x^{\\hl{4}}\\)<\/div>"]],"pm-poly":[["Combine like terms: same letter with the same exponent.","<div class=\"ln\">\\(\\hl{4x^2} - 3x + \\hl{x^2}\\)<\/div><div class=\"ln\">\\(5x^2 - 3x\\)<\/div>"],["Subtracting a polynomial? The minus flips the sign of every term inside.","<div class=\"ln\">\\(-(x^2 + 5x - 2)\\)<\/div><div class=\"ln\">\\(\\hl{-x^2 - 5x + 2}\\)<\/div>"],["Multiplying two binomials: multiply every term by every term.","<div class=\"ln\">\\((2x - 3)(x + 4)\\)<\/div><div class=\"ln\">\\(2x^2 + 8x - 3x - 12\\)<\/div><div class=\"ln\">\\(2x^2 + \\hl{5x} - 12\\)<\/div>"],["Dividing by one term: split it up and divide each piece. 3x ÷ 3x is 1, not 0.","<div class=\"ln\">\\(\\frac{6x^3}{3x} - \\frac{9x^2}{3x} + \\frac{3x}{3x}\\)<\/div><div class=\"ln\">\\(2x^2 - 3x + \\hl{1}\\)<\/div>"],["Dividing by a binomial: factor the top, then cancel the matching factor.","<div class=\"ln\">\\(\\frac{(x + 5)\\cancel{(x - 3)}}{\\cancel{(x - 3)}}\\)<\/div><div class=\"ln\">\\(\\hl{x + 5}\\)<\/div>"]],"pm-fact":[["Always pull out the greatest common factor first.","<div class=\"ln\">\\(3x^2 - 48\\)<\/div><div class=\"ln\">\\(\\hl{3}(x^2 - 16)\\)<\/div>"],["For x² + bx + c, find two numbers that multiply to c and add to b.","<div class=\"ln\">\\(x^2 - 9x + 20\\)<\/div><div class=\"row\"><span class=\"chip k\">multiply to 20<\/span><span class=\"chip k\">add to −9<\/span><\/div><div class=\"ln\">\\((x - \\hl{4})(x - \\hl{5})\\)<\/div>"],["A difference of squares splits into a minus and a plus.","<div class=\"ln\">\\(a^2 - b^2 = (a - b)(a + b)\\)<\/div><div class=\"ln\">\\(x^2 - 16 = (x - 4)(x + 4)\\)<\/div>"],["To solve a quadratic, get 0 on one side, factor, then set each factor equal to 0.","<div class=\"ln\">\\(x^2 + 3x = 28\\)<\/div><div class=\"ln\">\\(x^2 + 3x \\ins{-28} = 0\\)<\/div><div class=\"ln\">\\((x + 7)(x - 4) = 0\\)<\/div><div class=\"ln\">\\(\\hl{x = -7}\\) or \\(\\hl{x = 4}\\)<\/div>"],["The zero trick only works with 0. If the other side is 28, move the 28 over first.","<div class=\"ln\">\\(x(x + 3) = 28\\)<\/div><div class=\"row\"><span class=\"bx\">x = 28 is wrong<\/span><\/div>"]],"pm-line":[["Slope is rise over run: how much the line goes up for each step to the right.","<svg class=\"mini\" viewBox=\"0 0 180 180\" role=\"img\" aria-label=\"A line with a rise of 2 and a run of 4 marked\"><line class=\"pa\" x1=\"10\" y1=\"90.0\" x2=\"170\" y2=\"90.0\"/><line class=\"pa\" x1=\"90.0\" y1=\"170\" x2=\"90.0\" y2=\"10\"/><line class=\"draw l1\" pathLength=\"1\" x1=\"10.0\" y1=\"130.0\" x2=\"170.0\" y2=\"50.0\"/><line class=\"draw run\" pathLength=\"1\" x1=\"58.0\" y1=\"106.0\" x2=\"122.0\" y2=\"106.0\"/><line class=\"draw rise\" pathLength=\"1\" x1=\"122.0\" y1=\"106.0\" x2=\"122.0\" y2=\"74.0\"/><text class=\"pop tl\" x=\"90.0\" y=\"122.0\" text-anchor=\"middle\">run 4<\/text><text class=\"pop tl\" x=\"128.0\" y=\"94.0\">rise 2<\/text><\/svg>"],["From two points, subtract the y’s, subtract the x’s, and divide.","<div class=\"ln\">\\(m = \\frac{y_2 - y_1}{x_2 - x_1}\\)<\/div><div class=\"ln\">\\(m = \\frac{-9 - 3}{4 - (-2)} = \\frac{-12}{6} = \\hl{-2}\\)<\/div>"],["In y = mx + b, m is the slope and b is where the line crosses the y-axis.","<div class=\"ln\">\\(y = \\hl{m}x + \\ins{b}\\)<\/div><div class=\"row\"><span class=\"chip k\">m = slope<\/span><span class=\"chip k\">b = y-intercept<\/span><\/div>"],["To write a line’s equation, find m, then plug in one point to find b.","<div class=\"ln\">\\(4 = 3(1) + b\\)<\/div><div class=\"ln\">\\(b = 1\\)<\/div><div class=\"ln\">\\(\\hl{y = 3x + 1}\\)<\/div>"],["A system’s solution is the point that works in both equations. Substitute one equation into the other.","<div class=\"ln\">\\(3x + (\\hl{2x - 1}) = 14\\)<\/div><div class=\"ln\">\\(5x = 15\\)<\/div><div class=\"ln\">\\(x = 3,\\; y = 5\\)<\/div>"]],"pr-main":[["The main idea is what the whole passage is about, not one detail from it.","<div class=\"umb\"><div class=\"big k\">Main idea<\/div><div class=\"row\"><span class=\"chip k\">detail<\/span><span class=\"chip k\">detail<\/span><span class=\"chip k\">detail<\/span><\/div><\/div>"],["Quick test: does the choice cover the beginning, the middle, and the end?","<div class=\"row\"><span class=\"bo\">beginning<\/span><span class=\"bo\">middle<\/span><span class=\"bo\">end<\/span><\/div>"],["A summary keeps the key points and drops small details and opinions.","<div class=\"row\"><s>small detail<\/s><s>opinion<\/s><mark>key point<\/mark><\/div>"],["Watch for choices that are true but too narrow, or that claim more than the passage says.","<div class=\"row\"><span class=\"bx\">too narrow<\/span><span class=\"bx\">too big<\/span><span class=\"bo\">just right<\/span><\/div>"]],"pr-inf":[["An inference is something the passage strongly suggests without saying it directly.","<div class=\"ln\">She took French classes.<\/div><div class=\"ln\">Then she sailed to France to train.<\/div><div class=\"ln\"><mark>So she needed French there.<\/mark><\/div>"],["The answer must come from the passage, not from what you already know.","<div class=\"row\"><span class=\"bo\">in the passage<\/span><span class=\"bx\">outside knowledge<\/span><\/div>"],["Be suspicious of extreme words like always, never, all, and only.","<div class=\"row\"><s>always<\/s><s>never<\/s><s>all<\/s><s>only<\/s><\/div>"],["Fact or opinion? Facts can be checked. Opinions use words like I think, best, or smartest.","<div class=\"row\"><span class=\"chip k\">fact: can be checked<\/span><span class=\"chip hot k\">opinion: in my view, smartest<\/span><\/div>"],["For a best-support question, find the sentence that proves that exact claim, not just the same topic.","<div class=\"ln\">Claim: <mark>matters to people who fish<\/mark><\/div><div class=\"ln\">Proof: <ins>the fish people catch grew up there<\/ins><\/div>"]],"pr-word":[["Cover the word. Read the sentence and put in your own word.","<p class=\"sx\">The training was <span class=\"blankk\">______<\/span>.<\/p><p class=\"sx ln\">My word: <ins>hard<\/ins><\/p>"],["Then pick the choice closest to your word. Use clues in the sentences around it.","<p class=\"sx\">grueling ≈ <ins>exhausting and hard<\/ins><\/p>"],["Connotation is the feeling a word carries. Thrifty sounds good. Cheap sounds bad.","<div class=\"row\"><span class=\"bo\">thrifty<\/span><span class=\"bx\">cheap<\/span><\/div>"],["Tone is the author’s attitude. Look at the words the author chooses.","<div class=\"row\"><span class=\"chip k\">admiring<\/span><span class=\"chip k\">critical<\/span><span class=\"chip k\">neutral<\/span><span class=\"chip k\">amused<\/span><\/div>"]],"pr-struct":[["Author’s purpose: is the passage mainly trying to inform, persuade, or entertain?","<div class=\"row\"><span class=\"chip k\">inform<\/span><span class=\"chip k\">persuade<\/span><span class=\"chip k\">entertain<\/span><\/div>"],["Should and in my view point to persuading. Facts and explanations point to informing.","<p class=\"sx\">Our school <mark>should<\/mark> start later.<\/p><p class=\"sx ln\"><mark>In my view<\/mark>, these rules are smart.<\/p>"],["Common patterns: time order, cause and effect, compare and contrast, and problem and solution.","<div class=\"row\"><span class=\"chip k\">time order<\/span><span class=\"chip k\">cause → effect<\/span><span class=\"chip k\">compare<\/span><span class=\"chip k\">problem → solution<\/span><\/div>"],["How does one sentence relate to another? Name its job: example, contrast, result, or answer to a worry.","<p class=\"sx\">Parents worry about sports. <ins>However,<\/ins> practices can end later.<\/p><p class=\"row\"><span class=\"bo\">answers a worry<\/span><\/p>"]],"pw-sent":[["A sentence needs a subject and a verb and has to make sense alone. Because the bus was late is a fragment.","<p class=\"sx\"><span class=\"ua\" data-l=\"fragment\">Because the bus was late.<\/span><\/p>"],["Two sentences with only a comma between them is a comma splice. With nothing between them, it’s a run-on.","<p class=\"sx\">The bus was late<s>,<\/s> we missed kickoff.<\/p>"],["Fix it with a period, a semicolon, or a comma plus and, but, or so.","<p class=\"sx ln\">The bus was late<ins>, so<\/ins> we missed kickoff.<\/p><p class=\"sx ln\">The bus was late<ins>;<\/ins> we missed kickoff.<\/p>"],["An opening phrase describes whatever comes right after the comma.","<p class=\"sx\"><span class=\"ua\" data-l=\"who is walking?\">Walking to class,<\/span> <s>my strap snapped<\/s><\/p><p class=\"sx ln\">Walking to class, <ins>I felt my strap snap<\/ins>.<\/p>"],["Items in a list need the same form.","<p class=\"sx\">hiking, swimming, and <s>to ride<\/s> <ins>riding<\/ins><\/p>"]],"pw-gram":[["Subject and verb must agree. Each, every, and everyone are singular.","<p class=\"sx\"><span class=\"ua\" data-l=\"singular\">Each<\/span> <s>of the players<\/s> <ins>needs<\/ins> a jersey.<\/p>"],["Keep the verb tense steady. Don’t jump from past to present in the same story.","<p class=\"sx\">The coach blew the whistle, and the players <s>run<\/s> <ins>ran<\/ins>.<\/p>"],["A pronoun matches the noun it replaces. Plural noun, plural pronoun.","<p class=\"sx\"><span class=\"ua\" data-l=\"plural\">The members<\/span> packed <ins>their<\/ins> instruments.<\/p>"],["I or me? Cover the other person and listen.","<p class=\"sx\">asked <s>Jaylen and<\/s> <mark>me<\/mark><\/p><p class=\"sx ln\">asked <s>I<\/s><\/p>"],["Don’t switch from you to one or people partway through a sentence.","<p class=\"sx\">When you visit, <s>one<\/s> <ins>you<\/ins> should wear sunscreen.<\/p>"]],"pw-usage":[["Well describes an action. Good describes a thing.","<p class=\"sx\">Marcus played <s>good<\/s> <ins>well<\/ins>.<\/p><p class=\"sx ln\">It was a <mark>good<\/mark> game.<\/p>"],["After look, smell, taste, feel, and seem, use the adjective.","<p class=\"sx\">The soup smelled <s>badly<\/s> <ins>bad<\/ins>.<\/p>"],["Affect is usually the action. Effect is usually the result.","<p class=\"sx\">The rain will <span class=\"ua\" data-l=\"action\">affect<\/span> the game.<\/p><p class=\"sx ln\">The rain had an <span class=\"ub\" data-l=\"result\">effect<\/span>.<\/p>"],["Than compares. Then is about time.","<p class=\"sx\">taller <ins>than<\/ins> me<\/p><p class=\"sx ln\">and <mark>then<\/mark> we left<\/p>"],["Test their, there, they’re, its, and it’s by reading them as they are or it is.","<div class=\"row\"><span class=\"chip k\">they’re = they are<\/span><span class=\"chip k\">it’s = it is<\/span><span class=\"chip k\">their / its = owns it<\/span><\/div>"]],"pw-org":[["Every sentence should support the topic sentence. Find the one that wanders off.","<div class=\"stack\"><span class=\"k optn\">(1) Volunteering teaches skills.<\/span><span class=\"k optn\">(2) Handling animals calmly.<\/span><span class=\"k optn\"><s>(4) Dogs were domesticated long ago.<\/s><\/span><span class=\"k optn\">(5) Finding a career.<\/span><\/div>"],["For sentence order, follow time words and what each sentence needs to come before it.","<div class=\"row\"><span class=\"chip k\">First<\/span><span class=\"arr k\">→<\/span><span class=\"chip k\">Then<\/span><span class=\"arr k\">→<\/span><span class=\"chip k\">While<\/span><span class=\"arr k\">→<\/span><span class=\"chip k\">Finally<\/span><\/div>"],["Transitions show the link: as a result for cause, however for contrast, for example for examples.","<div class=\"row\"><span class=\"chip k\">as a result<\/span><span class=\"chip k\">however<\/span><span class=\"chip k\">for example<\/span><\/div>"],["Taking notes from a source? The note has to keep every detail: days, times, and conditions.","<p class=\"sx\">Tue <ins>and Thu<\/ins>, 3–5 p.m.<\/p><p class=\"sx ln\"><s>Tuesdays only<\/s><\/p>"]],"bnd":[["Two complete sentences joined by only a comma is a mistake called a comma splice.","<p class=\"sx\"><span class=\"ua\" data-l=\"sentence\">The storm hit<\/span><s>,<\/s> <span class=\"ub\" data-l=\"sentence\">the lights went out<\/span>.<\/p><p class=\"row\"><span class=\"bx\">comma splice<\/span><\/p>"],["Fix it with a period, a semicolon, or a comma plus and, but, or so.","<p class=\"sx ln\">The storm hit<ins>.<\/ins> The lights went out.<\/p><p class=\"sx ln\">The storm hit<ins>;<\/ins> the lights went out.<\/p><p class=\"sx ln\">The storm hit<ins>, so<\/ins> the lights went out.<\/p>"],["A colon needs a complete sentence before it. Never put one right after such as or including.","<p class=\"sx ln\"><span class=\"ua\" data-l=\"complete\">The kit had three tools<\/span><ins>:<\/ins> a saw, a drill, and a level.<\/p><p class=\"sx ln\">The kit had tools such as<s>:<\/s> a saw and a drill.<\/p>"],["Extra information gets matching marks on both sides: two commas or two dashes.","<p class=\"sx ln\">Mae Jemison<ins>,<\/ins> a doctor and engineer<ins>,<\/ins> flew in 1992.<\/p><p class=\"sx ln\">Mae Jemison<ins>—<\/ins>a doctor and engineer<ins>—<\/ins>flew in 1992.<\/p>"],["Never put punctuation between a subject and its verb, even when the subject is long.","<p class=\"sx\"><span class=\"ua\" data-l=\"subject\">The dye made from these insects<\/span><s>,<\/s> <span class=\"ub\" data-l=\"verb\">was<\/span> prized.<\/p>"],["However starting a new sentence needs a semicolon or period before it and a comma after it.","<p class=\"sx\">Octopuses are colorblind<ins>;<\/ins> <mark>however,<\/mark> they blend in perfectly.<\/p>"]],"fss":[["Find the real subject. Cross out the of phrase, then match the verb to what’s left.","<p class=\"sx\"><span class=\"ua\" data-l=\"subject\">The collection<\/span> <s>of letters and maps<\/s> <ins>is<\/ins> online.<\/p>"],["Its means belonging to it. It’s means it is.","<p class=\"sx ln\">The colony cools <ins>its<\/ins> hive.<\/p><p class=\"sx ln\"><mark>it’s<\/mark> = it is<\/p>"],["An opening phrase describes whatever comes right after the comma.","<p class=\"sx\"><span class=\"ua\" data-l=\"describes\">Found in 1850,<\/span> <ins>the statue<\/ins> is a masterpiece.<\/p><p class=\"sx ln\">Found in 1850, <s>archaeologists<\/s> …<\/p>"],["For something owned by a group, the apostrophe goes after the s.","<p class=\"sx ln\">one astronomer<ins>’s<\/ins> notes<\/p><p class=\"sx ln\">many astronomers<ins>’<\/ins> efforts<\/p>"],["In a flipped sentence, the subject comes after the verb. Flip it back to check.","<p class=\"sx\">Among the tools <mark>is<\/mark> <span class=\"ua\" data-l=\"subject\">a needle<\/span>.<\/p><p class=\"sx ln\">A needle <mark>is<\/mark> among the tools.<\/p>"]],"tr":[["Cover the choices. Read the sentence before the blank and the sentence after it.","<div class=\"row\"><span class=\"chip k\">sentence 1<\/span><span class=\"arr k\">→<\/span><span class=\"chip hot k\">?<\/span><span class=\"arr k\">→<\/span><span class=\"chip k\">sentence 2<\/span><\/div>"],["Name the link yourself: same idea, contrast, cause and effect, or time.","<div class=\"row\"><span class=\"chip k\">same idea<\/span><span class=\"chip k\">contrast<\/span><span class=\"chip k\">cause → effect<\/span><span class=\"chip k\">time<\/span><\/div>"],["Same idea or an example: for example, in fact, similarly.","<p class=\"sx\">Desert plants store water. <ins>For example,<\/ins> the saguaro swells after rain.<\/p>"],["Contrast: however, even so, in reality. Cause and effect: therefore, for this reason, as a result.","<p class=\"sx ln\">Pluto was a planet. <ins>However,<\/ins> it was reclassified.<\/p><p class=\"sx ln\">Lights confuse turtles. <ins>For this reason,<\/ins> beaches go dark.<\/p>"],["Pick the choice that matches your label. A word that only sounds fine with the second sentence isn’t enough.","<div class=\"row\"><span class=\"bo\">matches the link<\/span><span class=\"bx\">only sounds okay<\/span><\/div>"]],"rs":[["Read the goal in the question first. Then skim the notes.","<p class=\"sx\">The student wants to <mark>emphasize a difference in appearance<\/mark>.<\/p>"],["Every choice is accurate to the notes. Only one does the exact job.","<div class=\"stack\"><span class=\"k optn\">A similarity <span class=\"bx\">wrong job<\/span><\/span><span class=\"k optn\">A difference in their tails <span class=\"bo\">the job<\/span><\/span><span class=\"k optn\">A difference in where they live <span class=\"bx\">wrong job<\/span><\/span><\/div>"],["Match the key word: compare means alike, contrast means different, introduce means who or what.","<div class=\"row\"><span class=\"chip k\">compare = alike<\/span><span class=\"chip k\">contrast = different<\/span><span class=\"chip k\">introduce = who or what<\/span><\/div>"],["For an audience that doesn’t know the topic, the answer has to say who or what it is.","<p class=\"sx\">Katherine Johnson <ins>was a NASA mathematician who<\/ins> …<\/p>"]],"wic":[["Cover the choices and predict your own word from the clues.","<p class=\"sx\">Although the drug did well, researchers stayed <span class=\"blankk\">______<\/span>.<\/p><p class=\"sx ln\">My word: <ins>careful<\/ins><\/p>"],["Watch for flip words: although, but, however, instead.","<p class=\"sx\"><mark>Although<\/mark> it did well, they stayed <ins>cautious<\/ins>.<\/p>"],["A colon means the next part explains the blank.","<p class=\"sx\">notable for its <ins>functionality<\/ins><mark>:<\/mark> every part serves a purpose.<\/p>"],["Sort the choices positive or negative first. Then pick the exact fit.","<div class=\"row\"><span class=\"bo\">cautious<\/span><span class=\"bx\">dismissive<\/span><span class=\"bx\">certain<\/span><\/div>"]],"sys":[["The solution to a system is the point where the two lines cross.","<svg class=\"mini\" viewBox=\"0 0 170 170\" role=\"img\" aria-label=\"Two lines crossing at one point\"><line class=\"pa\" x1=\"10\" y1=\"85\" x2=\"160\" y2=\"85\"/><line class=\"pa\" x1=\"85\" y1=\"160\" x2=\"85\" y2=\"10\"/><line class=\"draw l1\" pathLength=\"1\" x1=\"10\" y1=\"145\" x2=\"145\" y2=\"10\"/><line class=\"draw l2\" pathLength=\"1\" x1=\"55\" y1=\"10\" x2=\"160\" y2=\"115\"/><circle class=\"pop dt\" cx=\"100\" cy=\"55\" r=\"5\"/><\/svg>"],["Elimination: add the equations so one variable cancels out.","<div class=\"ln\">\\(x + \\hl{y} = 14\\)<\/div><div class=\"ln\">\\(x - \\hl{y} = 4\\)<\/div><div class=\"ln\">\\(2x = 18\\)<\/div><div class=\"ln\">\\(x = 9\\)<\/div>"],["No solution means parallel lines: the same slope with different intercepts.","<svg class=\"mini\" viewBox=\"0 0 170 170\" role=\"img\" aria-label=\"Two parallel lines\"><line class=\"pa\" x1=\"10\" y1=\"85\" x2=\"160\" y2=\"85\"/><line class=\"pa\" x1=\"85\" y1=\"160\" x2=\"85\" y2=\"10\"/><line class=\"draw l1\" pathLength=\"1\" x1=\"10\" y1=\"92.5\" x2=\"160\" y2=\"17.5\"/><line class=\"draw l2\" pathLength=\"1\" x1=\"10\" y1=\"145\" x2=\"160\" y2=\"70\"/><\/svg><p class=\"row\"><span class=\"bx\">never cross<\/span><\/p>"],["Infinitely many solutions means both equations are the same line. One is a multiple of the other.","<div class=\"ln\">\\(4x - 6y = 10\\)<\/div><div class=\"row\"><span class=\"chip k\">× 1.5<\/span><\/div><div class=\"ln\">\\(6x - 9y = 15\\)<\/div>"],["In Desmos, graph both equations and tap the point where they cross.","<div class=\"big k\">Tap the crossing point<\/div>"]],"nlf":[["Exponential growth has a growth factor. 1.03 means it goes up 3% each period.","<div class=\"ln\">\\(12,000(1.\\hl{03})^t\\)<\/div><div class=\"row\"><span class=\"bo\">up 3% each year<\/span><\/div>"],["Decay keeps less each period. Losing 15% means keeping 85%, so the factor is 0.85.","<div class=\"ln\">\\(24,000(\\hl{0.85})^t\\)<\/div><div class=\"row\"><span class=\"bx\">down 15% each year<\/span><\/div>"],["In vertex form, a(x − h)² + k, the vertex is (h, k). Watch the sign on h.","<div class=\"ln\">\\(-2(x - \\hl{3})^2 + \\hl{8}\\)<\/div><div class=\"ln\">vertex \\((3, 8)\\)<\/div>"],["If a is negative, the parabola opens down, so the vertex is the maximum.","<svg class=\"mini\" viewBox=\"0 0 170 170\" role=\"img\" aria-label=\"A parabola opening downward with its vertex at the top\"><line class=\"pa\" x1=\"10\" y1=\"85\" x2=\"160\" y2=\"85\"/><line class=\"pa\" x1=\"85\" y1=\"160\" x2=\"85\" y2=\"10\"/><polyline class=\"draw l1\" pathLength=\"1\" points=\"40,145 42,137.13 44,129.53 46,122.2 48,115.13 50,108.33 52,101.8 54,95.53 56,89.53 58,83.8 60,78.33 62,73.13 64,68.2 66,63.53 68,59.13 70,55 72,51.13 74,47.53 76,44.2 78,41.13 80,38.33 82,35.8 84,33.53 86,31.53 88,29.8 90,28.33 92,27.13 94,26.2 96,25.53 98,25.13 100,25 102,25.13 104,25.53 106,26.2 108,27.13 110,28.33 112,29.8 114,31.53 116,33.53 118,35.8 120,38.33 122,41.13 124,44.2 126,47.53 128,51.13 130,55 132,59.13 134,63.53 136,68.2 138,73.13 140,78.33 142,83.8 144,89.53 146,95.53 148,101.8 150,108.33 152,115.13 154,122.2 156,129.53 158,137.13 160,145\"/><circle class=\"pop dt\" cx=\"100\" cy=\"25\" r=\"5\"/><\/svg>"],["In standard form, the vertex is at x = −b ÷ 2a. Then plug that x back in.","<div class=\"ln\">\\(t = -\\frac{64}{2(-16)} = \\hl{2}\\)<\/div><div class=\"ln\">\\(h(2) = \\hl{69}\\)<\/div>"]],"pct":[["Percent change is new minus old, divided by old.","<div class=\"ln\">\\(\\frac{\\text{new} - \\text{old}}{\\hl{\\text{old}}}\\)<\/div><div class=\"ln\">\\(\\frac{60 - 50}{50} = 0.20 = 20\\%\\)<\/div>"],["Percent off means you pay the rest. 25% off means you pay 75%.","<div class=\"ln\">\\(0.75 \\times 80 = \\hl{60}\\)<\/div>"],["Back-to-back changes multiply. Up 40% and then down 25% is 1.40 × 0.75.","<div class=\"ln\">\\(1.40 \\times 0.75 = \\hl{1.05}\\)<\/div><div class=\"row\"><span class=\"bo\">105% of the original<\/span><\/div>"],["Don’t add or subtract the percents. 40 − 25 = 15 is the trap.","<div class=\"ln\">\\(\\cancel{40\\% - 25\\% = 15\\%}\\)<\/div><div class=\"row\"><span class=\"bx\">trap<\/span><\/div>"]]},"pert":{"date":null},"dz":{"moves":[{"k":"type","n":"Type it right","when":"Every Desmos question. One typing slip and the graph is wrong.","how":["Type / for a fraction. Everything after it goes in the bottom until you press →.","Type ^ for an exponent. A + or − jumps out on its own. Anything else needs →.","Type sqrt for a square root and | for absolute value. Press → to leave them."],"demo":"TYPE-DEMO"},{"k":"solve","n":"Solve for x","when":"One equation with one variable, and they ask for \\(x\\).","how":["Type the whole equation exactly as written. Don’t rearrange it.","Desmos draws a vertical line at each solution.","Tap where each line crosses the \\(x\\)-axis."],"demo":"M-L1-01"},{"k":"cross","n":"Tap where they cross","when":"A system of equations, or two graphs that intersect.","how":["Type each equation on its own line, exactly as given.","Zoom out if you can’t see where they cross.","Tap the crossing point, then answer what they asked: \\(x\\), \\(y\\), or something like \\(x + y\\)."],"demo":"M-SYS-02"},{"k":"para","n":"Vertex and zeros","when":"A quadratic: maximum, minimum, vertex, \\(x\\)-intercepts, or solutions.","how":["Graph it with \\(y =\\) or \\(f(x) =\\).","Tap the top or bottom of the curve for the vertex.","Tap the gray dots on the \\(x\\)-axis for the zeros."],"demo":"M-NLF-03"},{"k":"count","n":"Count the crossings","when":"“How many solutions does the equation have?”","how":["Graph the left side as \\(y = \\)… and the right side as another \\(y = \\)….","Count the places where the two graphs meet.","If they never meet, there are no real solutions."],"demo":"M-DZ-05"},{"k":"slide","n":"Sliders for k","when":"A constant like \\(k\\), \\(b\\), or \\(c\\), plus “no solution,” “infinitely many,” or “exactly one.”","how":["Type the equations with the letter in them, then tap add slider.","No solution: parallel lines. Infinitely many: the same line. Exactly one: just touching.","Drag until you see it, then read the value."],"demo":"M-SYS-04"},{"k":"same","n":"Same graph, same answer","when":"“Which expression is equivalent to…?”","how":["Graph the original expression.","Graph a choice. If it lands exactly on top, they’re equivalent.","Hide or delete the wrong ones as you go."],"demo":"M-EQX-01"},{"k":"func","n":"Define f, then plug in","when":"Function notation: \\(f(3)\\), \\(f(g(2))\\), \\(g(x) = f(x + 2)\\).","how":["Type \\(f(x) = \\)… on one line.","On the next line, type \\(f(3)\\). The value shows up right under it.","Functions can use other functions, like \\(g(x) = f(x + 2)\\)."],"demo":"M-NLF-05"},{"k":"reg","n":"Tables and regression","when":"A table of values, or two points on a line or an exponential.","how":["Tap + Table and type the points.","Line: \\(y_1 \\sim mx_1 + b\\). Exponential: \\(y_1 \\sim ab^{x_1}\\).","Desmos finds the constants, and you can use them on new lines."],"demo":"M-LF-02"},{"k":"shape","n":"Circles and shaded regions","when":"Circle equations and systems of inequalities.","how":["Type the equation or inequalities exactly as given.","Circles: read the center and radius off the grid.","Inequalities: the answer point sits where the shadings overlap."],"demo":"M-CIRC-01"},{"k":"calc","n":"Desmos as a calculator","when":"Means, medians, standard deviations, percents, and long arithmetic.","how":["Type mean, median, or stdev with the list in square brackets: mean([4, 7, 9]).","Write percent changes as multipliers: 40% more is \\(\\times 1.4\\), 25% off is \\(\\times 0.75\\).","The answer shows right under the line."],"demo":"M-D1-03"}],"typing":[{"tex":"y=\\frac{1}{2}x+3","keys":"y=1/2→x+3","tip":"After the 2, press → to step out of the fraction. Otherwise \\(x\\) ends up in the bottom.","mq":"y=\\frac{1}{2}x+3"},{"tex":"y=\\sqrt{x+7}-1","keys":"y=sqrtx+7→-1","tip":"Type sqrt for the root. Press → to leave it before the − 1.","mq":"y=\\sqrt{x+7}-1"},{"tex":"y=\\frac{3}{x-2}+1","keys":"y=3/x-2→+1","tip":"Everything after / goes in the bottom until you press →.","mq":"y=\\frac{3}{x-2}+1"},{"tex":"y=500\\left(1.03\\right)^x","show":"y=500(1.03)^x","keys":"y=500(1.03)^x","tip":"Parentheses around 1.03, then ^ and \\(x\\).","view":[-10,40,-150,1850],"mq":"y=500\\left(1.03\\right)^x"},{"tex":"y=2^{x+1}-3","keys":"y=2^(x+1)→-3","tip":"Typing + inside an exponent jumps out of it, so put the whole exponent in parentheses: 2^(x+1).","mq":"y=2^{\\left(x+1\\right)}-3"},{"tex":"y=\\left|2x-5\\right|","show":"y=|2x-5|","keys":"y=|2x-5|","tip":"Type | to start the absolute value and | again to close it.","mq":"y=\\left|2x-5\\right|"},{"tex":"f\\left(x\\right)=\\frac{2}{3}x-4","show":"f(x)=\\frac{2}{3}x-4","keys":"f(x)=2/3→x-4","tip":"Type f(x)= to make a function you can plug numbers into later.","mq":"f\\left(x\\right)=\\frac{2}{3}x-4"},{"tex":"y=\\frac{x+3}{x-1}","keys":"y=(x+3)/x-1→","tip":"Put the top in parentheses before you type /. Otherwise only the 3 goes on top.","mq":"y=\\frac{\\left(x+3\\right)}{x-1}"}],"demos":{"TYPE-DEMO":{"view":[-10,10,-6,10],"sq":false,"steps":[{"say":"Say you want \\(y = \\frac{1}{2}x + 3\\). Watch what happens if you just type 1/2x + 3.","do":[["type",0,"y=1/2x+3","y=\\frac{1}{2x+3}"]]},{"say":"Everything after the / went into the bottom. That’s \\(\\frac{1}{2x + 3}\\), a totally different graph.","do":[["sel",0]]},{"say":"Now the right way: type 1/2, press → to step out of the fraction, then type x + 3.","do":[["hide",0],["type",1,"y=1/2→x+3","y=\\frac{1}{2}x+3"]]},{"say":"That’s the line you wanted: slope \\(\\frac{1}{2}\\), crossing the \\(y\\)-axis at 3.","do":[["tap",0,3,1]]},{"say":"Same idea for roots: type sqrt, the inside, then → before you keep going.","do":[["type",2,"y=sqrtx+4→-2","y=\\sqrt{x+4}-2"]]}]}}}}</script>
<script>
(() => {
'use strict';
const DATA = JSON.parse(document.getElementById('sat-data').textContent);
const SK = DATA.skills, DOM = DATA.domains, VOC = DATA.vocab, PRI = DATA.priority, PPRI = DATA.pPriority, BUILT = DATA.questions, LES = DATA.lessons || {};
let PRO = null, PERT_DAY = null; /* set by refreshMe() once SET exists */
function makePro() {
  const m = SET.me || {}, d = DATA.profile || {};
  const rw = +m.rw || d.rw, math = +m.math || d.math;
  if (!rw || !math) return null;
  const total = rw + math, goal = +m.goal || d.goal || Math.min(1600, total + 160);
  const gap = Math.max(0, goal - total), half = Math.round(gap / 2 / 10) * 10;
  return { total, rw, math, goal, goalRw: Math.min(800, rw + half), goalMath: Math.min(800, math + gap - half) };
}
function refreshMe() { PRO = makePro(); PERT_DAY = (SET.me && SET.me.pert) || DATA.pert.date || null; }
function meBox(withPert, withScores) {
  const m = SET.me || {}, p = PRO || {}, v = x => x ? ' value="' + esc(String(x)) + '"' : '';
  return '<div class="mebox" data-me>'
    + (withScores ? '<label>Reading and Writing<input name="rw" type="number" inputmode="numeric" min="200" max="800" step="10" placeholder="530"' + v(m.rw || p.rw) + '></label>'
      + '<label>Math<input name="math" type="number" inputmode="numeric" min="200" max="800" step="10" placeholder="500"' + v(m.math || p.math) + '></label>'
      + '<label>Goal total<input name="goal" type="number" inputmode="numeric" min="400" max="1600" step="10" placeholder="1190"' + v(m.goal || p.goal) + '></label>' : '')
    + (withPert ? '<label>PERT date<input name="pert" type="date"' + v(m.pert || PERT_DAY) + '></label>' : '')
    + '<button class="btn small primary" data-act="me-save">Save</button></div>';
}
const DZD = DATA.dz || { moves: [], typing: [], demos: {} };
const MV = {}; (DZD.moves || []).forEach(m => { MV[m.k] = m; });
const LETTERS = ['A', 'B', 'C', 'D'];
const LV = { E: 'Easy', M: 'Medium', H: 'Hard' };
const LVO = { E: 0, M: 1, H: 2 };
const LS_KEY = 'satlab:v1', SET_KEY = 'satlab:set';
const app = document.getElementById('app');
const TTS = typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance === 'function';

/* ================= helpers ================= */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const dayKey = (d = new Date()) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const clock = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + pad(s % 60); };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clone = o => JSON.parse(JSON.stringify(o || {}));
const isEmpty = o => !o || Object.keys(o).length === 0;
function deepMerge(t, s) {
  for (const k in s) {
    const v = s[k];
    if (v && typeof v === 'object' && !Array.isArray(v)) { if (!t[k] || typeof t[k] !== 'object') t[k] = {}; deepMerge(t[k], v); }
    else t[k] = v;
  }
  return t;
}
function lsGet(k) { try { return JSON.parse(localStorage.getItem(k || LS_KEY) || 'null'); } catch (e) { return null; } }
function lsSet(v, k) { try { localStorage.setItem(k || LS_KEY, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
function daysUntil(ds) {
  if (!ds) return -999;
  const p = ds.split('-').map(Number), t = new Date(p[0], p[1] - 1, p[2]), n = new Date();
  const today = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  return Math.round((t - today) / 86400000);
}

/* ================= settings (per viewer, this browser) ================= */
const SET = Object.assign({ motion: 'auto', steps: 'step', voice: false, size: 'md', goal: 15 }, lsGet(SET_KEY) || {});
function applySet() {
  const r = document.documentElement;
  if (SET.motion === 'auto') delete r.dataset.motion; else r.dataset.motion = SET.motion;
  if (SET.size === 'lg') r.dataset.size = 'lg'; else delete r.dataset.size;
}
function saveSet() { lsSet(SET, SET_KEY); applySet(); }
refreshMe();
function motionOn() {
  if (SET.motion === 'off') return false;
  if (SET.motion === 'on') return true;
  try { return !window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return true; }
}
applySet();

/* ================= tiny TeX → HTML ================= */
const SYM = { pi: 'π', theta: 'θ', alpha: 'α', beta: 'β', Delta: 'Δ', le: '≤', leq: '≤', ge: '≥', geq: '≥', ne: '≠', neq: '≠', approx: '≈',
  cdot: '·', times: '×', div: '÷', pm: '±', infty: '∞', angle: '∠', triangle: '△', circ: '°', degree: '°', ell: 'ℓ', to: '→', rightarrow: '→',
  cdots: '⋯', ldots: '…', dots: '…', perp: '⊥', parallel: '∥', lt: '<', gt: '>', mid: '|', percent: '%', prime: '′' };
const RELS = new Set(['=', '<', '>', '≤', '≥', '≠', '≈', '→']);
const BINS = new Set(['×', '÷', '±', '·']);
const FUNS = new Set(['sin', 'cos', 'tan', 'log', 'ln']);
function tex(src) {
  let i = 0, operand = false, absOpen = false;
  const n = src.length;
  const ws = () => { while (i < n && /\s/.test(src[i])) i++; };
  const seq = end => { let h = ''; while (i < n && src[i] !== end) h += atom(); return h; };
  function group() {
    ws(); operand = false;
    if (src[i] === '{') { i++; const h = seq('}'); i++; return h; }
    return atom();
  }

/* ---------- PERT-style calculator (works left to right, like the real one) */
function newCalc() { return { open: true, entry: '0', disp: '0', acc: null, op: null, fresh: true, err: false, trail: '' }; }
function calcFmt(v) { if (!isFinite(v)) return 'Error'; let s = String(+v.toPrecision(10)); if (s.length > 12) s = v.toExponential(5); return s; }
function calcApply(a, op, b) { return op === '+' ? a + b : op === '−' ? a - b : op === '×' ? a * b : b === 0 ? NaN : a / b; }
function calcKey(k) {
  const c = S.calc; if (!c) return;
  if (c.err && k !== 'C') return;
  if (/^[0-9]$/.test(k)) { if (c.fresh) { c.entry = k; c.fresh = false; } else if (c.entry.length < 12) c.entry = c.entry === '0' ? k : c.entry + k; c.disp = c.entry; }
  else if (k === '.') { if (c.fresh) { c.entry = '0.'; c.fresh = false; } else if (c.entry.indexOf('.') < 0) c.entry += '.'; c.disp = c.entry; }
  else if (k === '±') { if (!c.fresh) { c.entry = c.entry[0] === '-' ? c.entry.slice(1) : '-' + c.entry; c.disp = c.entry; } else if (c.acc != null) { c.acc = -c.acc; c.disp = calcFmt(c.acc); } }
  else if ('+−×÷'.indexOf(k) >= 0) {
    if (c.op && !c.fresh) { c.trail = c.trail + ' ' + c.entry; c.acc = calcApply(c.acc, c.op, +c.entry); }
    else if (c.acc == null || (!c.op && !c.fresh)) { c.acc = +c.entry; c.trail = calcFmt(c.acc); }
    else if (!c.op) c.trail = calcFmt(c.acc);
    c.trail += ' ' + k;
    c.op = k; c.fresh = true; c.disp = calcFmt(c.acc); if (!isFinite(c.acc)) c.err = true;
  } else if (k === '=') {
    if (c.op) { const b = c.fresh ? c.acc : +c.entry; c.trail = c.trail + ' ' + calcFmt(b) + ' ='; c.acc = calcApply(c.acc, c.op, b); c.op = null; c.fresh = true; c.disp = calcFmt(c.acc); c.entry = String(c.acc); if (!isFinite(c.acc)) c.err = true; }
  } else if (k === 'C') { Object.assign(c, { entry: '0', disp: '0', acc: null, op: null, fresh: true, err: false, trail: '' }); }
  if (c.err) c.disp = 'Error';
}
function calcHTML() {
  const c = S.calc, K = ['7', '8', '9', '÷', '4', '5', '6', '×', '1', '2', '3', '−', '0', '.', '±', '+'];
  return '<div class="calc' + playCls('calc:' + (c.n || 0)) + '" id="calc" role="dialog" aria-label="Calculator"><header><span>4-function calculator</span><button class="iconbtn" data-act="calc" aria-label="Close calculator" style="min-width:30px;min-height:30px;padding:2px">' + IC.x + '</button></header>'
    + '<div class="disp" aria-live="polite">' + esc(c.disp) + '</div><div class="opl">' + esc(c.trail.slice(-26)) + '</div><div class="keys">'
    + K.map(k => '<button class="' + ('÷×−+'.indexOf(k) >= 0 ? 'op' : '') + '" data-act="ck" data-v="' + k + '">' + k + '</button>').join('')
    + '<button data-act="ck" data-v="C">C</button><button class="eq" data-act="ck" data-v="=" style="grid-column:span 3">=</button></div>'
    + '<p class="cnote">Works left to right like the PERT one: 3 + 4 × 2 gives 14. Do × and ÷ yourself first.</p></div>';

function pickAdaptive(pool, used, lvl) {

  for (const L of order) {
    const cand = pool.map(id => QMAP.get(id)).filter(q => q && q.lv === L && used.indexOf(q.id) < 0);
    if (cand.length) { const fresh = cand.filter(q => !isRight(q.id)); const list = fresh.length ? fresh : cand; return list[Math.floor(Math.random() * list.length)]; }
  }

async function sampler() { try { return window.claude && typeof window.claude.use === 'function' ? await window.claude.use('sample') : null; } catch (e) { return null; } }

function qContext(q, it) {

const MATH_RULE = 'Write math between \\( and \\) using only: \\frac{a}{b}, \\sqrt{x}, \\sqrt[n]{x}, ^, _, \\pi, \\le, \\ge, \\ne, \\cdot, \\times, \\theta, \\sin, \\cos, \\tan, ^\\circ, \\text{...}. Write money as $12 outside the math.';

    const active = s.ids.reduce((t, id) => t + (s.items[id].secs || 0), 0) + (cur && !cur.checked ? (Date.now() - s.qStart) / 1000 : 0);
    if (active >= 20 * 60) { s.breakShown = true; stopPlayback(); S.modal = { t: 'break', ends: Date.now() + 120000 }; renderModal(); }
  }
}
setInterval(tick, 1000);

/* ================= boot ================= */
function hotState() { return { view: S.view, ret: S.ret, bank: S.bank, words: S.words, timedOpts: S.timedOpts, sess: S.sess, focusMode: S.focusMode }; }
let booted = false;
function boot(data) {
  if (booted) return; booted = true;
  loadLocal(); reindex();
  if (data && data.view) {
    Object.assign(S, { view: data.view, ret: data.ret || 'home', bank: Object.assign(S.bank, data.bank || {}), words: Object.assign(S.words, data.words || {}), timedOpts: data.timedOpts || S.timedOpts, sess: data.sess || null, focusMode: !!data.focusMode });
    if (S.sess) { S.sess.qStart = Date.now(); S.sess.tutor = S.sess.tutor || {}; for (const id in S.sess.tutor) S.sess.tutor[id].busy = false; sessSeq = Math.max(sessSeq, S.sess.id || 0); }
    if ((S.view === 'practice' || S.view === 'results' || S.view === 'presults') && !S.sess) S.view = 'home';
  } else {
    const d = daysUntil(PERT_DAY);
    if (d >= 0 && d <= 2) S.view = 'pert';
  }
  lastLevel = levelOf(xpTotal());
  render();
  initDb();
  sampler().then(fn => { S.ai = typeof fn === 'function'; if (S.ai) softRefresh(); });
  setTimeout(() => { Pad.prefetch(); }, 2500);
  if (window.__dzTest) window.__dz = { Vid, Pad, DZ, QMAP, DZD, MV, S: () => S, Store, openPadFor, watchDz, demoMove, drillMove, startDzSprint, dzLevel, dzState, act: (a, data) => { const b = document.createElement('button'); b.dataset.act = a; Object.assign(b.dataset, data || {}); app.appendChild(b); b.click(); b.remove(); } };
}
const hot = window.claude && window.claude.hot;
try { if (hot && typeof hot.snapshot === 'function') hot.snapshot(hotState); } catch (e) { /* optional */ }
try { if (hot && typeof hot.ready === 'function') hot.ready(d => boot(d || {})); else boot((hot && hot.data) || {}); } catch (e) { boot({}); }
setTimeout(() => boot({}), 1500);
})();
</script>
