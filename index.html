e.&lt;/li&gt;&lt;li&gt;Affect is usually the action. Effect is usually the result.&lt;/li&gt;&lt;li&gt;Than compares. Then is about time.&lt;/li&gt;&lt;li&gt;Test their, there, they’re, its, and it’s by reading them as they are or it is.&lt;/li&gt;&lt;/ul&gt;"},"pw-org":{"name":"Organization and transitions","short":"Organization","dom":"PW","lesson":"&lt;ul&gt;&lt;li&gt;Every sentence should support the topic sentence. Find the one that wanders off.&lt;/li&gt;&lt;li&gt;For sentence order, follow time words and what each sentence needs to come before it.&lt;/li&gt;&lt;li&gt;Transitions show the link: as a result for cause, however for contrast, for example for examples.&lt;/li&gt;&lt;li&gt;Taking notes from a source? The note has to keep every detail: days, times, and conditions.&lt;/li&gt;&lt;/ul&gt;"}},"priority":["bnd","tr","sys","fss","nlf","rs","pct","nle","wic","lf","coe","eqx","inf","circ","trig","l1","l2","ineq","rat","d1","prob","d2","area","lat","cid","tsp"],"pPriority":["pm-eq","pm-ineq","pm-fact","pm-line","pm-poly","pm-exp","pm-eval","pw-sent","pw-gram","pw-usage","pw-org","pr-main","pr-inf","pr-word","pr-struct"],"questions":[{"id":"RW-BND-01","k":"bnd","lv":"E","p":"<span class=\"sn\">Biologist Rachel Carson’s 1962 book <i>Silent Spring<\/i> documented the damage that the pesticide DDT was doing to bird populations.<\/span> <span class=\"sn\">Public concern about pesticides grew ______ the book’s findings helped lead to a 1972 ban on most uses of DDT in the United States.<\/span>","q":"Which choice completes the text so that it conforms to the conventions of Standard English?","x":"Two complete sentences (“Public concern about pesticides grew quickly” and “the book’s findings helped lead…”) can be joined with a comma plus a coordinating conjunction like <b>and<\/b>. The comma goes <i>before<\/i> <i>and<\/i>, never after it. A, B, and D all put a comma after <i>and<\/i>, which cuts the conjunction off from the clause it introduces.","t":"mc","c":["quickly; and,","quickly and,","quickly, and","quickly, and,"],"a":2},{"id":"RW-BND-02","k":"bnd","lv":"M","p":"<span class=\"sn\">Octopuses have only one type of light-sensitive cell in their eyes, so most species are thought to be ______ they are among the ocean’s most skilled camouflage artists, matching the colors of their surroundings in a fraction of a second.<\/span>","q":"Which choice completes the text so that it conforms to the conventions of Standard English?","x":"<i>However<\/i> starts a new complete sentence (“they are among the ocean’s most skilled camouflage artists”), so it needs a semicolon or period <b>before<\/b> it and a comma after it. A uses only commas, which creates a comma splice. C attaches <i>however<\/i> to the first clause, but the first clause doesn’t contrast with anything before it. D has no punctuation between the two sentences.","t":"mc","c":["colorblind, however,","colorblind; however,","colorblind, however;","colorblind however,"],"a":1},{"id":"RW-BND-03","k":"bnd","lv":"E","p":"<span class=\"sn\">Stretching across parts of Arizona, California, and northwestern Mexico, the Sonoran Desert is home to a remarkable variety of ______ saguaro, organ pipe, cholla, and prickly pear.<\/span>","q":"Which choice completes the text so that it conforms to the conventions of Standard English?","x":"A colon can introduce a list, but only after a complete sentence. “The Sonoran Desert is home to a remarkable variety of cacti” is complete, so A works. B and D put a colon right after <i>such as<\/i> and <i>including<\/i>, words that already introduce the list. C is wrong because a semicolon must join two complete sentences, and a list isn’t one.","t":"mc","c":["cacti:","cacti, such as:","cacti;","cacti, including:"],"a":0},{"id":"RW-BND-04","k":"bnd","lv":"M","p":"<span class=\"sn\">In 1992, Mae Jemison—a physician and engineer who had served as a Peace Corps medical officer in Sierra Leone and ______ became the first African American woman to travel to space.<\/span>","q":"Which choice completes the text so that it conforms to the conventions of Standard English?","x":"The dash after <i>Jemison<\/i> opens an interruption that adds extra information about her. An interruption must close with the <b>same<\/b> mark that opened it, so a second dash goes after <i>Liberia<\/i>. A mixes a dash with a comma, B uses a semicolon (which needs complete sentences on both sides), and C never closes the interruption, so the sentence seems to say Liberia went to space.","t":"mc","c":["Liberia,","Liberia;","Liberia","Liberia—"],"a":3},{"id":"RW-BND-05","k":"bnd","lv":"M","p":"<span class=\"sn\">Cochineal, a small insect that feeds on prickly pear cactus, produces a deep red pigment.<\/span> <span class=\"sn\">The dye that Indigenous artisans in Mexico extracted from these ______ so prized that, after the Spanish conquest, it became one of the most valuable goods shipped from the Americas to Europe.<\/span>","q":"Which choice completes the text so that it conforms to the conventions of Standard English?","x":"Strip the sentence to its core: “The dye … was so prized.” Everything from <i>that<\/i> to <i>insects<\/i> identifies which dye, so it isn’t set off with punctuation. Nothing should come between a subject (<i>dye<\/i>) and its verb (<i>was<\/i>). A, C, and D each wedge a mark between them.","t":"mc","c":["insects, was","insects was","insects—was","insects; was"],"a":1},{"id":"RW-BND-06","k":"bnd","lv":"M","p":"<span class=\"sn\">In her 1937 novel <i>Their Eyes Were Watching God<\/i>, ______ drew on years of fieldwork collecting folktales in Florida, the state where she grew up.<\/span>","q":"Which choice completes the text so that it conforms to the conventions of Standard English?","x":"<i>Author Zora Neale Hurston<\/i> works like a title attached to a name, and the name is essential (it tells us which author), so no commas go around it. A and B put a comma after <i>author<\/i>, splitting the title from the name. C puts a comma between the subject (<i>Hurston<\/i>) and its verb (<i>drew<\/i>).","t":"mc","c":["author, Zora Neale Hurston,","author, Zora Neale Hurston","author Zora Neale Hurston,","author Zora Neale Hurston"],"a":3},{"id":"RW-BND-07","k":"bnd","lv":"H","p":"<span class=\"sn\">Florida’s Treasure Coast, named for the Spanish gold and silver coins that still wash ashore from a fleet wrecked in a 1715 hurricane, is usually defined as three counties: Indian River, whose seat is Vero Beach; St. Lucie, whose seat is ______ and Martin, whose seat is Stuart.<\/span>","q":"Which choice completes the text so that it conforms to the conventions of Standard English?","x":"Each item in this list already contains a comma (“St. Lucie, whose seat is…”). When list items have their own commas, semicolons separate the items. The writer already used a semicolon after <i>Vero Beach<\/i>, so the same mark follows <i>Fort Pierce<\/i>. B’s comma blurs the items together, a colon can’t separate list items, and D leaves no break at all.","t":"mc","c":["Fort Pierce;","Fort Pierce,","Fort Pierce:","Fort Pierce"],"a":0},{"id":"RW-FSS-01","k":"fss","lv":"E","p":"<span class=\"sn\">The collection of handwritten letters, maps, and field notebooks that the explorer left to the museum ______ now available to researchers online.<\/span>","q":"Which choice completes the text so that it conforms to the conventions of Standard English?","x":"The subject is <i>collection<\/i>, which is singular. The phrase <i>of handwritten letters, maps, and field notebooks<\/i> just describes it. A singular subject takes the singular verb <b>is<\/b>. The plural nouns right before the blank are the trap: A, B, and D are all plural verbs.","t":"mc","c":["are","were","is","have been"],"a":2},{"id":"RW-FSS-02","k":"fss","lv":"E","p":"<span class=\"sn\">When summer temperatures climb, a honeybee colony actively cools ______ hive: worker bees carry droplets of water inside and fan their wings so that the water evaporates.<\/span>","q":"Which choice completes the text so that it conforms to the conventions of Standard English?","x":"The pronoun refers to <i>a honeybee colony<\/i>, which is singular, so it needs the singular possessive <b>its<\/b>. <i>It’s<\/i> means “it is,” <i>they’re<\/i> means “they are,” and <i>their<\/i> is plural. (Later, <i>their wings<\/i> is correct because it refers to the plural <i>worker bees<\/i>.)","t":"mc","c":["its","their","it’s","they’re"],"a":0},{"id":"RW-FSS-03","k":"fss","lv":"E","p":"<span class=\"sn\">On July 20, 1969, engineers at NASA’s Mission Control monitored every second of Apollo 11’s descent to the Moon.<\/span> <span class=\"sn\">When the lunar module’s guidance computer ______ a series of alarms, a 26-year-old guidance officer quickly determined that the landing could safely continue.<\/span>","q":"Which choice completes the text so that it conforms to the conventions of Standard English?","x":"The passage describes a finished event from 1969 with past-tense verbs (<i>monitored<\/i>, <i>determined<\/i>). The blank has to match: <b>triggered<\/b>. A and B are present-tense forms, and D is future tense, so each breaks the time sequence.","t":"mc","c":["triggers","has triggered","triggered","will trigger"],"a":2},{"id":"RW-FSS-04","k":"fss","lv":"H","p":"<span class=\"sn\">Found in 1850 at Saqqara, an ancient burial ground near Cairo, and carved from painted limestone roughly 4,500 years ago, ______<\/span>","q":"Which choice completes the text so that it conforms to the conventions of Standard English?","x":"The opening phrase (“Found in 1850 … and carved from painted limestone…”) describes something that was found and carved. Whatever comes right after the comma has to be that thing: the statue. Only B puts <i>the Seated Scribe<\/i> right after the phrase. A says archaeologists were carved from limestone, C says portraiture was, and D says the Louvre was.","t":"mc","c":["archaeologists consider the <i>Seated Scribe<\/i> a masterpiece of ancient Egyptian portraiture.","the <i>Seated Scribe<\/i> is considered a masterpiece of ancient Egyptian portraiture.","ancient Egyptian portraiture reached one of its high points with the <i>Seated Scribe<\/i>.","the Louvre Museum in Paris now displays the <i>Seated Scribe<\/i>."],"a":1},{"id":"RW-FSS-05","k":"fss","lv":"M","p":"<span class=\"sn\">For much of the twentieth century, ______ efforts to measure how fast the universe is expanding produced estimates that differed by as much as a factor of two.<\/span>","q":"Which choice completes the text so that it conforms to the conventions of Standard English?","x":"The efforts belong to many astronomers, so you need the plural possessive: put the apostrophe after the <i>s<\/i> → <b>astronomers’<\/b>. A has no apostrophe (no ownership), B is singular (one astronomer), and C isn’t a standard form for a plural ending in <i>s<\/i>.","t":"mc","c":["astronomers","astronomer’s","astronomers’s","astronomers’"],"a":3},{"id":"RW-FSS-06","k":"fss","lv":"H","p":"<span class=\"sn\">Among the artifacts that archaeologists have recovered from Siberia’s Denisova Cave ______ a slender needle, about seven centimeters long, that was carved from the bone of a bird.<\/span>","q":"Which choice completes the text so that it conforms to the conventions of Standard English?","x":"This sentence is flipped: the subject comes <i>after<\/i> the verb. Turn it around: “A slender needle … <b>is<\/b> among the artifacts.” The subject <i>needle<\/i> is singular, so the verb is <b>is<\/b>. The plural <i>artifacts<\/i> sits inside the phrase <i>Among the artifacts<\/i>, so it can’t be the subject.","t":"mc","c":["are","is","were","have been"],"a":1},{"id":"RW-FSS-07","k":"fss","lv":"M","p":"<span class=\"sn\">Lake Okeechobee, the largest freshwater lake in Florida, ______ much of its water from the Kissimmee River, which flows south into the lake from a chain of lakes near Orlando.<\/span>","q":"Which choice completes the text so that it conforms to the conventions of Standard English?","x":"The sentence needs a main verb for its subject, <i>Lake Okeechobee<\/i> (the words between the commas just rename the lake). Only <b>receives<\/b> can work as a main verb. <i>Receiving<\/i>, <i>to receive<\/i>, and <i>having received<\/i> can’t, so A, B, and D leave the sentence as a fragment.","t":"mc","c":["receiving","to receive","receives","having received"],"a":2},{"id":"RW-TR-01","k":"tr","lv":"E","p":"<span class=\"sn\">Many desert plants survive long droughts by storing water whenever it is available. ______ the saguaro cactus can expand its pleated stem like an accordion, taking in as much as 200 gallons of water during a single heavy rainstorm.<\/span>","q":"Which choice completes the text with the most logical transition?","x":"The first sentence makes a general claim (desert plants store water). The second gives one specific case of it (the saguaro storing water). A general idea followed by an instance calls for <b>For example<\/b>. A, B, and C all signal contrast, but the saguaro supports the first sentence.","t":"mc","c":["However,","In contrast,","Nevertheless,","For example,"],"a":3},{"id":"RW-TR-02","k":"tr","lv":"E","p":"<span class=\"sn\">After its discovery in 1930, Pluto was classified as the ninth planet in our solar system. ______ in 2006 the International Astronomical Union adopted a new definition of <i>planet<\/i> that Pluto did not meet, and Pluto was reclassified as a dwarf planet.<\/span>","q":"Which choice completes the text with the most logical transition?","x":"Pluto was a planet for decades, and then it wasn’t. The second sentence reverses the first, so you need a contrast: <b>However<\/b>. <i>Similarly<\/i> and <i>For instance<\/i> signal support, and <i>Therefore<\/i> says the 1930 classification <i>caused<\/i> the reclassification, which makes no sense.","t":"mc","c":["However,","Similarly,","Therefore,","For instance,"],"a":0},{"id":"RW-TR-03","k":"tr","lv":"M","p":"<span class=\"sn\">Newly hatched sea turtles find the ocean by crawling toward the brightest horizon, which on an undeveloped beach is the night sky over the water.<\/span> <span class=\"sn\">Artificial lights from nearby buildings, however, can draw hatchlings inland, away from the sea. ______ many coastal counties in Florida require beachfront properties to shield or turn off outdoor lights during nesting season.<\/span>","q":"Which choice completes the text with the most logical transition?","x":"The lighting rules are a <i>response<\/i> to the problem just described (lights lure hatchlings away from the sea). A cause followed by its result calls for <b>For this reason<\/b>. <i>Still<\/i> signals contrast, <i>Meanwhile<\/i> means at the same time, and <i>In comparison<\/i> sets up a comparison. None of them says the rules exist because of the danger.","t":"mc","c":["Still,","For this reason,","Meanwhile,","In comparison,"],"a":1},{"id":"RW-TR-04","k":"tr","lv":"M","p":"<span class=\"sn\">Many shoppers assume that brown eggs are more nutritious than white ones. ______ an egg’s shell color is determined mainly by the breed of the hen that laid it and says little about what is inside.<\/span>","q":"Which choice completes the text with the most logical transition?","x":"The first sentence states a common belief and the second corrects it. A transition that sets the record straight is needed: <b>In reality<\/b>. <i>Similarly<\/i> and <i>Additionally<\/i> would mean the second sentence agrees with the belief, and <i>As a result<\/i> would mean the belief causes shell color.","t":"mc","c":["Similarly,","As a result,","In reality,","Additionally,"],"a":2},{"id":"RW-TR-05","k":"tr","lv":"M","p":"<span class=\"sn\">Tardigrades, microscopic animals sometimes called water bears, can survive conditions that would kill most living things. ______ in 2007 researchers sent thousands of tardigrades into orbit on the outside of a spacecraft, and some of them survived exposure to the vacuum of space.<\/span>","q":"Which choice completes the text with the most logical transition?","x":"The second sentence gives striking evidence that backs up and strengthens the first (hard to kill → they even survived space). <b>In fact<\/b> introduces exactly that kind of stronger support. <i>Nonetheless<\/i> and <i>By contrast<\/i> signal opposition, and <i>Previously<\/i> signals an earlier time.","t":"mc","c":["Nonetheless,","Previously,","By contrast,","In fact,"],"a":3},{"id":"RW-TR-06","k":"tr","lv":"H","p":"<span class=\"sn\">Pompeii, the Roman city buried by the eruption of Mount Vesuvius in 79 CE, has been excavated for more than 250 years, and its streets, homes, and shops draw millions of visitors each year. ______ roughly a third of the ancient city remains buried, left untouched in part so that future archaeologists, with better techniques, can study it.<\/span>","q":"Which choice completes the text with the most logical transition?","x":"The first sentence stresses how much of Pompeii has been dug up; the second points out how much hasn’t. The second idea is true <i>despite<\/i> the first, which is what <b>Even so<\/b> signals. <i>Therefore<\/i> wrongly says the long excavation caused part of the city to stay buried, and <i>For instance<\/i> and <i>Similarly<\/i> treat the second sentence as support for the first.","t":"mc","c":["Even so,","Therefore,","For instance,","Similarly,"],"a":0},{"id":"RW-RS-01","k":"rs","lv":"E","p":"<span class=\"sn\">While researching a topic, a student has taken the following notes:<\/span><ul class=\"notes\"><li><span class=\"sn\">Manatees and dugongs are large, plant-eating marine mammals known as sirenians.<\/span><\/li><li><span class=\"sn\">Manatees have rounded, paddle-shaped tails.<\/span><\/li><li><span class=\"sn\">Dugongs have fluked tails shaped like a whale’s.<\/span><\/li><li><span class=\"sn\">Manatees live in the Atlantic Ocean, the Caribbean, and rivers in West Africa and South America.<\/span><\/li><li><span class=\"sn\">Dugongs live in coastal waters of the Indian and western Pacific Oceans.<\/span><\/li><\/ul>","q":"The student wants to emphasize a difference in appearance between manatees and dugongs. Which choice most effectively uses relevant information from the notes to accomplish this goal?","x":"The goal has two parts: a <b>difference<\/b>, and it has to be about <b>appearance<\/b>. Only B contrasts how the animals look (their tails). C is a difference, but it’s about where they live. A describes a similarity, and D describes only manatees.","t":"mc","c":["Manatees and dugongs are both sirenians, large marine mammals that eat plants.","While manatees have rounded, paddle-shaped tails, dugongs have fluked tails like a whale’s.","Dugongs live in the Indian and western Pacific Oceans, whereas manatees live in the Atlantic region.","Manatees, which have paddle-shaped tails, are sirenians."],"a":1},{"id":"RW-RS-02","k":"rs","lv":"E","p":"<span class=\"sn\">While researching a topic, a student has taken the following notes:<\/span><ul class=\"notes\"><li><span class=\"sn\">Katherine Johnson (1918–2020) was a mathematician at NASA.<\/span><\/li><li><span class=\"sn\">She calculated flight paths for early U.S. space missions.<\/span><\/li><li><span class=\"sn\">Before John Glenn’s 1962 orbital flight, Glenn asked that Johnson personally check numbers produced by an electronic computer.<\/span><\/li><li><span class=\"sn\">In 2015, she was awarded the Presidential Medal of Freedom.<\/span><\/li><\/ul>","q":"The student wants to introduce Katherine Johnson to an audience unfamiliar with her. Which choice most effectively uses relevant information from the notes to accomplish this goal?","x":"An audience that has never heard of Johnson first needs to know <b>who she was and what she did<\/b>. C gives her role and her main work. A and B mention real details but assume the reader already knows her, and D is mostly about John Glenn.","t":"mc","c":["In 2015, Katherine Johnson was awarded the Presidential Medal of Freedom.","Before his 1962 flight, John Glenn asked that Johnson personally check the computer’s numbers.","Katherine Johnson (1918–2020) was a NASA mathematician who calculated flight paths for early U.S. space missions.","Glenn’s 1962 orbital flight depended on numbers produced by an electronic computer."],"a":2},{"id":"RW-RS-03","k":"rs","lv":"M","p":"<span class=\"sn\">While researching a topic, a student has taken the following notes:<\/span><ul class=\"notes\"><li><span class=\"sn\">The Great Red Spot is a giant storm in Jupiter’s atmosphere.<\/span><\/li><li><span class=\"sn\">Astronomers have observed it for at least 150 years.<\/span><\/li><li><span class=\"sn\">In the late 1800s, it was estimated to be about 41,000 kilometers wide.<\/span><\/li><li><span class=\"sn\">In 2017, it measured about 16,000 kilometers wide.<\/span><\/li><li><span class=\"sn\">Earth’s diameter is about 12,700 kilometers.<\/span><\/li><\/ul>","q":"The student wants to emphasize how much the Great Red Spot has shrunk. Which choice most effectively uses relevant information from the notes to accomplish this goal?","x":"To show how much something has <b>shrunk<\/b>, you need a before-and-after comparison. D gives both sizes, so the drop is clear. B uses accurate numbers but compares the storm with Earth, which emphasizes how <i>big<\/i> it still is. A and C don’t mention a change in size at all.","t":"mc","c":["The Great Red Spot, a giant storm on Jupiter, has been observed for at least 150 years.","At about 16,000 kilometers wide in 2017, the Great Red Spot was still wider than Earth, whose diameter is about 12,700 kilometers.","The Great Red Spot is a giant storm in Jupiter’s atmosphere that is wider than Earth.","The Great Red Spot measured about 41,000 kilometers wide in the late 1800s, but by 2017 it had shrunk to about 16,000 kilometers."],"a":3},{"id":"RW-RS-04","k":"rs","lv":"M","p":"<span class=\"sn\">While researching a topic, a student has taken the following notes:<\/span><ul class=\"notes\"><li><span class=\"sn\">Wind turbines convert the energy of moving air into electricity.<\/span><\/li><li><span class=\"sn\">Offshore wind turbines are built in bodies of water, often miles from shore.<\/span><\/li><li><span class=\"sn\">Winds over the ocean are generally stronger and steadier than winds over land.<\/span><\/li><li><span class=\"sn\">A turbine in stronger, steadier winds can generate more electricity.<\/span><\/li><li><span class=\"sn\">Offshore turbines cost more to build and maintain than onshore turbines.<\/span><\/li><\/ul>","q":"The student wants to explain an advantage of offshore wind turbines compared with onshore turbines. Which choice most effectively uses relevant information from the notes to accomplish this goal?","x":"The goal needs something good about offshore turbines <b>and<\/b> a comparison with onshore ones. A explains why offshore turbines can produce more electricity. A is a comparison, but it’s a disadvantage (cost). C applies to all turbines, and D gives a location without saying why it helps.","t":"mc","c":["Because winds over the ocean are generally stronger and steadier than winds over land, offshore turbines can generate more electricity than onshore ones.","Offshore wind turbines, which are built in bodies of water, cost more to build and maintain than onshore turbines.","Whether they are built offshore or onshore, wind turbines convert the energy of moving air into electricity.","Offshore wind turbines are often built miles from shore."],"a":0},{"id":"RW-RS-05","k":"rs","lv":"H","p":"<span class=\"sn\">While researching a topic, a student has taken the following notes:<\/span><ul class=\"notes\"><li><span class=\"sn\">Each fall, monarch butterflies in eastern North America migrate south.<\/span><\/li><li><span class=\"sn\">Some travel as far as 4,800 kilometers to forests in the mountains of central Mexico, where they spend the winter.<\/span><\/li><li><span class=\"sn\">The monarchs that fly south belong to a single long-lived generation that can survive up to eight months.<\/span><\/li><li><span class=\"sn\">The return trip north in spring is completed over three to four generations.<\/span><\/li><li><span class=\"sn\">No single monarch completes the entire round trip.<\/span><\/li><\/ul>","q":"The student wants to contrast the southward and northward parts of the monarchs’ migration. Which choice most effectively uses relevant information from the notes to accomplish this goal?","x":"The goal is to <b>contrast<\/b> the two directions. C sets the southward trip (one generation) against the northward trip (three to four generations). D is tempting because it’s true and surprising, but it describes the round trip as a whole instead of contrasting its two parts. A and B each cover only one stage.","t":"mc","c":["Each fall, some monarchs in eastern North America fly as far as 4,800 kilometers south to the mountains of central Mexico.","Monarchs spend the winter in the mountains of central Mexico before beginning the return trip north in spring.","The southward migration is completed by a single long-lived generation of monarchs, but the return trip north takes three to four generations.","No single monarch completes the entire round trip between eastern North America and central Mexico."],"a":2},{"id":"RW-WIC-01","k":"wic","lv":"E","p":"<span class=\"sn\">Although the experimental drug performed well in early trials, researchers remained ______ about its long-term effectiveness, noting that much more data would be needed before they could draw firm conclusions.<\/span>","q":"Which choice completes the text with the most logical and precise word or phrase?","x":"<i>Although<\/i> sets up a contrast with the good early results, and the researchers want more data before concluding anything. That’s being careful and reserved: <b>cautious<\/b>. <i>Certain<\/i> contradicts “more data would be needed.” <i>Dismissive<\/i> is too negative given the good results, and <i>indifferent<\/i> means not caring, but these researchers clearly care.","t":"mc","c":["dismissive","cautious","indifferent","certain"],"a":1},{"id":"RW-WIC-02","k":"wic","lv":"M","p":"<span class=\"sn\">When biologist Lynn Margulis argued in 1967 that the energy-producing structures in our cells, called mitochondria, were once free-living bacteria, many scientists doubted her.<\/span> <span class=\"sn\">Later genetic evidence, however, ______ her theory, and today it is widely accepted.<\/span>","q":"Which choice completes the text with the most logical and precise word or phrase?","x":"<i>However<\/i> reverses the doubt, and the theory ended up widely accepted, so the evidence must have supported it. <b>Corroborated<\/b> means confirmed with evidence. <i>Undermined<\/i> and <i>obscured<\/i> mean the opposite, and evidence that came later can’t <i>anticipate<\/i> a theory that already existed.","t":"mc","c":["undermined","obscured","anticipated","corroborated"],"a":3},{"id":"RW-WIC-03","k":"wic","lv":"M","p":"<span class=\"sn\">The architect’s design for the community library is notable for its ______: every element of the building, from the slanted roof that channels rainwater into storage tanks to the wide windows that reduce the need for electric lighting, serves a practical purpose.<\/span>","q":"Which choice completes the text with the most logical and precise word or phrase?","x":"The colon tells you the second half explains the blank: every element “serves a practical purpose.” A design built around usefulness is notable for its <b>functionality<\/b>. <i>Ornamentation<\/i> means decoration, the opposite of practical. Nothing suggests the design is unclear (<i>ambiguity<\/i>) or easily broken (<i>fragility<\/i>).","t":"mc","c":["functionality","ornamentation","ambiguity","fragility"],"a":0},{"id":"RW-WIC-04","k":"wic","lv":"H","p":"<span class=\"sn\">The committee’s report was supposed to settle the dispute over the proposed highway once and for all.<\/span> <span class=\"sn\">Instead, its conclusions were so ______ that officials on both sides of the debate claimed the report supported their position.<\/span>","q":"Which choice completes the text with the most logical and precise word or phrase?","x":"If <b>both<\/b> sides could claim the report backed them, its conclusions must have been open to more than one reading. That’s what <b>equivocal<\/b> means. <i>Emphatic<\/i> (forceful and clear) would have settled the dispute. <i>Belated<\/i> (late) and <i>comprehensive<\/i> (thorough) don’t explain why both sides could claim victory.","t":"mc","c":["emphatic","equivocal","belated","comprehensive"],"a":1},{"id":"RW-WIC-05","k":"wic","lv":"H","p":"<span class=\"sn\">Some critics describe the novelist’s prose as spare, but the label doesn’t quite fit.<\/span> <span class=\"sn\">Her sentences are short, yet they are ______ with vivid images and precise sensory detail, so a single paragraph can take longer to absorb than a page of another writer’s work.<\/span>","q":"Which choice completes the text with the most logical and precise word or phrase?","x":"The passage pushes back on the label <i>spare<\/i>: the sentences are short but packed with images, and a paragraph takes a long time to absorb. Packed tightly with something = <b>dense<\/b>. <i>Sparse<\/i> and <i>unburdened<\/i> mean thin or light, the very idea the passage rejects. <i>Detached<\/i> describes emotional distance, not how much detail is packed in.","t":"mc","c":["sparse","unburdened","dense","detached"],"a":2},{"id":"RW-COE-01","k":"coe","lv":"E","p":"<span class=\"sn\">A student in an environmental science class recorded the number of pieces of plastic litter collected during four monthly cleanups at two beaches.<\/span> <span class=\"sn\">The student claims that the cleanups at Beach A collected more plastic than the cleanups at Beach B every month.<\/span><div class=\"tw\"><table class=\"dt\"><caption>Pieces of plastic collected<\/caption><thead><tr><th>Month<\/th><th>Beach A<\/th><th>Beach B<\/th><\/tr><\/thead><tbody><tr><td>June<\/td><td>312<\/td><td>287<\/td><\/tr><tr><td>July<\/td><td>405<\/td><td>351<\/td><\/tr><tr><td>August<\/td><td>298<\/td><td>322<\/td><\/tr><tr><td>September<\/td><td>276<\/td><td>240<\/td><\/tr><\/tbody><\/table><\/div>","q":"Which choice most effectively uses data from the table to weaken the student’s claim?","x":"The claim says Beach A beat Beach B <b>every<\/b> month, so one month where Beach B collected more weakens it. In August, Beach B (322) topped Beach A (298). A and B describe the table accurately but <i>support<\/i> the claim, and C is true but doesn’t compare the two beaches.","t":"mc","c":["In June, the cleanup at Beach A collected 312 pieces of plastic, and the cleanup at Beach B collected 287 pieces.","In July, the cleanup at Beach A collected 405 pieces of plastic, the most of any cleanup in the table.","In September, both cleanups collected fewer pieces of plastic than they had in July.","In August, the cleanup at Beach B collected 322 pieces of plastic, more than the 298 pieces collected at Beach A."],"a":3},{"id":"RW-COE-02","k":"coe","lv":"E","p":"<span class=\"sn\">A biology student grew bean plants under four colors of light for 21 days and then measured the average height of the plants in each group.<\/span> <span class=\"sn\">The student hypothesized that plants grown under green light would be shorter, on average, than plants grown under any of the other colors tested.<\/span><div class=\"tw\"><table class=\"dt\"><thead><tr><th>Light color<\/th><th>Average height (cm)<\/th><\/tr><\/thead><tbody><tr><td>Red<\/td><td>18.2<\/td><\/tr><tr><td>Blue<\/td><td>15.6<\/td><\/tr><tr><td>Green<\/td><td>9.4<\/td><\/tr><tr><td>White<\/td><td>19.0<\/td><\/tr><\/tbody><\/table><\/div>","q":"Which choice best describes data from the table that support the student’s hypothesis?","x":"The hypothesis compares <b>green<\/b> light with <b>every other color<\/b>. Only A compares the green-light average with all three others and shows it’s the lowest. B, C, and D report accurate data, but none of them mentions the green-light plants.","t":"mc","c":["The average height of plants grown under green light (9.4 cm) was lower than the averages for plants grown under red (18.2 cm), blue (15.6 cm), and white (19.0 cm) light.","Plants grown under white light had the greatest average height, 19.0 cm.","The average height of plants grown under blue light (15.6 cm) was lower than the average height of plants grown under red light (18.2 cm).","Plants grown under red light and white light had similar average heights."],"a":0},{"id":"RW-COE-03","k":"coe","lv":"H","p":"<span class=\"sn\">In a survey, students at a high school were asked how they usually get to school.<\/span> <span class=\"sn\">The table shows the results for two years.<\/span> <span class=\"sn\">A student reviewing the results concluded that the share of students who bike to school ______<\/span><div class=\"tw\"><table class=\"dt\"><caption>How students get to school<\/caption><thead><tr><th>Method<\/th><th>2024<\/th><th>2025<\/th><\/tr><\/thead><tbody><tr><td>Driven by family<\/td><td>46%<\/td><td>40%<\/td><\/tr><tr><td>School bus<\/td><td>32%<\/td><td>30%<\/td><\/tr><tr><td>Drive themselves<\/td><td>12%<\/td><td>15%<\/td><\/tr><tr><td>Bike<\/td><td>6%<\/td><td>10%<\/td><\/tr><tr><td>Walk<\/td><td>4%<\/td><td>5%<\/td><\/tr><\/tbody><\/table><\/div>","q":"Which choice most effectively uses data from the table to complete the statement?","x":"Check each claim against the table. Biking went from 6% to 10%, up 4 points. The other increases were smaller (driving themselves +3, walking +1), and the other two methods fell, so A is accurate. A is wrong because 10% is more than walking’s 5%. B is wrong because biking was below driving themselves in both years. D reverses the years.","t":"mc","c":["rose from 6% to 10%, though biking remained less common than walking.","was greater than the share of students who drove themselves to school in both years.","rose from 6% to 10%, the largest increase of any method in the table.","fell from 10% to 6% between 2024 and 2025."],"a":2},{"id":"RW-COE-04","k":"coe","lv":"M","p":"<span class=\"sn\">Some ecologists hypothesize that birds living in cities sing at a higher pitch than birds of the same species living in quiet forests because the low-pitched rumble of traffic drowns out lower notes.<\/span>","q":"Which finding, if true, would most directly support the ecologists’ hypothesis?","x":"The hypothesis links higher-pitched songs to <b>traffic noise<\/b>. B tests exactly that: same species, same city, and the birds near noisy roads sing higher than those in quiet parks, which rules out other city-versus-forest differences. A and C don’t connect pitch to noise, and D is about noise alone.","t":"mc","c":["Birds in forests sing more often in the early morning than at other times of day.","Within a single city, birds living near busy roads sing at a higher pitch than birds of the same species living in quiet parks.","Birds of some species are larger, on average, when they live in cities than when they live in forests.","Traffic noise in cities is loudest during weekday rush hours."],"a":1},{"id":"RW-INF-01","k":"inf","lv":"E","p":"<span class=\"sn\">Ice cores drilled from Antarctic ice sheets contain tiny bubbles of air that were trapped as snow piled up and compressed into ice.<\/span> <span class=\"sn\">Because deeper layers of ice formed earlier than shallower layers, scientists can analyze bubbles from different depths to learn about Earth’s atmosphere at different points in the past.<\/span> <span class=\"sn\">Thus, a scientist who wants to study the atmosphere from the most distant past should ______<\/span>","q":"Which choice most logically completes the text?","x":"Follow the chain: deeper ice formed earlier, and its bubbles hold air from when it formed. So the <b>oldest<\/b> air is in the <b>deepest<\/b> layers. A points to the shallowest (newest) layers, B wouldn’t reveal ancient air, and C throws away the very evidence the passage describes.","t":"mc","c":["compare air bubbles from the shallowest layers of ice cores taken on several continents.","measure how much snow falls on Antarctica each year.","avoid ice cores that contain air bubbles.","analyze air bubbles from the deepest layers of an ice core."],"a":3},{"id":"RW-INF-02","k":"inf","lv":"M","p":"<span class=\"sn\">When economist Esther Duflo studies an antipoverty program, she often uses a randomized controlled trial: researchers randomly choose some communities to receive the program and others not to, then compare the two groups over time.<\/span> <span class=\"sn\">Because the communities are assigned at random, the two groups should be alike in every important way except whether they received the program.<\/span> <span class=\"sn\">So if the communities that received the program later show better outcomes, researchers can reasonably conclude that ______<\/span>","q":"Which choice most logically completes the text?","x":"Random assignment makes the groups alike except for the program, so the program is the remaining explanation for a difference in outcomes: A. B goes far beyond the text (every country?). C contradicts the point that the groups are alike, and D contradicts the passage’s case for these trials.","t":"mc","c":["the difference in outcomes was most likely caused by the program.","the program would produce the same results in every country.","the communities that did not receive the program were poorer to begin with.","randomized controlled trials are less reliable than other kinds of studies."],"a":0},{"id":"RW-INF-03","k":"inf","lv":"H","p":"<span class=\"sn\">In 2017, researchers measured a population of small lizards on two islands in the Turks and Caicos.<\/span> <span class=\"sn\">Shortly afterward, Hurricanes Irma and Maria struck the islands.<\/span> <span class=\"sn\">When the researchers returned, the surviving lizards had larger toe pads and longer front legs, on average, than the lizards measured before the storms.<\/span> <span class=\"sn\">Larger toe pads help lizards cling to surfaces in strong winds.<\/span> <span class=\"sn\">The researchers concluded that the hurricanes had favored lizards with these traits, but this conclusion assumes that the differences between the two groups of lizards ______<\/span>","q":"Which choice most logically completes the text?","x":"Saying the storms <i>favored<\/i> certain lizards means lizards with big toe pads were more likely to survive. That only holds if the survivors already had those traits before the storms instead of developing them afterward, which is D. A and C aren’t needed for the conclusion, and B would actually <i>weaken<\/i> it, since it would mean the traits had nothing to do with the hurricanes.","t":"mc","c":["would disappear if another hurricane struck the islands.","were also found in lizard populations on islands that the hurricanes missed.","made the surviving lizards easier for predators to spot.","resulted from which lizards survived the storms, not from changes that took place in individual lizards after the storms."],"a":3},{"id":"RW-CID-01","k":"cid","lv":"E","p":"<span class=\"sn\">Many people picture glaciers as frozen and motionless, but glaciers are always moving.<\/span> <span class=\"sn\">Under the pressure of its own enormous weight, the ice at the bottom of a glacier deforms and flows like an extremely thick liquid.<\/span> <span class=\"sn\">Meltwater beneath a glacier can also act as a lubricant, allowing the entire mass of ice to slide over the ground.<\/span> <span class=\"sn\">Some glaciers creep forward less than a meter per day, while others have been measured moving tens of meters per day.<\/span>","q":"Which choice best states the main idea of the text?","x":"The whole text is about how glaciers move, and it gives two ways: the ice deforms and flows, and meltwater lets the glacier slide. B covers both. A overstates meltwater’s role, C isn’t discussed, and D twists one detail (some glaciers move less than a meter a day) into a claim about most of them.","t":"mc","c":["Meltwater is the most important factor in determining how fast a glacier moves.","Glaciers move, both because their ice deforms under its own weight and because they can slide over the ground.","Glaciers form only in places where snow does not melt during the summer.","Most glaciers move at a speed of less than one meter per day."],"a":1},{"id":"RW-TSP-01","k":"tsp","lv":"M","p":"<span class=\"sn\">For centuries, the giant squid was known only from dead specimens that washed ashore or were caught in fishing nets.<\/span> <span class=\"sn\">Biologists could only guess how the animal behaved in the deep sea where it lives.<\/span> <span class=\"sn\"><u>In 2012, a team aboard a submersible near Japan’s Ogasawara Islands recorded the first video of a live giant squid in its deep-sea habitat.<\/u><\/span> <span class=\"sn\">The footage, captured at a depth of about 630 meters, offered researchers a rare look at how the animal moves.<\/span>","q":"Which choice best describes the function of the underlined sentence in the text as a whole?","x":"The first two sentences set up a limitation: biologists only had dead specimens and could only guess about behavior. The underlined sentence describes the breakthrough that addressed it, so A. It doesn’t explain <i>why<\/i> (B), doesn’t question the footage (C), and calls the video a first, so it isn’t a common method (D).","t":"mc","c":["It presents a development that addressed the limitation described earlier in the text.","It explains why biologists had previously studied only dead specimens.","It challenges the accuracy of the footage described later in the text.","It describes a common method that biologists use to study deep-sea animals."],"a":0},{"id":"M-L1-01","k":"l1","lv":"E","p":"","q":"If \\(3(x - 4) = 2x + 5\\), what is the value of \\(x\\)?","x":"Distribute first: \\(3x - 12 = 2x + 5\\). Subtract \\(2x\\) from both sides: \\(x - 12 = 5\\). Add 12: \\(x = 17\\). Choice B comes from forgetting to multiply the 4 by 3.","t":"mc","c":["\\(-7\\)","\\(9\\)","\\(17\\)","\\(21\\)"],"a":2,"dz":"Graph \\(y = 3(x - 4)\\) and \\(y = 2x + 5\\). The \\(x\\)-value where they cross is the answer.","mv":"solve","dzs":{"view":[-5,25,-12,12],"sq":false,"steps":[{"say":"Type the whole equation, exactly as it’s written. No need to move anything around.","do":[["type",0,"3(x-4)=2x+5","3\\left(x-4\\right)=2x+5"]]},{"say":"Desmos draws a vertical line where the equation is true. Tap where it crosses the \\(x\\)-axis.","do":[["tap",17,0,0]]},{"say":"It crosses at \\((17, 0)\\), so \\(x = 17\\).","do":[["ans","\\(x = 17\\)"]]}]}},{"id":"M-L1-02","k":"l1","lv":"E","p":"","q":"A plumber charges a flat fee of $65 for a house call plus $48 for each hour of work. A customer’s total bill was $305. For how many hours did the plumber work?","x":"Flat fee + hourly charge = total: \\(65 + 48h = 305\\). Subtract 65: \\(48h = 240\\). Divide by 48: \\(h = 5\\).","t":"spr","ans":["5"],"v":5,"dz":"Type \\(65 + 48x = 305\\) and Desmos draws a vertical line at \\(x = 5\\).","mv":"solve","dzs":{"view":[-2,10,-5,5],"sq":false,"steps":[{"say":"Turn the words into one equation: $65 plus $48 for each hour equals $305. Use \\(x\\) for the hours.","do":[["type",0,"65+48x=305","65+48x=305"]]},{"say":"Tap where the vertical line crosses the \\(x\\)-axis.","do":[["tap",5,0,0]]},{"say":"\\(x = 5\\), so the plumber worked 5 hours.","do":[["ans","5 hours"]]}]}},{"id":"M-L1-03","k":"l1","lv":"M","p":"","q":"\\(\\frac{2}{3}x - 5 = \\frac{1}{2}x + 1\\)<br>What is the solution to the given equation?","x":"Clear the fractions by multiplying every term by 6, the least common denominator: \\(4x - 30 = 3x + 6\\). Subtract \\(3x\\): \\(x - 30 = 6\\), so \\(x = 36\\).","t":"spr","ans":["36"],"v":36,"mv":"solve","dzs":{"view":[-5,45,-8,8],"sq":false,"steps":[{"say":"Type the fractions with /. After the 3, press → to step out of the fraction before you type \\(x\\).","do":[["type",0,"2/3→x-5=1/2→x+1","\\frac{2}{3}x-5=\\frac{1}{2}x+1"]]},{"say":"The vertical line sits at \\(x = 36\\). Tap where it crosses the \\(x\\)-axis.","do":[["tap",36,0,0]]},{"say":"The solution is 36.","do":[["ans","\\(x = 36\\)"]]}]}},{"id":"M-LF-01","k":"lf","lv":"M","p":"","q":"A phone’s battery charge, in percent, is modeled by \\(C(t) = 100 - 8t\\), where \\(t\\) is the number of hours since the phone was fully charged. What is the best interpretation of 8 in this context?","x":"In a linear model, the number multiplying \\(t\\) is the rate of change: each 1-hour increase in \\(t\\) lowers \\(C\\) by 8, and \\(C\\) is in percent, so 8 percentage points per hour. D describes exponential decay (a percent of the <i>current<\/i> value), which would look like \\(100(0.92)^t\\). B is wrong because a full charge would last \\(100 \\div 8 = 12.5\\) hours.","t":"mc","c":["The battery charge decreases by 8 percentage points each hour.","The battery lasts 8 hours on a full charge.","The battery starts at 8 percent charge.","The battery charge decreases by 8 percent of its current value each hour."],"a":0},{"id":"M-LF-02","k":"lf","lv":"M","p":"","q":"The graph of the linear function \\(f\\) passes through the points \\((2, 7)\\) and \\((6, 19)\\) in the \\(xy\\)-plane. What is the \\(y\\)-intercept of the graph?","x":"Slope \\(= \\frac{19 - 7}{6 - 2} = \\frac{12}{4} = 3\\). Plug the point \\((2, 7)\\) into \\(y = 3x + b\\): \\(7 = 6 + b\\), so \\(b = 1\\). The \\(y\\)-intercept is \\((0, 1)\\). A uses the slope as the intercept.","t":"mc","c":["\\((0, 3)\\)","\\((0, 7)\\)","\\((0, -5)\\)","\\((0, 1)\\)"],"a":3,"mv":"reg","dzs":{"view":[-2,10,-4,24],"sq":false,"steps":[{"say":"Tap + Table and put in the two points.","do":[["table",0,[[2,7],[6,19]]]]},{"say":"Now type \\(y_1 \\sim mx_1 + b\\). The ~ tells Desmos to find the \\(m\\) and \\(b\\) that fit.","do":[["type",1,"y1~mx1+b","y_1\\sim mx_1+b"]]},{"say":"Desmos finds \\(m = 3\\) and \\(b = 1\\). Tap where the line crosses the \\(y\\)-axis: \\((0, 1)\\).","do":[["tap",0,1,1]]},{"say":"The \\(y\\)-intercept is \\((0, 1)\\).","do":[["ans","\\((0, 1)\\)"]]}]}},{"id":"M-LF-03","k":"lf","lv":"H","p":"","q":"For the linear function \\(f\\), \\(f(x) = ax + b\\), where \\(a\\) and \\(b\\) are constants. If \\(f(-2) = 5\\) and \\(f(4) = -7\\), what is the value of \\(a + b\\)?","x":"Slope: \\(a = \\frac{-7 - 5}{4 - (-2)} = \\frac{-12}{6} = -2\\). Then \\(f(-2) = -2(-2) + b = 4 + b = 5\\), so \\(b = 1\\), and \\(a + b = -2 + 1 = -1\\). Shortcut: \\(a + b\\) is just \\(f(1)\\).","t":"spr","ans":["-1"],"v":-1,"mv":"reg","dzs":{"view":[-6,6,-9,8],"sq":false,"steps":[{"say":"\\(f(-2) = 5\\) and \\(f(4) = -7\\) are just two points: \\((-2, 5)\\) and \\((4, -7)\\). Put them in a table.","do":[["table",0,[[-2,5],[4,-7]]]]},{"say":"Type \\(y_1 \\sim ax_1 + b\\) to match \\(f(x) = ax + b\\).","do":[["type",1,"y1~ax1+b","y_1\\sim ax_1+b"]]},{"say":"Desmos shows \\(a = -2\\) and \\(b = 1\\), so \\(a + b = -1\\).","do":[["sel",1],["ans","\\(a + b = -1\\)"]]}]}},{"id":"M-L2-01","k":"l2","lv":"E","p":"","q":"A school store sells pencils for $0.75 each and notebooks for $2.50 each. Maya spent exactly $20.00 on \\(p\\) pencils and \\(n\\) notebooks. Which equation represents this situation?","x":"Pencil cost = price × number = \\(0.75p\\). Notebook cost = \\(2.50n\\). Together they total $20: \\(0.75p + 2.50n = 20\\). B swaps the prices, C counts items instead of dollars, and D charges every item $3.25, the price of a pencil and a notebook together.","t":"mc","c":["\\(0.75p + 2.50n = 20\\)","\\(2.50p + 0.75n = 20\\)","\\(p + n = 20\\)","\\((0.75 + 2.50)(p + n) = 20\\)"],"a":0},{"id":"M-L2-02","k":"l2","lv":"M","p":"","q":"Line \\(\\ell\\) is defined by \\(2x + 5y = 10\\). Line \\(m\\) is perpendicular to line \\(\\ell\\) in the \\(xy\\)-plane. What is the slope of line \\(m\\)?","x":"Solve for \\(y\\) to get the slope of \\(\\ell\\): \\(5y = -2x + 10\\), so \\(y = -\\frac{2}{5}x + 2\\). Perpendicular slopes are negative reciprocals: flip \\(-\\frac{2}{5}\\) and change its sign to get \\(\\frac{5}{2}\\). B is the slope of \\(\\ell\\) itself.","t":"mc","c":["\\(-\\frac{5}{2}\\)","\\(-\\frac{2}{5}\\)","\\(\\frac{2}{5}\\)","\\(\\frac{5}{2}\\)"],"a":3},{"id":"M-SYS-01","k":"sys","lv":"E","p":"","q":"<div class=\"eqs\">\\(x + y = 14\\)<br>\\(x - y = 4\\)<\/div>The solution to the given system of equations is \\((x, y)\\). What is the value of \\(x\\)?","x":"Add the equations to cancel \\(y\\): \\((x + y) + (x - y) = 14 + 4\\), so \\(2x = 18\\) and \\(x = 9\\). (Then \\(y = 5\\).)","t":"spr","ans":["9"],"v":9,"mv":"cross","dzs":{"view":[-2,16,-4,16],"sq":false,"steps":[{"say":"Type the first equation exactly as given.","do":[["type",0,"x+y=14","x+y=14"]]},{"say":"Then the second one on a new line.","do":[["type",1,"x-y=4","x-y=4"]]},{"say":"Tap where the lines cross: \\((9, 5)\\). They asked for \\(x\\), so the answer is 9.","do":[["tap",9,5,0],["ans","\\(x = 9\\)"]]}]}},{"id":"M-SYS-02","k":"sys","lv":"M","p":"","q":"A theater sold 220 tickets for one performance. Adult tickets cost $12 each and student tickets cost $7 each. The theater collected $2,140 from ticket sales. How many adult tickets were sold?","x":"Let \\(a\\) = adult tickets and \\(s\\) = student tickets: \\(a + s = 220\\) and \\(12a + 7s = 2,140\\). Substitute \\(s = 220 - a\\): \\(12a + 7(220 - a) = 2,140\\), so \\(5a + 1,540 = 2,140\\), \\(5a = 600\\), and \\(a = 120\\). Check: 120 adult and 100 student tickets bring in \\(1,440 + 700 = 2,140\\) dollars.","t":"spr","ans":["120"],"v":120,"dz":"Graph \\(x + y = 220\\) and \\(12x + 7y = 2140\\), then tap the intersection: \\((120, 100)\\).","mv":"cross","dzs":{"view":[-10,10,-10,10],"sq":false,"steps":[{"say":"Let \\(x\\) be adult tickets and \\(y\\) be student tickets. Type the ticket count first.","do":[["type",0,"x+y=220","x+y=220"]]},{"say":"Then the money: $12 for each adult ticket and $7 for each student ticket.","do":[["type",1,"12x+7y=2140","12x+7y=2140"]]},{"say":"Nothing shows up yet because the numbers are big. Zoom out until you can see the lines cross.","do":[["view",-20,260,-20,260,true]]},{"say":"Tap the crossing point: \\((120, 100)\\).","do":[["tap",120,100,0]]},{"say":"\\(x\\) is adult tickets, so 120 adult tickets were sold.","do":[["ans","120 adult tickets"]]}]}},{"id":"M-SYS-03","k":"sys","lv":"H","p":"","q":"<div class=\"eqs\">\\(4x - 6y = 10\\)<br>\\(6x + ky = 15\\)<\/div>In the given system of equations, \\(k\\) is a constant. If the system has infinitely many solutions, what is the value of \\(k\\)?","x":"Infinitely many solutions means both equations describe the <b>same line<\/b>, so the second must be a multiple of the first. Since \\(6 = 1.5 \\times 4\\) and \\(15 = 1.5 \\times 10\\), the multiplier is 1.5, so \\(k = 1.5 \\times (-6) = -9\\).","t":"spr","ans":["-9"],"v":-9,"mv":"slide","dzs":{"view":[-6,8,-6,6],"sq":false,"steps":[{"say":"Type the first equation.","do":[["type",0,"4x-6y=10","4x-6y=10"]]},{"say":"Type the second one with \\(k\\) in it. Desmos doesn’t know \\(k\\) yet.","do":[["type",1,"6x+ky=15","6x+ky=15"]]},{"say":"Tap add slider for \\(k\\).","do":[["slider",1]]},{"say":"Infinitely many solutions means the two lines are the same line. Slide \\(k\\) until they land on top of each other.","do":[["slide",2,-9]]},{"say":"At \\(k = -9\\), the two lines match exactly.","do":[["ans","\\(k = -9\\)"]]}]}},{"id":"M-SYS-04","k":"sys","lv":"H","p":"","q":"<div class=\"eqs\">\\(kx + 3y = 7\\)<br>\\(2x - 6y = 5\\)<\/div>In the given system of equations, \\(k\\) is a constant. For which value of \\(k\\) does the system have no solution?","x":"No solution means parallel lines: same slope, different intercepts. Second line: \\(y = \\frac{1}{3}x - \\frac{5}{6}\\), slope \\(\\frac{1}{3}\\). First line: \\(y = -\\frac{k}{3}x + \\frac{7}{3}\\), slope \\(-\\frac{k}{3}\\). Set \\(-\\frac{k}{3} = \\frac{1}{3}\\), so \\(k = -1\\). The intercepts \\(\\frac{7}{3}\\) and \\(-\\frac{5}{6}\\) differ, so the lines never meet.","t":"mc","c":["\\(-2\\)","\\(-1\\)","\\(1\\)","\\(2\\)"],"a":1,"dz":"Graph both equations with a slider for \\(k\\) and find the value where the lines become parallel.","mv":"slide","dzs":{"view":[-6,8,-6,6],"sq":false,"steps":[{"say":"Type the first equation with the \\(k\\) in it.","do":[["type",0,"kx+3y=7","kx+3y=7"]]},{"say":"Tap add slider so you can move \\(k\\).","do":[["slider",0]]},{"say":"Type the second equation.","do":[["type",2,"2x-6y=5","2x-6y=5"]]},{"say":"No solution means the lines never meet, so they’re parallel. Slide \\(k\\) until the lines run side by side.","do":[["slide",1,-1]]},{"say":"At \\(k = -1\\) the lines are parallel.","do":[["ans","\\(k = -1\\)"]]}]}},{"id":"M-INEQ-01","k":"ineq","lv":"E","p":"","q":"A delivery van can safely carry at most 1,500 pounds, including the driver. The driver weighs 180 pounds, and each box weighs 40 pounds. Which inequality represents the possible numbers of boxes, \\(b\\), that can be loaded into the van?","x":"Total weight = driver + boxes = \\(180 + 40b\\). “At most” means the total can be equal to or less than 1,500, so use \\(\\le\\). A flips the inequality (that would mean <i>at least<\/i> 1,500 pounds), and B and D swap the driver’s weight with a box’s weight.","t":"mc","c":["\\(180 + 40b \\ge 1,500\\)","\\(40 + 180b \\le 1,500\\)","\\(180 + 40b \\le 1,500\\)","\\(180b + 40 \\ge 1,500\\)"],"a":2},{"id":"M-INEQ-02","k":"ineq","lv":"M","p":"","q":"Which point \\((x, y)\\) is a solution to the system of inequalities \\(y > 2x - 3\\) and \\(y \\le -x + 6\\)?","x":"Test each point in <b>both<\/b> inequalities. For \\((2, 3)\\): \\(3 > 2(2) - 3 = 1\\) ✓ and \\(3 \\le -2 + 6 = 4\\) ✓. Each other point fails one: \\((0, -4)\\) fails the first (\\(-4\\) isn’t greater than \\(-3\\)), \\((4, 1)\\) fails the first (1 isn’t greater than 5), and \\((-1, 8)\\) fails the second (8 isn’t at most 7).","t":"mc","c":["\\((0, -4)\\)","\\((2, 3)\\)","\\((4, 1)\\)","\\((-1, 8)\\)"],"a":1,"dz":"Type both inequalities into Desmos. The point that sits in the overlapping shaded region is the answer.","mv":"shape","dzs":{"view":[-6,8,-6,10],"sq":false,"steps":[{"say":"Type the first inequality. Desmos shades every point that works. The dashed line means the line itself doesn’t count.","do":[["type",0,"y>2x-3","y>2x-3"]]},{"say":"Type the second one. Typing &lt; then = makes ≤.","do":[["type",1,"y<=-x+6","y\\le-x+6"]]},{"say":"The answer is in the overlap, where both shadings meet. Type the four choices as a list of points in square brackets.","do":[["type",2,"[(0,-4),(4,1),(2,3),(-1,8)]","\\left[\\left(0,-4\\right),\\left(4,1\\right),\\left(2,3\\right),\\left(-1,8\\right)\\right]"]]},{"say":"Only \\((2, 3)\\) lands in the double-shaded part.","do":[["pin",2,3,2],["ans","\\((2, 3)\\)"]]}]}},{"id":"M-EQX-01","k":"eqx","lv":"M","p":"","q":"Which expression is equivalent to \\((2x + 3)^2 - (x - 1)^2\\)?","x":"Expand each square: \\((2x + 3)^2 = 4x^2 + 12x + 9\\) and \\((x - 1)^2 = x^2 - 2x + 1\\). Subtract, sending the minus to <b>every<\/b> term: \\(4x^2 + 12x + 9 - x^2 + 2x - 1 = 3x^2 + 14x + 8\\). B and C each come from dropping that minus on one term.","t":"mc","c":["\\(3x^2 + 14x + 8\\)","\\(3x^2 + 10x + 8\\)","\\(3x^2 + 14x + 10\\)","\\(3x^2 + 10x + 10\\)"],"a":0,"dz":"Graph the original expression and each choice. Only A lands exactly on top of it.","mv":"same","dzs":{"view":[-8,4,-20,20],"sq":false,"steps":[{"say":"Graph the original expression.","do":[["type",0,"(2x+3)^2-(x-1)^2","\\left(2x+3\\right)^2-\\left(x-1\\right)^2"]]},{"say":"Now graph a choice. This one is a different curve, so it’s not equivalent.","do":[["type",1,"3x^2+10x+8","3x^2+10x+8"]]},{"say":"Hide it and try another. This one lands exactly on top of the original.","do":[["hide",1],["type",2,"3x^2+14x+8","3x^2+14x+8"]]},{"say":"Same graph means equivalent expressions.","do":[["ans","\\(3x^2 + 14x + 8\\)"]]}]}},{"id":"M-EQX-02","k":"eqx","lv":"M","p":"","q":"Which expression is equivalent to \\(\\frac{x^5y^{-2}}{x^2y^{-6}}\\), where \\(x > 0\\) and \\(y > 0\\)?","x":"Dividing powers with the same base means subtracting exponents (top minus bottom): \\(x^{5-2} = x^3\\) and \\(y^{-2-(-6)} = y^4\\). A adds the \\(y\\) exponents, B adds the \\(x\\) exponents, and C subtracts the \\(y\\) exponents in the wrong order.","t":"mc","c":["\\(x^3y^{-8}\\)","\\(x^7y^4\\)","\\(x^3y^{-4}\\)","\\(x^3y^4\\)"],"a":3},{"id":"M-EQX-03","k":"eqx","lv":"M","p":"","q":"Which expression is equivalent to \\(\\sqrt[4]{x^3}\\cdot\\sqrt{x}\\), where \\(x > 0\\)?","x":"Rewrite each root as a fractional exponent: \\(\\sqrt[4]{x^3} = x^{3/4}\\) and \\(\\sqrt{x} = x^{1/2}\\). Multiplying means adding exponents: \\(\\frac{3}{4} + \\frac{2}{4} = \\frac{5}{4}\\). A multiplies the exponents instead of adding them.","t":"mc","c":["\\(x^{3/8}\\)","\\(x^{5/4}\\)","\\(x^{5/6}\\)","\\(x^{2}\\)"],"a":1,"mv":"same","dzs":{"view":[-1,6,-2,10],"sq":false,"steps":[{"say":"Type the original. For a 4th root, type nthroot, then 4, then → to get under the root sign.","do":[["type",0,"nthroot4→x^3→→*sqrtx","\\sqrt[4]{x^3}\\cdot\\sqrt{x}"]]},{"say":"Now graph a choice. \\(x^{5/4}\\) lands right on top of it.","do":[["type",1,"x^5/4","x^{\\frac{5}{4}}"]]},{"say":"Same graph, same expression.","do":[["ans","\\(x^{5/4}\\)"]]}]}},{"id":"M-EQX-04","k":"eqx","lv":"H","p":"","q":"In the equation \\(3x^2 + bx - 10 = (3x + c)(x - 2)\\), \\(b\\) and \\(c\\) are constants, and the equation is true for all values of \\(x\\). What is the value of \\(b\\)?","x":"Expand the right side: \\((3x + c)(x - 2) = 3x^2 - 6x + cx - 2c\\). Match the constants: \\(-2c = -10\\), so \\(c = 5\\). Match the \\(x\\)-terms: \\(b = -6 + c = -6 + 5 = -1\\).","t":"spr","ans":["-1"],"v":-1},{"id":"M-NLF-01","k":"nlf","lv":"E","p":"","q":"The population of a town is modeled by \\(P(t) = 12,000(1.03)^t\\), where \\(t\\) is the number of years after 2020. Which statement best describes how the population changes?","x":"In \\(a(1 + r)^t\\), the growth factor is \\(1.03 = 1 + 0.03\\), so the population grows 3% per year. C is the trap: 3% of 12,000 is 360, but that’s only the first year’s increase. Because the population keeps growing, each year’s 3% is more people than the year before.","t":"mc","c":["It increases by 1.03 people each year.","It increases by 30% each year.","It increases by 360 people each year.","It increases by 3% each year."],"a":3},{"id":"M-NLF-02","k":"nlf","lv":"E","p":"","q":"The function \\(f\\) is defined by \\(f(x) = -2(x - 3)^2 + 8\\). What is the maximum value of \\(f(x)\\)?","x":"In vertex form \\(a(x - h)^2 + k\\), the vertex is \\((h, k) = (3, 8)\\). Since \\(a = -2\\) is negative, the parabola opens downward, so the vertex is the highest point and the maximum value is its \\(y\\)-coordinate, 8. B is <i>where<\/i> the maximum happens (\\(x = 3\\)), not the maximum value.","t":"mc","c":["\\(-2\\)","\\(3\\)","\\(8\\)","\\(11\\)"],"a":2,"mv":"para","dzs":{"view":[-2,8,-6,10],"sq":false,"steps":[{"say":"Type \\(f\\) exactly as it’s written.","do":[["type",0,"f(x)=-2(x-3)^2+8","f\\left(x\\right)=-2\\left(x-3\\right)^2+8"]]},{"say":"Tap the top of the parabola. The vertex is \\((3, 8)\\).","do":[["tap",3,8,0]]},{"say":"The maximum value of \\(f(x)\\) is the \\(y\\)-value: 8. The trap is 3, which is the \\(x\\)-value.","do":[["ans","Maximum value: 8"]]}]}},{"id":"M-NLF-03","k":"nlf","lv":"M","p":"","q":"A ball is thrown upward. Its height above the ground, in feet, \\(t\\) seconds after it is thrown is given by \\(h(t) = -16t^2 + 64t + 5\\). What is the maximum height, in feet, that the ball reaches?","x":"The maximum is at the vertex: \\(t = -\\frac{b}{2a} = -\\frac{64}{2(-16)} = 2\\). Then \\(h(2) = -16(4) + 64(2) + 5 = -64 + 128 + 5 = 69\\) feet.","t":"spr","ans":["69"],"v":69,"dz":"Graph \\(y = -16x^2 + 64x + 5\\) and tap the top of the parabola: \\((2, 69)\\).","mv":"para","dzs":{"view":[-1,5,-10,80],"sq":false,"steps":[{"say":"Type it with \\(x\\) for \\(t\\) and \\(y\\) for \\(h\\).","do":[["type",0,"y=-16x^2+64x+5","y=-16x^2+64x+5"]]},{"say":"Tap the top of the curve: \\((2, 69)\\).","do":[["tap",2,69,0]]},{"say":"The maximum height is the \\(y\\)-value: 69 feet.","do":[["ans","69 feet"]]}]}},{"id":"M-NLF-04","k":"nlf","lv":"M","p":"","q":"A car’s value decreases by 15% each year. The car is worth $24,000 now. Which function gives the car’s value \\(V\\), in dollars, \\(t\\) years from now?","x":"Losing 15% each year means keeping 85% of the value, so multiply by \\(1 - 0.15 = 0.85\\) once per year: \\(24,000(0.85)^t\\). A keeps only 15% each year, B is 15% <i>growth<\/i>, and D subtracts just 15 cents per year.","t":"mc","c":["\\(V(t) = 24,000(0.15)^t\\)","\\(V(t) = 24,000(1.15)^t\\)","\\(V(t) = 24,000(0.85)^t\\)","\\(V(t) = 24,000 - 0.15t\\)"],"a":2},{"id":"M-NLF-05","k":"nlf","lv":"M","p":"","q":"The functions \\(f\\) and \\(g\\) are defined by \\(f(x) = x^2 - 4x\\) and \\(g(x) = f(x + 2)\\). What is the value of \\(g(3)\\)?","x":"\\(g(3) = f(3 + 2) = f(5)\\), and \\(f(5) = 5^2 - 4(5) = 25 - 20 = 5\\).","t":"spr","ans":["5"],"v":5,"mv":"func","dzs":{"view":[-10,10,-10,10],"sq":false,"steps":[{"say":"Define \\(f\\) exactly as given.","do":[["type",0,"f(x)=x^2-4x","f\\left(x\\right)=x^2-4x"]]},{"say":"Define \\(g\\) using \\(f\\). Desmos does the substitution for you.","do":[["type",1,"g(x)=f(x+2)","g\\left(x\\right)=f\\left(x+2\\right)"]]},{"say":"Type \\(g(3)\\). The value shows up right under it: 5.","do":[["type",2,"g(3)","g\\left(3\\right)"],["ans","\\(g(3) = 5\\)"]]}]}},{"id":"M-NLE-01","k":"nle","lv":"E","p":"","q":"What are the solutions to the equation \\(x^2 - 5x - 14 = 0\\)?","x":"Find two numbers that multiply to \\(-14\\) and add to \\(-5\\): \\(-7\\) and \\(2\\). So \\((x - 7)(x + 2) = 0\\), which gives \\(x = 7\\) or \\(x = -2\\). A is the classic sign slip: solutions have the <i>opposite<\/i> signs of the numbers inside the factors.","t":"mc","c":["\\(x = 7\\) and \\(x = -2\\)","\\(x = -7\\) and \\(x = 2\\)","\\(x = 7\\) and \\(x = 2\\)","\\(x = -7\\) and \\(x = -2\\)"],"a":0,"dz":"Graph \\(y = x^2 - 5x - 14\\) and tap the two \\(x\\)-intercepts.","mv":"para","dzs":{"view":[-6,10,-25,10],"sq":false,"steps":[{"say":"Graph the left side as \\(y = \\)….","do":[["type",0,"y=x^2-5x-14","y=x^2-5x-14"]]},{"say":"The solutions are where the graph meets the \\(x\\)-axis. Tap both gray dots.","do":[["tap",-2,0,0],["tap",7,0,0]]},{"say":"The solutions are \\(x = -2\\) and \\(x = 7\\).","do":[["ans","\\(x = 7\\) and \\(x = -2\\)"]]}]}},{"id":"M-NLE-02","k":"nle","lv":"M","p":"","q":"In the equation \\(x^2 - 6x + c = 0\\), \\(c\\) is a constant. If the equation has exactly one real solution, what is the value of \\(c\\)?","x":"A quadratic has exactly one real solution when its discriminant is zero: \\(b^2 - 4ac = (-6)^2 - 4(1)(c) = 36 - 4c = 0\\), so \\(c = 9\\). (Then \\(x^2 - 6x + 9 = (x - 3)^2\\), whose only solution is 3.)","t":"spr","ans":["9"],"v":9,"mv":"slide","dzs":{"view":[-3,9,-6,10],"sq":false,"steps":[{"say":"Graph \\(y = x^2 - 6x + c\\). One real solution means the parabola just touches the \\(x\\)-axis.","do":[["type",0,"y=x^2-6x+c","y=x^2-6x+c"]]},{"say":"Tap add slider for \\(c\\).","do":[["slider",0]]},{"say":"Slide \\(c\\) until the bottom of the parabola sits right on the \\(x\\)-axis.","do":[["slide",1,9]]},{"say":"At \\(c = 9\\) it touches at exactly one point, \\((3, 0)\\).","do":[["tap",3,0,0],["ans","\\(c = 9\\)"]]}]}},{"id":"M-NLE-03","k":"nle","lv":"M","p":"","q":"<div class=\"eqs\">\\(y = x^2 - 3\\)<br>\\(y = 2x\\)<\/div>The graphs of the given equations in the \\(xy\\)-plane intersect at two points. What is the sum of the \\(x\\)-coordinates of the two points?","x":"Set the two expressions for \\(y\\) equal: \\(x^2 - 3 = 2x\\), so \\(x^2 - 2x - 3 = 0\\) and \\((x - 3)(x + 1) = 0\\). The \\(x\\)-coordinates are 3 and \\(-1\\), and their sum is 2.","t":"spr","ans":["2"],"v":2,"dz":"Graph both and tap the intersections: \\((-1, -2)\\) and \\((3, 6)\\).","mv":"cross","dzs":{"view":[-5,6,-6,10],"sq":false,"steps":[{"say":"Type the first equation.","do":[["type",0,"y=x^2-3","y=x^2-3"]]},{"say":"Type the second.","do":[["type",1,"y=2x","y=2x"]]},{"say":"Tap both crossing points: \\((-1, -2)\\) and \\((3, 6)\\).","do":[["tap",-1,-2,0],["tap",3,6,0]]},{"say":"Add the \\(x\\)-coordinates: \\(-1 + 3 = 2\\).","do":[["ans","2"]]}]}},{"id":"M-NLE-04","k":"nle","lv":"H","p":"","q":"What is the solution set of the equation \\(\\sqrt{x + 7} = x - 5\\)?","x":"Square both sides: \\(x + 7 = x^2 - 10x + 25\\), so \\(x^2 - 11x + 18 = 0\\) and \\((x - 2)(x - 9) = 0\\). Squaring can create fake solutions, so check both. \\(x = 9\\): \\(\\sqrt{16} = 4\\) and \\(9 - 5 = 4\\) ✓. \\(x = 2\\): \\(\\sqrt{9} = 3\\), but \\(2 - 5 = -3\\) ✗. Only 9 works.","t":"mc","c":["\\(\\{2\\}\\)","\\(\\{2, 9\\}\\)","\\(\\{9\\}\\)","There is no solution."],"a":2,"dz":"Graph \\(y = \\sqrt{x + 7}\\) and \\(y = x - 5\\). They cross only once, at \\(x = 9\\).","mv":"solve","dzs":{"view":[-8,14,-6,8],"sq":false,"steps":[{"say":"Graph each side as its own \\(y = \\)…. Type sqrt, the inside, then →.","do":[["type",0,"y=sqrtx+7→","y=\\sqrt{x+7}"]]},{"say":"Now the right side.","do":[["type",1,"y=x-5","y=x-5"]]},{"say":"They cross only once, at \\((9, 4)\\). The algebra also gives \\(x = 2\\), but that’s a fake solution, and Desmos never shows it.","do":[["tap",9,4,0]]},{"say":"The solution set is \\(\\{9\\}\\).","do":[["ans","\\(\\{9\\}\\)"]]}]}},{"id":"M-NLE-05","k":"nle","lv":"M","p":"","q":"What is the sum of the solutions to \\(|2x - 5| = 9\\)?","x":"An absolute value equals 9 when the inside is 9 or \\(-9\\). If \\(2x - 5 = 9\\), then \\(x = 7\\). If \\(2x - 5 = -9\\), then \\(x = -2\\). The sum is \\(7 + (-2) = 5\\).","t":"spr","ans":["5"],"v":5,"mv":"solve","dzs":{"view":[-6,10,-6,6],"sq":false,"steps":[{"say":"Type the equation as given. Typing | starts the absolute value, and typing | again closes it.","do":[["type",0,"|2x-5|=9","\\left|2x-5\\right|=9"]]},{"say":"Two vertical lines show up. Tap where each one crosses the \\(x\\)-axis.","do":[["tap",-2,0,0],["tap",7,0,0]]},{"say":"Add the solutions: \\(-2 + 7 = 5\\).","do":[["ans","5"]]}]}},{"id":"M-PCT-01","k":"pct","lv":"E","p":"","q":"A jacket originally priced at $80 is on sale for 25% off. What is the sale price, in dollars?","x":"25% off means you pay 75% of the price: \\(0.75 \\times 80 = 60\\). Or find the discount, \\(0.25 \\times 80 = 20\\), and subtract: \\(80 - 20 = 60\\).","t":"spr","ans":["60"],"v":60,"mv":"calc","dzs":{"view":[-10,10,-10,10],"sq":false,"steps":[{"say":"25% off means you pay 75%, so multiply by 0.75.","do":[["type",0,"80*0.75","80\\cdot0.75"]]},{"say":"Desmos shows 60.","do":[["ans","$60"]]}]}},{"id":"M-PCT-02","k":"pct","lv":"M","p":"","q":"The price of a video game increased from $50 to $60. By what percent did the price increase?","x":"Percent change \\(= \\frac{\\text{new} - \\text{old}}{\\text{old}} = \\frac{60 - 50}{50} = \\frac{10}{50} = 0.20\\), or 20%. C divides by the new price, which gives the percent <i>decrease<\/i> from $60 back to $50. D is the new price as a percent of the old one.","t":"mc","c":["10%","20%","About 16.7%","120%"],"a":1},{"id":"M-PCT-03","k":"pct","lv":"H","p":"","q":"A store increases the price of a lamp by 40%. Later, it discounts the new price by 25%. The final price is what percent of the original price?","x":"Successive percent changes multiply. A 40% increase multiplies by 1.40, and a 25% discount multiplies by 0.75: \\(1.40 \\times 0.75 = 1.05\\), so the final price is 105% of the original. Subtracting the percents (\\(40 - 25 = 15\\)) is the trap; it would give 115%.","t":"spr","ans":["105"],"v":105,"mv":"calc","dzs":{"view":[-10,10,-10,10],"sq":false,"steps":[{"say":"A 40% increase multiplies the price by 1.4. A 25% discount multiplies it by 0.75. Type both.","do":[["type",0,"1.4*0.75","1.4\\cdot0.75"]]},{"say":"Desmos shows 1.05, so the final price is 105% of the original.","do":[["ans","105%"]]}]}},{"id":"M-PCT-04","k":"pct","lv":"M","p":"","q":"The number \\(x\\) is 150% of \\(y\\), and \\(y\\) is 40% of \\(z\\). If \\(z\\) is positive, \\(x\\) is what percent of \\(z\\)?","x":"Translate: \\(x = 1.5y\\) and \\(y = 0.4z\\). Substitute: \\(x = 1.5(0.4z) = 0.6z\\), so \\(x\\) is 60% of \\(z\\). Quick check with \\(z = 100\\): \\(y = 40\\) and \\(x = 60\\).","t":"spr","ans":["60"],"v":60,"mv":"calc","dzs":{"view":[-10,10,-10,10],"sq":false,"steps":[{"say":"\\(x\\) is 1.5 times \\(y\\), and \\(y\\) is 0.4 times \\(z\\). Multiply the two.","do":[["type",0,"1.5*0.4","1.5\\cdot0.4"]]},{"say":"Desmos shows 0.6, so \\(x\\) is 60% of \\(z\\).","do":[["ans","60%"]]}]}},{"id":"M-RAT-01","k":"rat","lv":"E","p":"","q":"A car travels 210 miles on 7 gallons of gas. At this rate, how many gallons of gas does the car need to travel 360 miles?","x":"Find the unit rate: \\(210 \\div 7 = 30\\) miles per gallon. Then \\(360 \\div 30 = 12\\) gallons.","t":"spr","ans":["12"],"v":12},{"id":"M-RAT-02","k":"rat","lv":"M","p":"","q":"A pump moves water into an empty tank at a constant rate of 18 liters per minute. How many hours will it take the pump to fill the tank with 4,320 liters of water?","x":"Minutes needed: \\(4,320 \\div 18 = 240\\) minutes. Convert: \\(240 \\div 60 = 4\\) hours. The question asks for hours, so 240 is the trap.","t":"spr","ans":["4"],"v":4},{"id":"M-RAT-03","k":"rat","lv":"M","p":"","q":"A recipe uses flour and sugar in a ratio of 5 to 2 by volume. A baker uses a total of 21 cups of flour and sugar combined. How many cups of flour does the baker use?","x":"A 5 : 2 ratio means 5 parts flour out of \\(5 + 2 = 7\\) total parts. Flour is \\(\\frac{5}{7}\\) of the total: \\(\\frac{5}{7} \\times 21 = 15\\) cups. (Sugar is 6 cups, and 15 : 6 = 5 : 2.)","t":"spr","ans":["15"],"v":15},{"id":"M-D1-01","k":"d1","lv":"E","p":"","q":"A data set consists of the values 4, 7, 7, 9, and 13. If the value 13 is replaced with 33, which statement about the new data set is true?","x":"The median is the middle value of the ordered list (4, 7, <b>7<\/b>, 9, 13). Changing the largest value doesn’t move the middle, so it stays 7. The mean uses every value, so raising one value by 20 raises the mean by \\(20 \\div 5 = 4\\) (from 8 to 12).","t":"mc","c":["The mean increases, and the median stays the same.","Both the mean and the median increase.","The median increases, and the mean stays the same.","Neither the mean nor the median changes."],"a":0,"mv":"calc","dzs":{"view":[-10,10,-10,10],"sq":false,"steps":[{"say":"Type mean of the old list, with the numbers in square brackets.","do":[["type",0,"mean([4,7,7,9,13])","\\operatorname{mean}\\left(\\left[4,7,7,9,13\\right]\\right)"]]},{"say":"Now the new list. The mean jumps from 8 to 12.","do":[["type",1,"mean([4,7,7,9,33])","\\operatorname{mean}\\left(\\left[4,7,7,9,33\\right]\\right)"]]},{"say":"Check the medians. Both are 7.","do":[["type",2,"median([4,7,7,9,13])","\\operatorname{median}\\left(\\left[4,7,7,9,13\\right]\\right)"],["type",3,"median([4,7,7,9,33])","\\operatorname{median}\\left(\\left[4,7,7,9,33\\right]\\right)"]]},{"say":"The mean goes up and the median stays the same.","do":[["ans","Mean up, median the same"]]}]}},{"id":"M-D1-02","k":"d1","lv":"M","p":"","q":"The mean of 6 numbers is 15. When one of the numbers is removed, the mean of the remaining 5 numbers is 13. What number was removed?","x":"Turn means into totals. Six numbers with mean 15 total \\(6 \\times 15 = 90\\). Five numbers with mean 13 total \\(5 \\times 13 = 65\\). The removed number is \\(90 - 65 = 25\\).","t":"spr","ans":["25"],"v":25,"mv":"calc","dzs":{"view":[-10,10,-10,10],"sq":false,"steps":[{"say":"The 6 numbers add up to \\(6 \\times 15\\). The 5 left add up to \\(5 \\times 13\\). The difference is the removed number.","do":[["type",0,"6*15-5*13","6\\cdot15-5\\cdot13"]]},{"say":"Desmos shows 25.","do":[["ans","25"]]}]}},{"id":"M-D1-03","k":"d1","lv":"M","p":"","q":"Data set A consists of the values 10, 20, 30, 40, and 50. Data set B consists of the values 28, 29, 30, 31, and 32. Which statement is true?","x":"Both sets are balanced around 30, so both means are 30. Standard deviation measures how spread out the values are. Set A’s values sit 10 to 20 away from 30, while set A’s are at most 2 away, so set D has the greater standard deviation. No calculation needed.","t":"mc","c":["The means are equal, and the standard deviation of data set B is greater.","The mean of data set A is greater, and the standard deviations are equal.","The mean of data set B is greater, and the standard deviation of data set A is greater.","The means are equal, and the standard deviation of data set A is greater."],"a":3,"mv":"calc","dzs":{"view":[-10,10,-10,10],"sq":false,"steps":[{"say":"Check the means. Both are 30.","do":[["type",0,"mean([10,20,30,40,50])","\\operatorname{mean}\\left(\\left[10,20,30,40,50\\right]\\right)"],["type",1,"mean([28,29,30,31,32])","\\operatorname{mean}\\left(\\left[28,29,30,31,32\\right]\\right)"]]},{"say":"Now the standard deviations.","do":[["type",2,"stdev([10,20,30,40,50])","\\operatorname{stdev}\\left(\\left[10,20,30,40,50\\right]\\right)"],["type",3,"stdev([28,29,30,31,32])","\\operatorname{stdev}\\left(\\left[28,29,30,31,32\\right]\\right)"]]},{"say":"Set A’s is about 15.8 and set B’s is about 1.6, so set A is more spread out.","do":[["ans","Same mean; A has the bigger SD"]]}]}},{"id":"M-PR-01","k":"prob","lv":"M","p":"","q":"The table shows the results of a survey of 200 students about whether they play a school sport.<div class=\"tw\"><table class=\"dt\"><thead><tr><th><\/th><th>Plays a sport<\/th><th>Does not play a sport<\/th><th>Total<\/th><\/tr><\/thead><tbody><tr><td>Grade 11<\/td><td>48<\/td><td>52<\/td><td>100<\/td><\/tr><tr><td>Grade 12<\/td><td>36<\/td><td>64<\/td><td>100<\/td><\/tr><tr><td>Total<\/td><td>84<\/td><td>116<\/td><td>200<\/td><\/tr><\/tbody><\/table><\/div>If one of the students who play a sport is selected at random, what is the probability that the student is in grade 12?","x":"“One of the students who play a sport” limits the group to the 84 students in the <i>Plays a sport<\/i> column. Of those, 36 are in grade 12, so the probability is \\(\\frac{36}{84}\\). A uses all 200 students, and B uses only grade 12. Both use the wrong group as the total.","t":"mc","c":["\\(\\frac{36}{200}\\)","\\(\\frac{36}{100}\\)","\\(\\frac{84}{200}\\)","\\(\\frac{36}{84}\\)"],"a":3},{"id":"M-PR-02","k":"prob","lv":"H","p":"","q":"A bag contains 5 red, 3 blue, and 2 green marbles. Two marbles are drawn at random, one after the other, without replacement. What is the probability that both marbles are red?","x":"First draw: \\(\\frac{5}{10}\\) chance of red. Without replacement, 4 red marbles remain out of 9, so the second draw is \\(\\frac{4}{9}\\). Multiply: \\(\\frac{5}{10} \\times \\frac{4}{9} = \\frac{20}{90} = \\frac{2}{9}\\). A decimal answer has to be as precise as the box allows: .2222 or 0.222 both count, but .22 doesn’t.","t":"spr","ans":["2/9",".2222","0.222"],"v":0.2222222222222222,"tol":0.0006,"mv":"calc","dzs":{"view":[-10,10,-10,10],"sq":false,"steps":[{"say":"Red first: 5 of 10. Then red again: 4 of the 9 left. Multiply. Press → after each fraction.","do":[["type",0,"5/10→*4/9→","\\frac{5}{10}\\cdot\\frac{4}{9}"]]},{"say":"Desmos shows 0.2222…, which is \\(\\frac{2}{9}\\).","do":[["ans","\\(\\frac{2}{9}\\)"]]}]}},{"id":"M-D2-01","k":"d2","lv":"E","p":"","q":"The scatterplot shows the number of hours that each of 14 students studied for a test and the student’s score on the test. A line of best fit for the data is \\(y = 4.5x + 62\\). Which choice is the best interpretation of 4.5 in this context?","x":"In \\(y = 4.5x + 62\\), 4.5 is the slope: the predicted change in score for each 1-hour increase in study time. B mixes up the slope and the intercept; the predicted score for 0 hours is 62, not 4.5. D uses the intercept as the rate.","t":"mc","c":["For each additional hour studied, the predicted test score increases by 4.5 points.","A student who doesn’t study at all is predicted to score 4.5 points.","On average, the students studied for 4.5 hours.","For each additional hour studied, the predicted test score increases by 62 points."],"a":0,"fig":"<svg viewBox=\"0 0 340 244\" role=\"img\" aria-label=\"Scatterplot of test score against hours studied for 14 students, with points rising from about 63 at half an hour to 95 at 7 hours, and the line y = 4.5x + 62\"><line class=\"gd\" x1=\"48\" x2=\"328\" y1=\"180\" y2=\"180\"/><text x=\"42\" y=\"184\" text-anchor=\"end\">60<\/text><line class=\"gd\" x1=\"48\" x2=\"328\" y1=\"140\" y2=\"140\"/><text x=\"42\" y=\"144\" text-anchor=\"end\">70<\/text><line class=\"gd\" x1=\"48\" x2=\"328\" y1=\"100\" y2=\"100\"/><text x=\"42\" y=\"104\" text-anchor=\"end\">80<\/text><line class=\"gd\" x1=\"48\" x2=\"328\" y1=\"60\" y2=\"60\"/><text x=\"42\" y=\"64\" text-anchor=\"end\">90<\/text><line class=\"gd\" x1=\"48\" x2=\"328\" y1=\"20\" y2=\"20\"/><text x=\"42\" y=\"24\" text-anchor=\"end\">100<\/text><text x=\"48\" y=\"216\" text-anchor=\"middle\">0<\/text><text x=\"118\" y=\"216\" text-anchor=\"middle\">2<\/text><text x=\"188\" y=\"216\" text-anchor=\"middle\">4<\/text><text x=\"258\" y=\"216\" text-anchor=\"middle\">6<\/text><text x=\"328\" y=\"216\" text-anchor=\"middle\">8<\/text><line class=\"ax\" x1=\"48\" x2=\"328\" y1=\"200\" y2=\"200\"/><line class=\"ax\" x1=\"48\" x2=\"48\" y1=\"14\" y2=\"200\"/><line class=\"ln\" x1=\"48\" y1=\"172\" x2=\"328\" y2=\"28\"/><circle class=\"pt\" cx=\"65.5\" cy=\"156\" r=\"4\"/><circle class=\"pt\" cx=\"83\" cy=\"168\" r=\"4\"/><circle class=\"pt\" cx=\"100.5\" cy=\"140\" r=\"4\"/><circle class=\"pt\" cx=\"118\" cy=\"132\" r=\"4\"/><circle class=\"pt\" cx=\"135.5\" cy=\"136\" r=\"4\"/><circle class=\"pt\" cx=\"153\" cy=\"112\" r=\"4\"/><circle class=\"pt\" cx=\"170.5\" cy=\"120\" r=\"4\"/><circle class=\"pt\" cx=\"188\" cy=\"100\" r=\"4\"/><circle class=\"pt\" cx=\"205.5\" cy=\"88\" r=\"4\"/><circle class=\"pt\" cx=\"223\" cy=\"92\" r=\"4\"/><circle class=\"pt\" cx=\"240.5\" cy=\"68\" r=\"4\"/><circle class=\"pt\" cx=\"258\" cy=\"64\" r=\"4\"/><circle class=\"pt\" cx=\"275.5\" cy=\"60\" r=\"4\"/><circle class=\"pt\" cx=\"293\" cy=\"40\" r=\"4\"/><text class=\"tt\" x=\"188\" y=\"236\" text-anchor=\"middle\">Hours studied<\/text><text class=\"tt\" x=\"14\" y=\"110\" text-anchor=\"middle\" transform=\"rotate(-90 14 110)\">Test score<\/text><\/svg>"},{"id":"M-AV-01","k":"area","lv":"E","p":"","q":"A cylindrical water tank has a radius of 3 feet and a height of 8 feet. What is the volume of the tank, in cubic feet?","x":"Cylinder volume: \\(V = \\pi r^2 h = \\pi(3)^2(8) = 72\\pi\\) cubic feet, about 226. The formula is on the reference sheet. B is \\(2\\pi rh\\), the area of the curved side, and D swaps the radius and the height.","t":"mc","c":["\\(24\\pi\\)","\\(48\\pi\\)","\\(72\\pi\\)","\\(192\\pi\\)"],"a":2},{"id":"M-LAT-01","k":"lat","lv":"M","p":"","q":"In triangle \\(ABC\\), the measure of angle \\(A\\) is \\(52^\\circ\\), and the measure of angle \\(B\\) is 3 times the measure of angle \\(C\\). What is the measure, in degrees, of angle \\(B\\)?","x":"Angles in a triangle add to \\(180^\\circ\\). Let angle \\(C = x\\), so angle \\(B = 3x\\): \\(52 + 3x + x = 180\\), so \\(4x = 128\\) and \\(x = 32\\). Angle \\(B = 3(32) = 96^\\circ\\). The question asks for \\(B\\), so 32 is the trap.","t":"spr","ans":["96"],"v":96,"mv":"solve","dzs":{"view":[-5,40,-6,6],"sq":false,"steps":[{"say":"Call angle \\(C\\) \\(x\\), so angle \\(B\\) is \\(3x\\). The three angles add up to 180°.","do":[["type",0,"52+3x+x=180","52+3x+x=180"]]},{"say":"The line is at \\(x = 32\\). That’s angle \\(C\\).","do":[["tap",32,0,0]]},{"say":"They asked for angle \\(B\\), which is \\(3x\\). Type 3 times 32.","do":[["type",1,"3*32","3\\cdot32"],["ans","96
