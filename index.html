°"]]}]}},{"id":"M-LAT-02","k":"lat","lv":"H","p":"","q":"Triangle \\(PQR\\) is similar to triangle \\(XYZ\\). Each side of triangle \\(XYZ\\) is \\(\\frac{5}{2}\\) times as long as the corresponding side of triangle \\(PQR\\). If the area of triangle \\(PQR\\) is 12 square units, what is the area, in square units, of triangle \\(XYZ\\)?","x":"When lengths scale by a factor \\(k\\), areas scale by \\(k^2\\). Here \\(k = \\frac{5}{2}\\), so the area scales by \\(\\frac{25}{4}\\): \\(12 \\times \\frac{25}{4} = 75\\). Multiplying 12 by just \\(\\frac{5}{2}\\) (to get 30) is the common mistake.","t":"spr","ans":["75"],"v":75},{"id":"M-TRIG-01","k":"trig","lv":"M","p":"","q":"In right triangle \\(PQR\\), angle \\(R\\) is a right angle. If \\(\\sin P = \\frac{5}{13}\\), what is the value of \\(\\cos Q\\)?","x":"\\(P\\) and \\(Q\\) are the two acute angles of a right triangle, so they add to \\(90^\\circ\\). The side opposite \\(P\\) is the side next to \\(Q\\), so \\(\\sin P = \\cos Q = \\frac{5}{13}\\). C is \\(\\cos P\\), which also equals \\(\\sin Q\\).","t":"mc","c":["\\(\\frac{5}{13}\\)","\\(\\frac{5}{12}\\)","\\(\\frac{12}{13}\\)","\\(\\frac{13}{5}\\)"],"a":0},{"id":"M-TRIG-02","k":"trig","lv":"E","p":"","q":"A 10-foot ladder leans against a vertical wall. The bottom of the ladder is on level ground, 6 feet from the base of the wall. How high up the wall, in feet, does the top of the ladder reach?","x":"The ladder, wall, and ground form a right triangle with the ladder as the hypotenuse: \\(6^2 + h^2 = 10^2\\), so \\(h^2 = 100 - 36 = 64\\) and \\(h = 8\\). It’s a 6-8-10 triangle, double a 3-4-5.","t":"spr","ans":["8"],"v":8,"mv":"calc","dzs":{"view":[-10,10,-10,10],"sq":false,"steps":[{"say":"The ladder is the hypotenuse. Height = \\(\\sqrt{10^2 - 6^2}\\). Type sqrt, then the inside.","do":[["type",0,"sqrt10^2-6^2","\\sqrt{10^2-6^2}"]]},{"say":"Desmos shows 8.","do":[["ans","8 feet"]]}]}},{"id":"M-TRIG-03","k":"trig","lv":"M","p":"","q":"In a right triangle, one angle measures \\(30^\\circ\\), and the side opposite that angle has length 7. What is the length of the side opposite the \\(60^\\circ\\) angle?","x":"A 30-60-90 triangle’s sides are in the ratio \\(x : x\\sqrt{3} : 2x\\) (short leg : long leg : hypotenuse). The short leg, opposite \\(30^\\circ\\), is 7, so the long leg is \\(7\\sqrt{3}\\). B is the hypotenuse. These ratios are on the reference sheet.","t":"mc","c":["\\(7\\sqrt{2}\\)","\\(14\\)","\\(14\\sqrt{3}\\)","\\(7\\sqrt{3}\\)"],"a":3},{"id":"M-CIRC-01","k":"circ","lv":"H","p":"","q":"In the \\(xy\\)-plane, the graph of \\(x^2 + y^2 - 6x + 8y = 11\\) is a circle. What is the radius of the circle?","x":"Complete the square for \\(x\\) and for \\(y\\). \\(x^2 - 6x = (x - 3)^2 - 9\\) and \\(y^2 + 8y = (y + 4)^2 - 16\\). So \\((x - 3)^2 + (y + 4)^2 - 25 = 11\\), which gives \\((x - 3)^2 + (y + 4)^2 = 36\\). The radius is \\(\\sqrt{36} = 6\\). Answering 36 forgets the square root.","t":"spr","ans":["6"],"v":6,"dz":"Graph the equation as given. The circle runs from \\(x = -3\\) to \\(x = 9\\), so its diameter is 12 and its radius is 6.","mv":"shape","dzs":{"view":[-6,12,-12,4],"sq":true,"steps":[{"say":"Type the circle exactly as given.","do":[["type",0,"x^2+y^2-6x+8y=11","x^2+y^2-6x+8y=11"]]},{"say":"Read it off the grid: the widest part runs from \\(x = -3\\) to \\(x = 9\\). That’s 12 across.","do":[["pin",-3,-4,0],["pin",9,-4,0]]},{"say":"Half of 12 is the radius: 6. To check, type a circle with center \\((3, -4)\\) and radius 6. It lands right on top.","do":[["type",1,"(x-3)^2+(y+4)^2=36","\\left(x-3\\right)^2+\\left(y+4\\right)^2=36"]]},{"say":"The radius is 6.","do":[["ans","\\(r = 6\\)"]]}]}},{"id":"M-CIRC-02","k":"circ","lv":"M","p":"","q":"A circle has a radius of 9. What is the length of an arc of the circle that is intercepted by a central angle of \\(80^\\circ\\)?","x":"An arc is a fraction of the circumference. The circumference is \\(2\\pi(9) = 18\\pi\\), and \\(80^\\circ\\) is \\(\\frac{80}{360} = \\frac{2}{9}\\) of a full turn, so the arc length is \\(\\frac{2}{9} \\times 18\\pi = 4\\pi\\). D is the whole circumference.","t":"mc","c":["\\(2\\pi\\)","\\(4\\pi\\)","\\(8\\pi\\)","\\(18\\pi\\)"],"a":1},{"id":"M-CIRC-03","k":"circ","lv":"E","p":"","q":"In the \\(xy\\)-plane, a circle has the equation \\((x + 2)^2 + (y - 5)^2 = 49\\). What are the coordinates of the center of the circle?","x":"Standard form is \\((x - h)^2 + (y - k)^2 = r^2\\) with center \\((h, k)\\). Rewrite \\(x + 2\\) as \\(x - (-2)\\), so \\(h = -2\\) and \\(k = 5\\). The center is \\((-2, 5)\\), and the radius is 7. A flips both signs, the classic slip.","t":"mc","c":["\\((2, -5)\\)","\\((2, 5)\\)","\\((-2, 5)\\)","\\((-2, -5)\\)"],"a":2,"mv":"shape","dzs":{"view":[-12,8,-4,14],"sq":true,"steps":[{"say":"Type the circle as given.","do":[["type",0,"(x+2)^2+(y-5)^2=49","\\left(x+2\\right)^2+\\left(y-5\\right)^2=49"]]},{"say":"Type the choice \\((-2, 5)\\) as a point. It sits right in the middle of the circle.","do":[["type",1,"(-2,5)","\\left(-2,5\\right)"],["pin",-2,5,1]]},{"say":"The center is \\((-2, 5)\\).","do":[["ans","\\((-2, 5)\\)"]]}]}},{"id":"M-DZ-01","k":"nle","lv":"H","p":"","q":"In the equation \\(x^2 + bx + 16 = 0\\), \\(b\\) is a positive constant. If the equation has exactly one real solution, what is the value of \\(b\\)?","x":"Exactly one real solution means the discriminant is zero: \\(b^2 - 4(1)(16) = 0\\), so \\(b^2 = 64\\). Since \\(b\\) is positive, \\(b = 8\\). Then \\(x^2 + 8x + 16 = (x + 4)^2\\), which has the single solution \\(-4\\). Answering 64 forgets the square root.","t":"spr","ans":["8"],"v":8,"dz":"Graph \\(y = x^2 + bx + 16\\) with a slider for \\(b\\). Slide until the parabola just touches the \\(x\\)-axis: \\(b = 8\\).","mv":"slide","dzs":{"view":[-10,4,-4,20],"sq":false,"steps":[{"say":"One real solution means the graph touches the \\(x\\)-axis exactly once. Type the left side as \\(y = \\)….","do":[["type",0,"y=x^2+bx+16","y=x^2+bx+16"]]},{"say":"Desmos doesn’t know \\(b\\) yet. Tap add slider.","do":[["slider",0]]},{"say":"Slide \\(b\\) until the bottom of the parabola just touches the \\(x\\)-axis.","do":[["slide",1,8]]},{"say":"At \\(b = 8\\) it touches once, at \\((-4, 0)\\).","do":[["tap",-4,0,0],["ans","\\(b = 8\\)"]]}]}},{"id":"M-DZ-02","k":"nle","lv":"H","p":"","q":"The line \\(y = 2x + k\\), where \\(k\\) is a constant, intersects the parabola \\(y = x^2 - 4x + 7\\) at exactly one point. What is the value of \\(k\\)?","x":"Set the expressions equal: \\(x^2 - 4x + 7 = 2x + k\\), so \\(x^2 - 6x + (7 - k) = 0\\). One intersection point means this has exactly one solution, so the discriminant is zero: \\(36 - 4(7 - k) = 8 + 4k = 0\\). So \\(k = -2\\). The line \\(y = 2x - 2\\) touches the parabola at \\((3, 4)\\).","t":"mc","c":["\\(-7\\)","\\(-2\\)","\\(2\\)","\\(7\\)"],"a":1,"dz":"Graph the parabola and \\(y = 2x + k\\) with a slider. Slide \\(k\\) until the line just touches the parabola.","mv":"slide","dzs":{"view":[-2,7,-4,14],"sq":false,"steps":[{"say":"Graph the parabola.","do":[["type",0,"y=x^2-4x+7","y=x^2-4x+7"]]},{"say":"Then the line, with \\(k\\) in it.","do":[["type",1,"y=2x+k","y=2x+k"]]},{"say":"Tap add slider for \\(k\\).","do":[["slider",1]]},{"say":"Slide \\(k\\) down until the line just touches the parabola at one point.","do":[["slide",2,-2]]},{"say":"At \\(k = -2\\) they touch once, at \\((3, 4)\\).","do":[["tap",3,4,0],["ans","\\(k = -2\\)"]]}]}},{"id":"M-DZ-03","k":"sys","lv":"H","p":"","q":"<div class=\"eqs\">\\(kx - 4y = 12\\)<br>\\(3x + 2y = 7\\)<\/div>In the given system of equations, \\(k\\) is a constant. If the system has no solution, what is the value of \\(k\\)?","x":"No solution means the lines are parallel. Solve each for \\(y\\): \\(y = \\frac{k}{4}x - 3\\) and \\(y = -\\frac{3}{2}x + \\frac{7}{2}\\). Parallel lines have equal slopes: \\(\\frac{k}{4} = -\\frac{3}{2}\\), so \\(k = -6\\). The intercepts \\(-3\\) and \\(\\frac{7}{2}\\) are different, so the lines never meet.","t":"spr","ans":["-6"],"v":-6,"dz":"Graph both with a slider for \\(k\\). Slide until the lines run side by side: \\(k = -6\\).","mv":"slide","dzs":{"view":[-6,8,-8,6],"sq":false,"steps":[{"say":"Type the first equation with \\(k\\) in it.","do":[["type",0,"kx-4y=12","kx-4y=12"]]},{"say":"Tap add slider for \\(k\\).","do":[["slider",0]]},{"say":"Type the second equation.","do":[["type",2,"3x+2y=7","3x+2y=7"]]},{"say":"No solution means parallel lines. Slide \\(k\\) until the lines run side by side.","do":[["slide",1,-6]]},{"say":"At \\(k = -6\\) they never meet.","do":[["ans","\\(k = -6\\)"]]}]}},{"id":"M-DZ-04","k":"nle","lv":"H","p":"","q":"How many real solutions does the equation \\(x^2 - 6x + 10 = 2x - 7\\) have?","x":"Move everything to one side: \\(x^2 - 8x + 17 = 0\\). The discriminant is \\((-8)^2 - 4(1)(17) = 64 - 68 = -4\\). A negative discriminant means there are no real solutions.","t":"mc","c":["Exactly one","Zero","Exactly two","Infinitely many"],"a":1,"dz":"Graph \\(y = x^2 - 6x + 10\\) and \\(y = 2x - 7\\). They never cross, so there are zero real solutions.","mv":"count","dzs":{"view":[-2,10,-10,20],"sq":false,"steps":[{"say":"Graph the left side as \\(y = \\)….","do":[["type",0,"y=x^2-6x+10","y=x^2-6x+10"]]},{"say":"Graph the right side as another \\(y = \\)….","do":[["type",1,"y=2x-7","y=2x-7"]]},{"say":"Count the places where they meet. There aren’t any: the line passes under the parabola.","do":[["sel",0]]},{"say":"No crossings means no real solutions.","do":[["ans","Zero"]]}]}},{"id":"M-DZ-05","k":"nle","lv":"H","p":"","q":"How many solutions does the equation \\(|x - 3| = 0.5x + 1\\) have?","x":"Split the absolute value into two cases. If \\(x - 3 = 0.5x + 1\\), then \\(0.5x = 4\\) and \\(x = 8\\). If \\(-(x - 3) = 0.5x + 1\\), then \\(-x + 3 = 0.5x + 1\\), so \\(1.5x = 2\\) and \\(x = \\frac{4}{3}\\). Both check: \\(|8 - 3| = 5 = 0.5(8) + 1\\), and \\(|\\frac{4}{3} - 3| = \\frac{5}{3} = 0.5(\\frac{4}{3}) + 1\\). So there are two solutions.","t":"mc","c":["Two","Zero","One","Three"],"a":0,"dz":"Graph \\(y = |x - 3|\\) and \\(y = 0.5x + 1\\) and count the crossings: two.","mv":"count","dzs":{"view":[-3,11,-3,9],"sq":false,"steps":[{"say":"Graph the left side. Type | to start the absolute value and | to close it.","do":[["type",0,"y=|x-3|","y=\\left|x-3\\right|"]]},{"say":"Graph the right side.","do":[["type",1,"y=0.5x+1","y=0.5x+1"]]},{"say":"Count the crossings: the line cuts the V twice.","do":[["tap",1.3333333333333333,1.6666666666666667,0],["tap",8,5,0]]},{"say":"Two crossings means two solutions.","do":[["ans","Two"]]}]}},{"id":"M-DZ-06","k":"nlf","lv":"H","p":"","q":"A ball is launched upward from a platform. Its height, in meters, \\(t\\) seconds after launch is given by \\(h(t) = -4.9t^2 + 29.4t + 2\\). What is the maximum height, in meters, that the ball reaches?","x":"The maximum is at the vertex: \\(t = -\\frac{b}{2a} = -\\frac{29.4}{2(-4.9)} = 3\\). Then \\(h(3) = -4.9(9) + 29.4(3) + 2 = -44.1 + 88.2 + 2 = 46.1\\) meters. The trap is answering 3, which is the time, not the height.","t":"spr","ans":["46.1"],"v":46.1,"dz":"Graph \\(y = -4.9x^2 + 29.4x + 2\\) and tap the top of the curve: \\((3, 46.1)\\).","mv":"para","dzs":{"view":[-1,7,-8,54],"sq":false,"steps":[{"say":"Type it with \\(x\\) for \\(t\\) and \\(y\\) for \\(h\\).","do":[["type",0,"y=-4.9x^2+29.4x+2","y=-4.9x^2+29.4x+2"]]},{"say":"Tap the top of the curve. The vertex is \\((3, 46.1)\\).","do":[["tap",3,46.1,0]]},{"say":"The height is the \\(y\\)-value: 46.1 meters.","do":[["ans","46.1 meters"]]}]}},{"id":"M-DZ-07","k":"nlf","lv":"M","p":"","q":"The function \\(f\\) is defined by \\(f(x) = 2x^2 - 12x + 13\\). For what value of \\(x\\) does \\(f(x)\\) reach its minimum?","x":"A parabola that opens up has its minimum at the vertex: \\(x = -\\frac{b}{2a} = -\\frac{-12}{2(2)} = 3\\). The minimum value itself is \\(f(3) = 18 - 36 + 13 = -5\\), but the question asks for \\(x\\), so the answer is 3.","t":"spr","ans":["3"],"v":3,"dz":"Graph \\(f(x) = 2x^2 - 12x + 13\\) and tap the bottom of the parabola: \\((3, -5)\\).","mv":"para","dzs":{"view":[-2,8,-8,14],"sq":false,"steps":[{"say":"Define \\(f\\) exactly as written. Desmos graphs it.","do":[["type",0,"f(x)=2x^2-12x+13","f\\left(x\\right)=2x^2-12x+13"]]},{"say":"Tap the bottom of the parabola: \\((3, -5)\\).","do":[["tap",3,-5,0]]},{"say":"They asked for the \\(x\\)-value, so the answer is 3, not \\(-5\\).","do":[["ans","\\(x = 3\\)"]]}]}},{"id":"M-DZ-08","k":"nle","lv":"H","p":"","q":"<div class=\"eqs\">\\(y = x^2 - 2x - 3\\)<br>\\(y = x + 1\\)<\/div>The graphs of the given equations in the \\(xy\\)-plane intersect at the points \\((a, b)\\) and \\((c, d)\\). What is the value of \\(b + d\\)?","x":"Set them equal: \\(x^2 - 2x - 3 = x + 1\\), so \\(x^2 - 3x - 4 = 0\\) and \\((x - 4)(x + 1) = 0\\). The \\(x\\)-values are 4 and \\(-1\\). Plug them into \\(y = x + 1\\): the \\(y\\)-values are 5 and 0. So \\(b + d = 5 + 0 = 5\\). Adding the \\(x\\)-values instead gives 3, a trap.","t":"spr","ans":["5"],"v":5,"dz":"Graph both, tap the two intersections \\((-1, 0)\\) and \\((4, 5)\\), and add the \\(y\\)-values.","mv":"cross","dzs":{"view":[-4,7,-6,10],"sq":false,"steps":[{"say":"Type the first equation.","do":[["type",0,"y=x^2-2x-3","y=x^2-2x-3"]]},{"say":"Type the second.","do":[["type",1,"y=x+1","y=x+1"]]},{"say":"Tap both crossings: \\((-1, 0)\\) and \\((4, 5)\\).","do":[["tap",-1,0,0],["tap",4,5,0]]},{"say":"They want the \\(y\\)-values added: \\(0 + 5 = 5\\).","do":[["ans","\\(b + d = 5\\)"]]}]}},{"id":"M-DZ-09","k":"nle","lv":"H","p":"","q":"What are all the solutions to the equation \\(\\frac{10}{x - 2} = x + 1\\)?","x":"Multiply both sides by \\(x - 2\\): \\(10 = (x - 2)(x + 1) = x^2 - x - 2\\). So \\(x^2 - x - 12 = 0\\) and \\((x - 4)(x + 3) = 0\\), giving \\(x = 4\\) or \\(x = -3\\). Neither one makes \\(x - 2 = 0\\), so both work: \\(\\frac{10}{2} = 5 = 4 + 1\\), and \\(\\frac{10}{-5} = -2 = -3 + 1\\).","t":"mc","c":["\\(x = 4\\) only","\\(x = -3\\) only","\\(x = 4\\) and \\(x = -3\\)","\\(x = -4\\) and \\(x = 3\\)"],"a":2,"dz":"Type the equation as given. Desmos draws vertical lines at \\(x = -3\\) and \\(x = 4\\).","mv":"solve","dzs":{"view":[-6,7,-6,6],"sq":false,"steps":[{"say":"Type it as written: 10, then / for the fraction bar, then \\(x - 2\\), then → to leave the bottom.","do":[["type",0,"10/x-2→=x+1","\\frac{10}{x-2}=x+1"]]},{"say":"Desmos draws a vertical line at each solution. Tap where they cross the \\(x\\)-axis.","do":[["tap",-3,0,0],["tap",4,0,0]]},{"say":"Both \\(x = -3\\) and \\(x = 4\\) work.","do":[["ans","\\(x = 4\\) and \\(x = -3\\)"]]}]}},{"id":"M-DZ-10","k":"nle","lv":"H","p":"","q":"What is the solution to the equation \\(\\sqrt{2x + 7} = x + 2\\)?","x":"Square both sides: \\(2x + 7 = x^2 + 4x + 4\\), so \\(x^2 + 2x - 3 = 0\\) and \\((x + 3)(x - 1) = 0\\). Check both in the original. For \\(x = 1\\): \\(\\sqrt{9} = 3\\) and \\(1 + 2 = 3\\) ✓. For \\(x = -3\\): \\(\\sqrt{1} = 1\\), but \\(-3 + 2 = -1\\) ✗. Only \\(x = 1\\) works.","t":"spr","ans":["1"],"v":1,"dz":"Type the equation as given. Desmos shows one vertical line, at \\(x = 1\\). It skips the fake solution \\(-3\\) for you.","mv":"solve","dzs":{"view":[-6,5,-4,4],"sq":false,"steps":[{"say":"Type sqrt, then \\(2x + 7\\), then → to leave the root, then the rest.","do":[["type",0,"sqrt2x+7→=x+2","\\sqrt{2x+7}=x+2"]]},{"say":"Only one vertical line shows up. Tap where it crosses the \\(x\\)-axis.","do":[["tap",1,0,0]]},{"say":"The algebra also gives \\(x = -3\\), but that one doesn’t really work, and Desmos never draws it. The answer is 1.","do":[["ans","\\(x = 1\\)"]]}]}},{"id":"M-DZ-11","k":"eqx","lv":"H","p":"","q":"Which expression is equivalent to \\(\\frac{x^2 + 5x + 6}{x + 2} + \\frac{x^2 - 1}{x - 1}\\), for \\(x > 1\\)?","x":"Factor each fraction: \\(\\frac{(x + 2)(x + 3)}{x + 2} = x + 3\\) and \\(\\frac{(x - 1)(x + 1)}{x - 1} = x + 1\\). Add them: \\((x + 3) + (x + 1) = 2x + 4\\).","t":"mc","c":["\\(2x + 5\\)","\\(x + 4\\)","\\(2x + 3\\)","\\(2x + 4\\)"],"a":3,"dz":"Graph the original, then each choice. \\(y = 2x + 4\\) lands exactly on top of it.","mv":"same","dzs":{"view":[-1,8,-2,22],"sq":false,"steps":[{"say":"Type the original. Put each top and bottom in parentheses, and press → after each fraction.","do":[["type",0,"(x^2+5x+6)/(x+2)→+(x^2-1)/(x-1)→","\\frac{\\left(x^2+5x+6\\right)}{\\left(x+2\\right)}+\\frac{\\left(x^2-1\\right)}{\\left(x-1\\right)}"]]},{"say":"Try a choice. This line runs just above it, so it’s not equivalent.","do":[["type",1,"2x+5","2x+5"]]},{"say":"Hide it and try the next. This one lands exactly on top.","do":[["hide",1],["type",2,"2x+4","2x+4"]]},{"say":"Same graph means equivalent.","do":[["ans","\\(2x + 4\\)"]]}]}},{"id":"M-DZ-12","k":"nlf","lv":"M","p":"","q":"The functions \\(f\\) and \\(g\\) are defined by \\(f(x) = 3x - 1\\) and \\(g(x) = x^2 + 2\\). What is the value of \\(f(g(2))\\)?","x":"Work from the inside out. \\(g(2) = 2^2 + 2 = 6\\). Then \\(f(6) = 3(6) - 1 = 17\\).","t":"spr","ans":["17"],"v":17,"dz":"Define \\(f(x)\\) and \\(g(x)\\) on separate lines, then type \\(f(g(2))\\). Desmos shows 17.","mv":"func","dzs":{"view":[-10,10,-10,10],"sq":false,"steps":[{"say":"Define \\(f\\).","do":[["type",0,"f(x)=3x-1","f\\left(x\\right)=3x-1"]]},{"say":"Define \\(g\\).","do":[["type",1,"g(x)=x^2+2","g\\left(x\\right)=x^2+2"]]},{"say":"Type \\(f(g(2))\\). Desmos works from the inside out and shows 17.","do":[["type",2,"f(g(2))","f\\left(g\\left(2\\right)\\right)"],["ans","17"]]}]}},{"id":"M-DZ-13","k":"nlf","lv":"H","p":"","q":"The function \\(f\\) is defined by \\(f(x) = 2^x + 3\\). If \\(f(a) = 35\\), what is the value of \\(a\\)?","x":"Set \\(2^a + 3 = 35\\). Then \\(2^a = 32 = 2^5\\), so \\(a = 5\\).","t":"spr","ans":["5"],"v":5,"dz":"Type \\(2^x + 3 = 35\\). Desmos draws a vertical line at \\(x = 5\\).","mv":"solve","dzs":{"view":[-2,8,-4,4],"sq":false,"steps":[{"say":"Write it as an equation in \\(x\\) and type it. After the exponent, typing + steps out on its own.","do":[["type",0,"2^x+3=35","2^x+3=35"]]},{"say":"Tap where the line crosses the \\(x\\)-axis.","do":[["tap",5,0,0]]},{"say":"\\(a = 5\\).","do":[["ans","\\(a = 5\\)"]]}]}},{"id":"M-DZ-14","k":"nlf","lv":"H","p":"","q":"The table shows four values of the exponential function \\(f\\).<div class=\"tw\"><table class=\"dt\"><thead><tr><th>\\(x\\)<\/th><th>\\(f(x)\\)<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>5<\/td><\/tr><tr><td>1<\/td><td>15<\/td><\/tr><tr><td>2<\/td><td>45<\/td><\/tr><tr><td>3<\/td><td>135<\/td><\/tr><\/tbody><\/table><\/div>Which equation defines \\(f\\)?","x":"\\(f(0) = 5\\), so the starting value is 5. Each time \\(x\\) goes up by 1, \\(f(x)\\) is multiplied by 3: 5, 15, 45, 135. So \\(f(x) = 5(3)^x\\). \\(f(x) = 3(5)^x\\) swaps the two numbers, and \\(f(x) = 10x + 5\\) only matches the first two rows.","t":"mc","c":["\\(f(x) = 3(5)^x\\)","\\(f(x) = 5(3)^x\\)","\\(f(x) = 10x + 5\\)","\\(f(x) = 5(10)^x\\)"],"a":1,"dz":"Put the table into Desmos and type \\(y_1 \\sim ab^{x_1}\\). Desmos finds \\(a = 5\\) and \\(b = 3\\).","mv":"reg","dzs":{"view":[-1,4,-10,150],"sq":false,"steps":[{"say":"Tap + Table and copy the four rows in.","do":[["table",0,[[0,5],[1,15],[2,45],[3,135]]]]},{"say":"Type \\(y_1 \\sim ab^{x_1}\\). The ~ means “find the best fit.”","do":[["type",1,"y1~ab^x1","y_1\\sim ab^{x_1}"]]},{"say":"Desmos finds \\(a = 5\\) and \\(b = 3\\), so \\(f(x) = 5(3)^x\\).","do":[["sel",1],["ans","\\(f(x) = 5(3)^x\\)"]]}]}},{"id":"M-DZ-15","k":"lf","lv":"H","p":"","q":"For the linear function \\(g\\), \\(g(4) = 11\\) and \\(g(10) = 26\\). What is the value of \\(g(18)\\)?","x":"The slope is \\(\\frac{26 - 11}{10 - 4} = \\frac{15}{6} = 2.5\\). Using \\(g(4) = 11\\): \\(11 = 2.5(4) + b\\), so \\(b = 1\\) and \\(g(x) = 2.5x + 1\\). Then \\(g(18) = 2.5(18) + 1 = 46\\).","t":"spr","ans":["46"],"v":46,"dz":"Put \\((4, 11)\\) and \\((10, 26)\\) in a table, type \\(y_1 \\sim mx_1 + b\\), then type \\(m \\cdot 18 + b\\): 46.","mv":"reg","dzs":{"view":[-2,22,-4,50],"sq":false,"steps":[{"say":"Two values of a linear function are two points. Put them in a table.","do":[["table",0,[[4,11],[10,26]]]]},{"say":"Fit a line: \\(y_1 \\sim mx_1 + b\\). Desmos finds \\(m = 2.5\\) and \\(b = 1\\).","do":[["type",1,"y1~mx1+b","y_1\\sim mx_1+b"]]},{"say":"Now Desmos knows \\(m\\) and \\(b\\). Type \\(m \\cdot 18 + b\\) to get \\(g(18)\\).","do":[["type",2,"m*18+b","m\\cdot18+b"]]},{"say":"\\(g(18) = 46\\).","do":[["ans","46"]]}]}},{"id":"M-DZ-16","k":"circ","lv":"H","p":"","q":"In the \\(xy\\)-plane, the graph of \\(x^2 + y^2 + 8x - 6y = 24\\) is a circle. What is the radius of the circle?","x":"Complete the square in \\(x\\) and in \\(y\\): \\(x^2 + 8x = (x + 4)^2 - 16\\) and \\(y^2 - 6y = (y - 3)^2 - 9\\). So \\((x + 4)^2 + (y - 3)^2 = 24 + 16 + 9 = 49\\), and the radius is \\(\\sqrt{49} = 7\\). Answering 49 forgets the square root.","t":"spr","ans":["7"],"v":7,"dz":"Graph it as given. The circle stretches from \\(x = -11\\) to \\(x = 3\\), a diameter of 14, so the radius is 7.","mv":"shape","dzs":{"view":[-14,6,-6,12],"sq":true,"steps":[{"say":"Type the circle exactly as given.","do":[["type",0,"x^2+y^2+8x-6y=24","x^2+y^2+8x-6y=24"]]},{"say":"Read it off the grid: the widest part runs from \\(x = -11\\) to \\(x = 3\\). That’s 14 across.","do":[["pin",-11,3,0],["pin",3,3,0]]},{"say":"Half of 14 is 7. To check, type the circle with center \\((-4, 3)\\) and radius 7. It lands right on top.","do":[["type",1,"(x+4)^2+(y-3)^2=49","\\left(x+4\\right)^2+\\left(y-3\\right)^2=49"]]},{"say":"The radius is 7.","do":[["ans","\\(r = 7\\)"]]}]}},{"id":"M-DZ-17","k":"d1","lv":"M","p":"","q":"A data set consists of the values 12, 15, 15, 18, 21, 24, and 26. When the value 40 is added to the data set, by how much does the median increase?","x":"The 7 original values are in order, so the median is the 4th value, 18. With 40 added there are 8 values: 12, 15, 15, 18, 21, 24, 26, 40. The median is the average of the 4th and 5th values: \\(\\frac{18 + 21}{2} = 19.5\\). It increases by \\(19.5 - 18 = 1.5\\).","t":"spr","ans":["1.5","3/2"],"v":1.5,"dz":"Type median([12, 15, 15, 18, 21, 24, 26]) and median([12, 15, 15, 18, 21, 24, 26, 40]). Desmos shows 18 and 19.5.","mv":"calc","dzs":{"view":[-10,10,-10,10],"sq":false,"steps":[{"say":"Type median, then the list in square brackets.","do":[["type",0,"median([12,15,15,18,21,24,26])","\\operatorname{median}\\left(\\left[12,15,15,18,21,24,26\\right]\\right)"]]},{"say":"Do it again with 40 added.","do":[["type",1,"median([12,15,15,18,21,24,26,40])","\\operatorname{median}\\left(\\left[12,15,15,18,21,24,26,40\\right]\\right)"]]},{"say":"The median goes from 18 to 19.5, so it increases by 1.5.","do":[["ans","\\(19.5 - 18 = 1.5\\)"]]}]}},{"id":"M-DZ-18","k":"nle","lv":"H","p":"","q":"<div class=\"eqs\">\\(y = 2x^2 - 5x + 1\\)<br>\\(y = 3x - 7\\)<\/div>The given system of equations has exactly one solution, \\((x, y)\\). What is the value of \\(x\\)?","x":"Set them equal: \\(2x^2 - 5x + 1 = 3x - 7\\), so \\(2x^2 - 8x + 8 = 0\\). Divide by 2: \\(x^2 - 4x + 4 = 0\\), which is \\((x - 2)^2 = 0\\). So \\(x = 2\\).","t":"spr","ans":["2"],"v":2,"dz":"Graph both. The line just touches the parabola at \\((2, -1)\\).","mv":"cross","dzs":{"view":[-2,6,-6,10],"sq":false,"steps":[{"say":"Type the parabola.","do":[["type",0,"y=2x^2-5x+1","y=2x^2-5x+1"]]},{"say":"Type the line.","do":[["type",1,"y=3x-7","y=3x-7"]]},{"say":"The line just touches the parabola. Tap the touching point: \\((2, -1)\\).","do":[["tap",2,-1,0]]},{"say":"They asked for \\(x\\): 2.","do":[["ans","\\(x = 2\\)"]]}]}},{"id":"M-DZ-19","k":"nlf","lv":"H","p":"","q":"The graph of \\(y = -(x - 4)^2 + 9\\) in the \\(xy\\)-plane crosses the \\(x\\)-axis at two points. Which of the following is one of those points?","x":"Set \\(y = 0\\): \\((x - 4)^2 = 9\\), so \\(x - 4 = 3\\) or \\(x - 4 = -3\\). That gives \\(x = 7\\) or \\(x = 1\\), so the points are \\((7, 0)\\) and \\((1, 0)\\). \\((4, 9)\\) is the vertex, and \\((0, -7)\\) is the \\(y\\)-intercept.","t":"mc","c":["\\((1, 0)\\)","\\((4, 9)\\)","\\((0, -7)\\)","\\((-1, 0)\\)"],"a":0,"dz":"Graph it and tap where it meets the \\(x\\)-axis: \\((1, 0)\\) and \\((7, 0)\\).","mv":"para","dzs":{"view":[-2,10,-10,12],"sq":false,"steps":[{"say":"Type it as given.","do":[["type",0,"y=-(x-4)^2+9","y=-\\left(x-4\\right)^2+9"]]},{"say":"Tap the two gray dots on the \\(x\\)-axis: \\((1, 0)\\) and \\((7, 0)\\).","do":[["tap",1,0,0],["tap",7,0,0]]},{"say":"Only \\((1, 0)\\) is one of the choices.","do":[["ans","\\((1, 0)\\)"]]}]}},{"id":"M-DZ-20","k":"pct","lv":"H","p":"","q":"A town’s population is 2,400, and it decreases by 15% each year. After how many whole years will the population first be less than 1,000?","x":"Each year the population is multiplied by \\(1 - 0.15 = 0.85\\), so after \\(t\\) years it is \\(2,400(0.85)^t\\). After 5 years: \\(2,400(0.85)^5 \\approx 1,065\\). After 6 years: \\(2,400(0.85)^6 \\approx 905\\). It first drops below 1,000 after 6 years.","t":"spr","ans":["6"],"v":6,"dz":"Graph \\(y = 2400(0.85)^x\\) and \\(y = 1000\\). They cross at about \\(x = 5.39\\), so the first whole year below 1,000 is year 6.","mv":"cross","dzs":{"view":[-1,12,-200,2800],"sq":false,"steps":[{"say":"Type the population model. Leave the comma out of 2,400.","do":[["type",0,"y=2400(0.85)^x","y=2400\\left(0.85\\right)^x"]]},{"say":"Add the line \\(y = 1000\\).","do":[["type",1,"y=1000","y=1000"]]},{"say":"Tap where they cross: about \\(x = 5.39\\).","do":[["tap",5.3868724096283565,1000,0]]},{"say":"5.39 isn’t a whole year. After 5 years the population is still above 1,000, so the answer is 6.","do":[["ans","6 years"]]}]}},{"id":"M-DZ-21","k":"nle","lv":"H","p":"","q":"In the \\(xy\\)-plane, at how many points does the line \\(y = x + 7\\) intersect the circle \\(x^2 + y^2 = 25\\)?","x":"Substitute \\(y = x + 7\\) into the circle: \\(x^2 + (x + 7)^2 = 25\\), so \\(2x^2 + 14x + 24 = 0\\), or \\(x^2 + 7x + 12 = 0\\). That facto  \\(3x^2 - 4x + 1\\) when \\(x = -2\\)?","x":"Put \\(-2\\) in parentheses everywhere you see \\(x\\): \\(3(-2)^2 - 4(-2) + 1\\). Square first: \\((-2)^2 = 4\\), so the first term is \\(3 \\cdot 4 = 12\\). Next, \\(-4(-2) = 8\\). Add it up: \\(12 + 8 + 1 = 21\\). Choice A treats \\((-2)^2\\) as \\(-4\\).","t":"mc","c":["\\(-3\\)","\\(5\\)","\\(21\\)","\\(45\\)"],"a":2},{"id":"P-M-10","k":"pm-eval","lv":"M","p":"","q":"Evaluate: \\(18 - 3 \\cdot 2^2 + 6 \\div 2\\)","x":"Exponents come first: \\(2^2 = 4\\). Then multiply and divide from left to right: \\(3 \\cdot 4 = 12\\) and \\(6 \\div 2 = 3\\). Now add and subtract from left to right: \\(18 - 12 + 3 = 9\\). Choice A adds \\(12 + 3\\) before subtracting, but adding and subtracting go left to right. The PERT calculator also works left to right, so do the multiplying yourself first.","t":"mc","c":["\\(3\\)","\\(6\\)","\\(9\\)","\\(63\\)"],"a":2,"calc":1},{"id":"P-M-11","k":"pm-eval","lv":"M","p":"","q":"What is the value of \\(\\frac{a^2 - b}{2a}\\) when \\(a = -3\\) and \\(b = 5\\)?","x":"Substitute, using parentheses: \\(\\frac{(-3)^2 - 5}{2(-3)}\\). The top is \\(9 - 5 = 4\\). The bottom is \\(2(-3) = -6\\). Divide: \\(\\frac{4}{-6} = -\\frac{2}{3}\\). Choice C loses the negative sign on the bottom.","t":"mc","c":["\\(-\\frac{7}{3}\\)","\\(-\\frac{2}{3}\\)","\\(\\frac{2}{3}\\)","\\(\\frac{7}{3}\\)"],"a":1,"calc":1},{"id":"P-M-12","k":"pm-exp","lv":"E","p":"","q":"Simplify: \\((2x^3y^2)(-3xy^4)\\)","x":"Multiply the numbers: \\(2 \\cdot (-3) = -6\\). Multiply like letters by adding their exponents. Remember \\(x\\) means \\(x^1\\): \\(x^3 \\cdot x^1 = x^4\\). Same for \\(y\\): \\(y^2 \\cdot y^4 = y^6\\). Put it together: \\(-6x^4y^6\\). Choice B multiplies the \\(y\\) exponents and forgets the \\(x\\) has an exponent of 1.","t":"mc","c":["\\(-6x^4y^6\\)","\\(-6x^3y^8\\)","\\(-x^4y^6\\)","\\(6x^4y^8\\)"],"a":0},{"id":"P-M-13","k":"pm-exp","lv":"M","p":"","q":"Simplify, using only positive exponents: \\(\\frac{12x^5y^{-2}}{4x^2y^3}\\)","x":"Divide the numbers: \\(12 \\div 4 = 3\\). Subtract exponents for each letter, top minus bottom: \\(x^{5 - 2} = x^3\\) and \\(y^{-2 - 3} = y^{-5}\\). A negative exponent moves the factor to the bottom of the fraction: \\(y^{-5} = \\frac{1}{y^5}\\). So the answer is \\(\\frac{3x^3}{y^5}\\). Choice A adds the \\(y\\) exponents instead of subtracting them.","t":"mc","c":["\\(3x^3y\\)","\\(\\frac{3x^3}{y^5}\\)","\\(3x^7y^5\\)","\\(\\frac{8x^3}{y^5}\\)"],"a":1},{"id":"P-M-14","k":"pm-exp","lv":"M","p":"","q":"Which expression is equal to \\((x^{-2})^3 \\cdot x^8\\)?","x":"A power of a power means multiply the exponents: \\((x^{-2})^3 = x^{-6}\\). Multiplying the same base means add the exponents: \\(x^{-6} \\cdot x^8 = x^2\\). Choice D drops the negative sign on the 6.","t":"mc","c":["\\(x^2\\)","\\(1\\)","\\(x^9\\)","\\(x^{14}\\)"],"a":0},{"id":"P-M-15","k":"pm-poly","lv":"E","p":"","q":"Simplify: \\((4x^2 - 3x + 7) - (x^2 + 5x - 2)\\)","x":"The minus sign in front changes the sign of every term in the second polynomial: \\(4x^2 - 3x + 7 - x^2 - 5x + 2\\). Combine like terms: \\(3x^2 - 8x + 9\\). Choice A changes only the first sign.","t":"mc","c":["\\(3x^2 + 2x + 5\\)","\\(3x^2 - 8x + 5\\)","\\(5x^2 + 2x + 5\\)","\\(3x^2 - 8x + 9\\)"],"a":3},{"id":"P-M-16","k":"pm-poly","lv":"M","p":"","q":"Multiply: \\((2x - 3)(x + 4)\\)","x":"Multiply every term in the first binomial by every term in the second: \\(2x \\cdot x + 2x \\cdot 4 - 3 \\cdot x - 3 \\cdot 4\\). Work out each product: \\(2x^2 + 8x - 3x - 12\\). Combine the middle terms: \\(2x^2 + 5x - 12\\). Choice A multiplies only the first terms and the last terms.","t":"mc","c":["\\(2x^2 - 12\\)","\\(2x^2 + 5x - 12\\)","\\(2x^2 + 11x - 12\\)","\\(2x^2 + 5x + 12\\)"],"a":1},{"id":"P-M-17","k":"pm-poly","lv":"M","p":"","q":"Divide: \\(\\frac{6x^3 - 9x^2 + 3x}{3x}\\)","x":"Split the fraction so each term is divided by \\(3x\\): \\(\\frac{6x^3}{3x} - \\frac{9x^2}{3x} + \\frac{3x}{3x}\\). Divide each one: \\(2x^2 - 3x + 1\\). Choice A forgets that \\(3x\\) divided by \\(3x\\) is 1, not 0.","t":"mc","c":["\\(2x^2 - 3x\\)","\\(2x^3 - 3x^2 + x\\)","\\(2x - 3 + \\frac{1}{x}\\)","\\(2x^2 - 3x + 1\\)"],"a":3},{"id":"P-M-18","k":"pm-poly","lv":"H","p":"","q":"Simplify: \\(\\frac{x^2 + 2x - 15}{x - 3}\\)","x":"Factor the top. You need two numbers that multiply to \\(-15\\) and add to 2: they’re 5 and \\(-3\\). Factored: \\(x^2 + 2x - 15 = (x + 5)(x - 3)\\). Cancel the matching factor: \\(\\frac{(x + 5)(x - 3)}{x - 3} = x + 5\\). Choice B mixes up the signs in the factors.","t":"mc","c":["\\(x + 5\\)","\\(x - 5\\)","\\(x + 3\\)","\\(x^2 + 5\\)"],"a":0},{"id":"P-M-19","k":"pm-fact","lv":"E","p":"","q":"Factor: \\(x^2 - 9x + 20\\)","x":"Find two numbers that multiply to 20 and add to \\(-9\\). Both have to be negative: \\(-4\\) and \\(-5\\). Check them: \\((-4)(-5) = 20\\) and \\(-4 + (-5) = -9\\). Factored: \\(x^2 - 9x + 20 = (x - 4)(x - 5)\\). Choice A multiplies to 20 but adds to \\(+9\\).","t":"mc","c":["\\((x + 4)(x + 5)\\)","\\((x - 4)(x - 5)\\)","\\((x - 2)(x - 10)\\)","\\((x - 1)(x - 20)\\)"],"a":1},{"id":"P-M-20","k":"pm-fact","lv":"M","p":"","q":"Solve: \\(x^2 + 3x = 28\\)","x":"Get 0 on one side first: \\(x^2 + 3x - 28 = 0\\). Two numbers that multiply to \\(-28\\) and add to 3 are 7 and \\(-4\\): \\((x + 7)(x - 4) = 0\\). Set each factor equal to 0 and solve: \\(x = -7\\) or \\(x = 4\\). Choice D sets each factor of \\(x(x + 3) = 28\\) equal to 28, but that trick only works when the other side is 0.","t":"mc","c":["\\(x = -7\\) or \\(x = 4\\)","\\(x = 7\\) or \\(x = -4\\)","\\(x = -7\\) or \\(x = -4\\)","\\(x = 28\\) or \\(x = 25\\)"],"a":0},{"id":"P-M-21","k":"pm-fact","lv":"M","p":"","q":"Factor completely: \\(3x^2 - 48\\)","x":"Take out the greatest common factor first: \\(3x^2 - 48 = 3(x^2 - 16)\\). Next, \\(x^2 - 16\\) is a difference of squares: \\(a^2 - b^2 = (a - b)(a + b)\\). Factor it: \\(3x^2 - 48 = 3(x - 4)(x + 4)\\). Choice C is true but not finished. “Completely” means keep factoring until you can’t.","t":"mc","c":["\\(3(x - 4)^2\\)","\\((3x - 16)(x + 3)\\)","\\(3(x^2 - 16)\\)","\\(3(x - 4)(x + 4)\\)"],"a":3},{"id":"P-M-22","k":"pm-line","lv":"E","p":"","q":"What is the slope of the line that passes through the points \\((-2, 3)\\) and \\((4, -9)\\)?","x":"Slope is rise over run: \\(m = \\frac{y_2 - y_1}{x_2 - x_1}\\). Plug in the points: \\(m = \\frac{-9 - 3}{4 - (-2)}\\). Simplify: \\(m = \\frac{-12}{6} = -2\\). Choice A uses \\(4 - 2\\) instead of \\(4 - (-2)\\). Choice C flips rise and run.","t":"mc","c":["\\(-6\\)","\\(-2\\)","\\(-\\frac{1}{2}\\)","\\(2\\)"],"a":1,"calc":1},{"id":"P-M-23","k":"pm-line","lv":"M","p":"","q":"Which equation describes the line that passes through \\((1, 4)\\) and \\((3, 10)\\)?","x":"Find the slope first: \\(m = \\frac{10 - 4}{3 - 1} = 3\\). Put the slope and the point \\((1, 4)\\) into \\(y = mx + b\\): \\(4 = 3(1) + b\\). Solve for \\(b\\): \\(b = 1\\). So the line is \\(y = 3x + 1\\). Check it with \\((3, 10)\\): \\(3(3) + 1 = 10\\). Choice D flips rise and run.","t":"mc","c":["\\(y = 3x + 4\\)","\\(y = 3x + 1\\)","\\(y = 6x - 2\\)","\\(y = \\frac{1}{3}x + \\frac{11}{3}\\)"],"a":1},{"id":"P-M-24","k":"pm-line","lv":"M","p":"","q":"Which equation represents the line shown in the graph?","x":"The line crosses the \\(y\\)-axis at \\(-2\\), so the \\(y\\)-intercept is \\(b = -2\\). Pick two points the line passes through, like \\((0, -2)\\) and \\((3, 4)\\). Rise over run: \\(m = \\frac{4 - (-2)}{3 - 0} = 2\\). So the line is \\(y = 2x - 2\\). Choice B flips rise and run.","t":"mc","c":["\\(y = -2x + 2\\)","\\(y = \\frac{1}{2}x - 2\\)","\\(y = 2x - 2\\)","\\(y = 2x + 2\\)"],"a":2,"fig":"<svg class=\"plsvg\" viewBox=\"0 0 230 230\" role=\"img\" aria-label=\"Coordinate grid with a line through the points 0, negative 2 and 3, 4\"><defs><clipPath id=\"clip-pm24\"><rect x=\"14\" y=\"14\" width=\"202\" height=\"202\"/><\/clipPath><\/defs><line class=\"pg\" x1=\"14\" y1=\"14\" x2=\"14\ 25","k":"pm-line","lv":"M","p":"","q":"What is the solution \\((x, y)\\) to this system of equations?<div class=\"eqs\">\\(y = 2x - 1\\)<br>\\(3x + y = 14\\)<\/div>","x":"The first equation already says what \\(y\\) is, so substitute it into the second: \\(3x + (2x - 1) = 14\\). Combine like terms: \\(5x - 1 = 14\\). Add 1, then divide by 5: \\(x = 3\\). Find \\(y\\): \\(y = 2(3) - 1 = 5\\). Choice B works in the first equation but not the second. A solution has to work in both.","t":"mc","c":["\\((5, 3)\\)","\\((2, 3)\\)","\\((4, 2)\\)","\\((3, 5)\\)"],"a":3,"calc":1},{"id":"P-M-26","k":"pm-eval","lv":"E","p":"","q":"What percent of the grid is shaded?","x":"The grid has \\(10 \\times 10 = 100\\) squares, and 35 of them are shaded. Percent means out of 100: \\(\\frac{35}{100} = 35\\%\\). Choice D is the unshaded part.","t":"mc","c":["\\(0.35\\%\\)","\\(3.5\\%\\)","\\(35\\%\\)","\\(65\\%\\)"],"a":2,"fig":"<svg class=\"grsvg\" viewBox=\"0 0 172 172\" role=\"img\" aria-label=\"A 10 by 10 grid with 35 squares shaded\"><rect class=\"gs\" x=\"1\" y=\"1\" width=\"17\" height=\"17\"/><rect class=\"gs\" x=\"18\" y=\"1\" width=\"17\" height=\"17\"/><rect class=\"gs\" x=\"35\" y=\"1\" width=\"17\" height=\"17\"/><rect class=\"gs\" x=\"52\" y=\"1\" width=\"17\" height=\"17\"/><rect class=\"gs\" x=\"69\" y=\"1\" width=\"17\" height=\"17\"/><rect class=\"gs\" x=\"86\" y=\"1\" width=\"17\" height=\"17\"/><rect class=\"gs\" x=\"103\" y=\"1\" width=\"17\" height=\"17\"/><rect class=\"gs\" x=\"120\" y=\"1\" width=\"17\" height=\"17\"/><rect class=\"gs\" x=\"137\" y=\"1\" width=\"17\" height=\"17\"/><rect class=\"gs\" x=\"154\" y=\"1\" width=\"17\" height=\"17\"/><rect class=\"gs\" x=\"1\" y=\"18\" width=\"17\" height=\"17\"/><rect class=\"gs\" x=\"18\" y=\"18\" width=\"17\" height=\"17\"/><rect class=\"gs\" x=\"35\" y=\"18\" width=\"17\" height=\"17\"/><rect class=\"gs\" x=\"52\" y=\"18\" width=\"17\" height=\"17\"/><rect class=\"gs\" x=\"69\" y=\"18\" width=\"17\" height=\"17\"/><r ct class=\"gu\" x=\"103\" y=\"120\" width=\"17\" height=\"17\"/><rect class=\"gu\" x=\"120\" y=\"120\" width=\"17\" height=\"17\"/><rect class=\"gu\" x=\"137\" y=\"120\" width=\"17\" height=\"17\"/><rect class=\"gu\" x=\"154\" y=\"120\" width=\"17\" height=\"17\"/><rect class=\"gu\" x=\"1\" y=\"137\" width=\"17\" height=\"17\"/><rect class=\"gu\" x=\"18\" y=\"137\" width=\"17\" height=\"17\"/><rect class=\"gu\" x=\"35\" y=\"137\" width=\"17\" height=\"17\"/><rect class=\"gu\" x=\"52\" y=\"137\" width=\"17\" height=\"17\"/><rect class=\"gu\" x=\"69\" y=\"137\" width=\"17\" height=\"17\"/><rect class=\"gu\" x=\"86\" y=\"137\" width=\"17\" height=\"17\"/><rect class=\"gu\" x=\"103\" y=\"137\" width=\"17\" height=\"17\"/><rect class=\"gu\" x=\"120\" y=\"137\" width=\"17\" height=\"17\"/><rect class=\"gu\" x=\"137\" y=\"137\" width=\"17\" height=\"17\"/><rect class=\"gu\" x=\"154\" y=\"137\" width=\"17\" height=\"17\"/><rect class=\"gu\" x=\"1\" y=\"154\" width=\"17\" height=\"17\"/><rect class=\"gu\" x=\"18\" y=\"154\" width=\"17\" height=\"17\"/><rect class=\"gu\" x=\"35\" y=\"154\" width=\"17\" height=\"17\"/><rect class=\"gu\" x=\"52\" y=\"154\" width=\"17\" height=\"17\"/><rect class=\"gu\" x=\"69\" y=\"154\" width=\"17\" height=\"17\"/><rect class=\"gu\" x=\"86\" y=\"154\" width=\"17\" height=\"17\"/><rect class=\"gu\" x=\"103\" y=\"154\" width=\"17\" height=\"17\"/><rect class=\"gu\" x=\"120\" y=\"154\" width=\"17\" height=\"17\"/><rect class=\"gu\" x=\"137\" y=\"154\" width=\"17\" height=\"17\"/><rect class=\"gu\" x=\"154\" y=\"154\" width=\"17\" height=\"17\"/><\/svg>"},{"id":"P-M-27","k":"pm-eq","lv":"M","p":"","q":"A phone plan costs $25 per month plus $0.10 for each text message. Jordan’s bill for one month was $38.50. How many text messages did Jordan send?","x":"Write the equation, with \\(t\\) as the number of texts: \\(25 + 0.10t = 38.50\\). Subtract 25 from both sides: \\(0.10t = 13.50\\). Divide by 0.10: \\(t = 135\\). Choice C divides the whole bill by 0.10 and forgets the $25 monthly charge.","t":"mc","c":["\\(13.5\\)","\\(135\\)","\\(385\\)","\\(635\\)"],"a":1,"calc":1},{"id":"P-R-01","k":"pr-main","lv":"E","p":"<p><span class=\"sn\">When Bessie Coleman decided to become a pilot after World War I, no flight school in the United States would accept her.<\/span> <span class=\"sn\">She was Black and she was a woman, and the schools turned her away for both reasons.<\/span> <span class=\"sn\">Coleman, who was working as a manicurist in Chicago, refused to let the matter end there.<\/span> <span class=\"sn\">She took French classes at night, saved what she could, found sponsors, and in late 1920 sailed for France, where a flight school agreed to train her.<\/span><\/p><p><span class=\"sn\">The training was grueling.<\/span> <span class=\"sn\">Students learned in fragile open-cockpit biplanes, and Coleman watched a fellow student die in a crash.<\/span> <span class=\"sn\">She kept going.<\/span> <span class=\"sn\">In June 1921, she earned an international pilot’s license, becoming the first African American woman to hold one.<\/span><\/p><p><span class=\"sn\">Back in the United States, Coleman found that the only way to make a living as a pilot was to perform.<\/span> <span class=\"sn\">She toured the country doing loops and other stunts at air shows, and she used her fame to speak to Black audiences about flying.<\/span> <span class=\"sn\">Her goal was to open a flight school so that the next generation would not face the closed doors she had faced.<\/span> <span class=\"sn\">In 1926, she died in a crash while preparing for an air show in Jacksonville, Florida.<\/span> <span class=\"sn\">She never opened her school, but flying clubs named for her went on to encourage Black pilots for years afterward.<\/span><\/p>","q":"Which statement best summarizes the passage?","x":"A summary has to cover the whole passage: the closed doors, her training in France, her license, and her goal of helping others fly. Choice D covers all of it. Choice C is true, but it’s one small detail from the first paragraph. Choices A and B make claims the passage never makes.","t":"mc","c":["Bessie Coleman was the most skilled stunt pilot in the United States during the 1920s.","Flight schools in France in the 1920s were more dangerous than flight schools in the United States.","Bessie Coleman worked as a manicurist in Chicago before she learned to speak French.","Bessie Coleman overcame discrimination to become a licensed pilot and worked to open flying to other Black Americans."],"a":3},{"id":"P-R-02","k":"pr-word","lv":"E","p":"<p><span class=\"sn\">When Bessie Coleman decided to become a pilot after World War I, no flight school in the United States would accept her.<\/span> <span class=\"sn\">She was Black and she was a woman, and the schools turned her away for both reasons.<\/span> <span class=\"sn\">Coleman, who was working as a manicurist in Chicago, refused to let the matter end there.<\/span> <span class=\"sn\">She took French classes at night, saved what she could, found sponsors, and in late 1920 sailed for France, where a flight school agreed to train her.<\/span><\/p><p><span class=\"sn\">The training was grueling.<\/span> <span class=\"sn\">Students learned in fragile open-cockpit biplanes, and Coleman watched a fellow student die in a crash.<\/span> <span class=\"sn\">She kept going.<\/span> <span class=\"sn\">In June 1921, she earned an international pilot’s license, becoming the first African American woman to hold one.<\/span><\/p><p><span class=\"sn\">Back in the United States, Coleman found that the only way to make a living as a pilot was to perform.<\/span> <span class=\"sn\">She toured the country doing loops and other stunts at air shows, and she used her fame to speak to Black audiences about flying.<\/span> <span class=\"sn\">Her goal was to open a flight school so that the next generation would not face the closed doors she had faced.<\/span> <span class=\"sn\">In 1926, she died in a crash while preparing for an air show in Jacksonville, Florida.<\/span> <span class=\"sn\">She never opened her school, but flying clubs named for her went on to encourage Black pilots for years afterward.<\/span><\/p>","q":"As used in the passage, the word <i>grueling<\/i> most nearly means","x":"Look at the clues right after the word: fragile planes, and a student who died in a crash. Then “She kept going,” which shows how hard it was to continue. Training like that is exhausting and hard. Nothing in the passage is about cost or organization.","t":"mc","c":["short and simple","costly","exhausting and hard","well organized"],"a":2},{"id":"P-R-03","k":"pr-inf","lv":"M","p":"<p><span class=\"sn\">When Bessie Coleman decided to become a pilot after World War I, no flight school in the United States would accept her.<\/span> <span class=\"sn\">She was Black and she was a woman, and the schools turned her away for both reasons.<\/span> <span class=\"sn\">Coleman, who was working as a manicurist in Chicago, refused to let the matter end there.<\/span> <span class=\"sn\">She took French classes at night, saved what she could, found sponsors, and in late 1920 sailed for France, where a flight school agreed to train her.<\/span><\/p><p><span class=\"sn\">The training was grueling.<\/span> <span class=\"sn\">Students learned in fragile open-cockpit biplanes, and Coleman watched a fellow student die in a crash.<\/span> <span class=\"sn\">She kept going.<\/span> <span class=\"sn\">In June 1921, she earned an international pilot’s license, becoming the first African American woman to hold one.<\/span><\/p><p><span class=\"sn\">Back in the United States, Coleman found that the only way to make a living as a pilot was to perform.<\/span> <span class=\"sn\">She toured the country doing loops and other stunts at air shows, and she used her fame to speak to Black audiences about flying.<\/span> <span class=\"sn\">Her goal was to open a flight school so that the next generation would not face the closed doors she had faced.<\/span> <span class=\"sn\">In 1926, she died in a crash while preparing for an air show in Jacksonville, Florida.<\/span> <span class=\"sn\">She never opened her school, but flying clubs named for her went on to encourage Black pilots for years afterward.<\/span><\/p>","q":"Based on the passage, why did Coleman most likely take French classes?","x":"The passage doesn’t say why, so you have to infer it. She took French classes and then sailed to France, where a flight school agreed to train her. Learning the language of the country where she would train is the logical reason. The other choices aren’t supported by anything in the passage.","t":"mc","c":["She planned to teach French classes in Chicago.","She would need French to train at a flight school in France.","Many of her customers at work spoke only French.","Flight schools in the United States required students to know French."],"a":1},{"id":"P-R-04","k":"pr-struct","lv":"M","p":"<p><span class=\"sn\">When Bessie Coleman decided to become a pilot after World War I, no flight school in the United States would accept her.<\/span> <span class=\"sn\">She was Black and she was a woman, and the schools turned her away for both reasons.<\/span> <span class=\"sn\">Coleman, who was working as a manicurist in Chicago, refused to let the matter end there.<\/span> <span class=\"sn\">She took French classes at night, saved what she could, found sponsors, and in late 1920 sailed for France, where a flight school agreed to train her.<\/span><\/p><p><span class=\"sn\">The training was grueling.<\/span> <span class=\"sn\">Students learned in fragile open-cockpit biplanes, and Coleman watched a fellow student die in a crash.<\/span> <span class=\"sn\">She kept going.<\/span> <span class=\"sn\">In June 1921, she earned an international pilot’s license, becoming the first African American woman to hold one.<\/span><\/p><p><span class=\"sn\">Back in the United States, Coleman found that the only way to make a living as a pilot was to perform.<\/span> <span class=\"sn\">She toured the country doing loops and other stunts at air shows, and she used her fame to speak to Black audiences about flying.<\/span> <span class=\"sn\">Her goal was to open a flight school so that the next generation would not face the closed doors she had faced.<\/span> <span class=\"sn\">In 1926, she died in a crash while preparing for an air show in Jacksonville, Florida.<\/span> <span class=\"sn\">She never opened her school, but flying clubs named for her went on to encourage Black pilots for years afterward.<\/span><\/p>","q":"Which choice best describes how the passage is organized?","x":"Follow the time clues: “after World War I,” “late 1920,” “June 1921,” and “1926.” The passage moves through her life in order, which is called chronological order. No other pilot is compared with her, and the author doesn’t argue for an opinion.","t":"mc","c":["It describes events in Coleman’s life in the order they happened.","It compares Coleman with another early pilot.","It presents a problem and then lists several possible solutions.","It states an opinion and then answers objections to it."],"a":0},{"id":"P-R-05","k":"pr-word","lv":"M","p":"<p><span class=\"sn\">When Bessie Coleman decided to become a pilot after World War I, no flight school in the United States would accept her.<\/span> <span class=\"sn\">She was Black and she was a woman, and the schools turned her away for both reasons.<\/span> <span class=\"sn\">Coleman, who was working as a manicurist in Chicago, refused to let the matter end there.<\/span> <span class=\"sn\">She took French classes at night, saved what she could, found sponsors, and in late 1920 sailed for France, where a flight school agreed to train her.<\/span><\/p><p><span class=\"sn\">The training was grueling.<\/span> <span class=\"sn\">Students learned in fragile open-cockpit biplanes, and Coleman watched a fellow student die in a crash.<\/span> <span class=\"sn\">She kept going.<\/span> <span class=\"sn\">In June 1921, she earned an international pilot’s license, becoming the first African American woman to hold one.<\/span><\/p><p><span class=\"sn\">Back in the United States, Coleman found that the only way to make a living as a pilot was to perform.<\/span> <span class=\"sn\">She toured the country doing loops and other stunts at air shows, and she used her fame to speak to Black audiences about flying.<\/span> <span class=\"sn\">Her goal was to open a flight school so that the next generation would not face the closed doors she had faced.<\/span> <span class=\"sn\">In 1926, she died in a crash while preparing for an air show in Jacksonville, Florida.<\/span> <span class=\"sn\">She never opened her school, but flying clubs named for her went on to encourage Black pilots for years afterward.<\/span><\/p>","q":"The author’s attitude toward Coleman is best described as","x":"Tone comes from word choice. The author stresses that Coleman “refused to let the matter end there” and “kept going,” and that clubs named for her helped others for years. Those details show respect and admiration. Nothing in the passage criticizes or jokes about her.","t":"mc","c":["critical","admiring","amused","uninterested"],"a":1},{"id":"P-R-06","k":"pr-main","lv":"E","p":"<p><span class=\"sn\">Along much of Florida’s southern coast, the shoreline is not sand but a tangle of trees standing in salt water.<\/span> <span class=\"sn\">These are mangroves, and they do far more than their muddy appearance suggests.<\/span><\/p><p><span class=\"sn\">A mangrove’s arching roots slow the water that flows through them.<\/span> <span class=\"sn\">As the water slows, sand and silt settle out, so over time the roots help hold the shoreline in place and can even build up new land.<\/span> <span class=\"sn\">During hurricanes, the dense roots also absorb some of the force of waves and storm surge before they reach homes and roads farther inland.<\/span><\/p><p><span class=\"sn\">The roots serve as a nursery, too.<\/span> <span class=\"sn\">Young fish, shrimp, and crabs hide among them, safe from larger predators, until they are big enough to move into open water.<\/span> <span class=\"sn\">Many of the fish that people catch offshore spent their early lives in a mangrove forest.<\/span><\/p><p><span class=\"sn\">Even so, mangroves have been cleared for decades to make room for docks, houses, and marinas.<\/span> <span class=\"sn\">Florida now protects them by law, and in many places trimming or removing mangroves requires a permit.<\/span> <span class=\"sn\">In my view, these rules are among the smartest the state has ever passed.<\/span><\/p>","q":"According to the passage, what happens when water slows down as it moves through mangrove roots?","x":"This question asks for a detail the passage states directly. The second paragraph says that as the water slows, sand and silt settle out, and the roots help hold the shoreline and build land. The passage says the roots weaken waves, the opposite of choice B.","t":"mc","c":["The water becomes too warm for young fish to survive.","Waves grow stronger before they reach the shore.","The roots begin to rot and fall apart.","Sand and silt settle out, which helps hold and build up the shoreline."],"a":3},{"id":"P-R-07","k":"pr-inf","lv":"M","p":"<p><span class=\"sn\">Along much of Florida’s southern coast, the shoreline is not sand but a tangle of trees standing in salt water.<\/span> <span class=\"sn\">These are mangroves, and they do far more than their muddy appearance suggests.<\/span><\/p><p><span class=\"sn\">A mangrove’s arching roots slow the water that flows through them.<\/span> <span class=\"sn\">As the water slows, sand and silt settle out, so over time the roots help hold the shoreline in place and can even build up new land.<\/span> <span class=\"sn\">During hurricanes, the dense roots also absorb some of the force of waves and storm surge before they reach homes and roads farther inland.<\/span><\/p><p><span class=\"sn\">The roots serve as a nursery, too.<\/span> <span class=\"sn\">Young fish, shrimp, and crabs hide among them, safe from larger predators, until they are big enough to move into open water.<\/span> <span class=\"sn\">Many of the fish that people catch offshore spent their early lives in a mangrove forest.<\/span><\/p><p><span class=\"sn\">Even so, mangroves have been cleared for decades to make room for docks, houses, and marinas.<\/span> <span class=\"sn\">Florida now protects them by law, and in many places trimming or removing mangroves requires a permit.<\/span> <span class=\"sn\">In my view, these rules are among the smartest the state has ever passed.<\/span><\/p>","q":"Which sentence from the passage expresses an opinion rather than a fact?","x":"A fact can be checked. An opinion is a judgment that people could disagree with. “In my view” and “smartest” are clear signs of the author’s opinion. The other three sentences describe things you could check with research.","t":"mc","c":["“In my view, these rules are among the smartest the state has ever passed.”","“Young fish, shrimp, and crabs hide among them, safe from larger predators.”","“Florida now protects them by law.”","“During hurricanes, the dense roots also absorb some of the force of waves.”"],"a":0},{"id":"P-R-08","k":"pr-struct","lv":"M","p":"<p><span class=\"sn\">Along much of Florida’s southern coast, the shoreline is not sand but a tangle of trees standing in salt water.<\/span> <span class=\"sn\">These are mangroves, and they do far more than their muddy appearance suggests.<\/span><\/p><p><span class=\"sn\">A mangrove’s arching roots slow the water that flows through them.<\/span> <span class=\"sn\">As the water slows, sand and silt settle out, so over time the roots help hold the shoreline in place and can even build up new land.<\/span> <span class=\"sn\">During hurricanes, the dense roots also absorb some of the force of waves and storm surge before they reach homes and roads farther inland.<\/span><\/p><p><span class=\"sn\">The roots serve as a nursery, too.<\/span> <span class=\"sn\">Young fish, shrimp, and crabs hide among them, safe from larger predators, until they are big enough to move into open water.<\/span> <span class=\"sn\">Many of the fish that people catch offshore spent their early lives in a mangrove forest.<\/span><\/p><p><span class=\"sn\">Even so, mangroves have been cleared for decades to make room for docks, houses, and marinas.<\/span> <span class=\"sn\">Florida now protects them by law, and in many places trimming or removing mangroves requires a permit.<\/span> <span class=\"sn\">In my view, these rules are among the smartest the state has ever passed.<\/span><\/p>","q":"The author’s main purpose in the passage is to","x":"Most of the passage explains what mangroves do: hold the shoreline, soften storms, and shelter young sea animals. That’s informing, so choice C. The last sentence shares an opinion, but it’s one sentence, not the purpose of the whole passage.","t":"mc","c":["tell the story of a hurricane that hit Florida","persuade readers to buy homes on the water","explain how mangroves help both people and wildlife","compare mangroves with forests farther inland"],"a":2},{"id":"P-R-09","k":"pr-inf","lv":"H","p":"<p><span class=\"sn\">Along much of Florida’s southern coast, the shoreline is not sand but a tangle of trees standing in salt water.<\/span> <span class=\"sn\">These are mangroves, and they do far more than their muddy appearance suggests.<\/span><\/p><p><span class=\"sn\">A mangrove’s arching roots slow the water that flows through them.<\/span> <span class=\"sn\">As the water slows, sand and silt settle out, so over time the roots help hold the shoreline in place and can even build up new land.<\/span> <span class=\"sn\">During hurricanes, the dense roots also absorb some of the force of waves and storm surge before they reach homes and roads farther inland.<\/span><\/p><p><span class=\"sn\">The roots serve as a nursery, too.<\/span> <span class=\"sn\">Young fish, shrimp, and crabs hide among them, safe from larger predators, until they are big enough to move into open water.<\/span> <span class=\"sn\">Many of the fish that people catch offshore spent their early lives in a mangrove forest.<\/span><\/p><p><span class=\"sn\">Even so, mangroves have been cleared for decades to make room for docks, houses, and marinas.<\/span> <span class=\"sn\">Florida now protects them by law, and in many places trimming or removing mangroves requires a permit.<\/span> <span class=\"sn\">In my view, these rules are among the smartest the state has ever passed.<\/span><\/p>","q":"Which sentence from the passage best supports the idea that mangroves matter to people who fish?","x":"The claim is specifically about people who fish. Only choice D connects mangroves to the fish that people catch. The other sentences are about land, development, or mangroves in general.","t":"mc","c":["“Even so, mangroves have been cleared for decades to make room for docks, houses, and marinas.”","“These are mangroves, and they do far more than their muddy appearance suggests.”","“As the water slows, sand and silt settle out.”","“Many of the fish that people catch offshore spent their early lives in a mangrove forest.”"],"a":3},{"id":"P-R-10","k":"pr-main","lv":"E","p":"<p><span class=\"sn\">Our school should move its start time from 7:05 a.m. to 8:30 a.m.<\/span> <span class=\"sn\">During the teenage years, the body’s internal clock shifts later, so many teens have trouble falling asleep before about 11 p.m.<\/span> <span class=\"sn\">When school starts at 7:05, students who fall asleep that late get far less than the eight to ten hours of sleep that doctors recommend for people our age.<\/span> <span class=\"sn\">The American Academy of Pediatrics has recommended that middle and high schools start no earlier than 8:30 a.m.<\/span><\/p><p><span class=\"sn\">Some parents worry that a later start would cut into after-school jobs and sports.<\/span> <span class=\"sn\">However, schools that have made the switch report that students are more alert in class, and practices can simply end a little later.<\/span><\/p>","q":"What is the main claim of the passage?","x":"The first sentence states the claim, and everything after it supports or defends it: the school should start at 8:30 instead of 7:05. Jobs and sports come up only as a concern the author answers.","t":"mc","c":["Teenagers should get jobs after school.","Doctors disagree about how much sleep teens need.","The school should start later in the morning.","Sports practices should be canceled."],"a":2},{"id":"P-R-11","k":"pr-struct","lv":"H","p":"<p><span class=\"sn\">Our school should move its start time from 7:05 a.m. to 8:30 a.m.<\/span> <span class=\"sn\">During the teenage years, the body’s internal clock shifts later, so many teens have trouble falling asleep before about 11 p.m.<\/span> <span class=\"sn\">When school starts at 7:05, students who fall asleep that late get far less than the eight to ten hours of sleep that doctors recommend for people our age.<\/span> <span class=\"sn\">The American Academy of Pediatrics has recommended that middle and high schools start no earlier than 8:30 a.m.<\/span><\/p><p><span class=\"sn\">Some parents worry that a later start would cut into after-school jobs and sports.<\/span> <span class=\"sn\">However, schools that have made the switch report that students are more alert in class, and practices can simply end a little later.<\/span><\/p>","q":"How does the last sentence of the passage relate to the sentence before it?","x":"The sentence before it raises a worry: a later start would cut into jobs and sports. The last sentence begins with “However” and responds with reasons the worry may not hold. That’s answering a counterargument.","t":"mc","c":["It answers a concern by giving reasons the concern may not be a problem.","It gives an example that supports the parents’ worry.","It repeats the author’s main claim in different words.","It introduces a new topic that is unrelated to start times."],"a":0},{"id":"P-R-12","k":"pr-inf","lv":"M","p":"<p><span class=\"sn\">Our school should move its start time from 7:05 a.m. to 8:30 a.m.<\/span> <span class=\"sn\">During the teenage years, the body’s internal clock shifts later, so many teens have trouble falling asleep before about 11 p.m.<\/span> <span class=\"sn\">When school starts at 7:05, students who fall asleep that late get far less than the eight to ten hours of sleep that doctors recommend for people our age.<\/span> <span class=\"sn\">The American Academy of Pediatrics has recommended that middle and high schools start no earlier than 8:30 a.m.<\/span><\/p><p><span class=\"sn\">Some parents worry that a later start would cut into after-school jobs and sports.<\/span> <span class=\"sn\">However, schools that have made the switch report that students are more alert in class, and practices can simply end a little later.<\/span><\/p>","q":"The author most likely mentions the American Academy of Pediatrics in order to","x":"The American Academy of Pediatrics is a group of children’s doctors. Saying they recommend an 8:30 start adds expert support to the author’s argument. The passage never says most schools already start at 8:30.","t":"mc","c":["explain why some parents oppose a later start","show that experts support the change the author wants","prove that most schools already start at 8:30 a.m.","describe how the body’s internal clock works"],"a":1},{"id":"P-W-01","k":"pw-sent","lv":"E","p":"","q":"Which sentence is written correctly?","x":"Choice B is one complete sentence: the “because” part is attached to the main sentence with a comma. Choice A leaves “Because the bus was late.” as a fragment that can’t stand alone. Choice C joins two complete sentences with only a comma, which is a comma splice. Choice D runs them together with no punctuation, which is a run-on.","t":"mc","c":["Because the bus was late. We missed the first half of the game.","Because the bus was late, we missed the first half of the game.","The bus was late, we missed the first half of the game.","The bus was late we missed the first half of the game."],"a":1},{"id":"P-W-02","k":"pw-sent","lv":"M","p":"","q":"Which sentence places the modifier correctly?","x":"An opening phrase like “Walking to class” describes whoever comes right after the comma. In choice A, that’s “I,” the person who was actually walking. In B and D, the strap is the one walking, which makes no sense. Choice C has the same problem at the end of the sentence.","t":"mc","c":["Walking to class, I felt my backpack strap snap.","Walking to class, my backpack strap snapped.","My backpack strap snapped walking to class.","Walking to class, the strap on my backpack snapped."],"a":0},{"id":"P-W-03","k":"pw-sent","lv":"M","p":"","q":"Which sentence uses parallel structure correctly?","x":"Items in a list need the same form. In choice D, all three are -ing words: hiking, swimming, and riding. Choices A, B, and C each mix -ing words with a “to” form.","t":"mc","c":["On weekends, Dani likes hiking, swimming, and to ride her bike.","On weekends, Dani likes to hike, swimming, and riding her bike.","On weekends, Dani likes hiking, to swim, and riding her bike.","On weekends, Dani likes hiking, swimming, and riding her bike."],"a":3},{"id":"P-W-04","k":"pw-sent","lv":"H","p":"<p><span class=\"sn\">The library extended its hours.<\/span> <span class=\"sn\">Students can now study there until midnight.<\/span><\/p>","q":"Which choice best combines the two sentences?","x":"The second sentence is a result of the first: the longer hours are why students can stay until midnight. “So” shows that cause and effect, and the comma before it is correct. Choice B is a comma splice. “But” in C and “although” in D signal a contrast that isn’t there.","t":"mc","c":["The library extended its hours, so students can now study there until midnight.","The library extended its hours, students can now study there until midnight.","The library extended its hours, but students can now study there until midnight.","Although the library extended its hours, students can now study there until midnight."],"a":0},{"id":"P-W-05","k":"pw-gram","lv":"E","p":"","q":"Choose the word that best completes the sentence.<br><br>Last summer, my cousin ______ at a marina in Stuart.","x":"“Last summer” is a finished time in the past, so the verb needs the simple past: “worked.” “Has worked” doesn’t go with a specific past time like last summer, and the other two are present and future.","t":"mc","c":["works","has worked","worked","will work"],"a":2},{"id":"P-W-06","k":"pw-gram","lv":"M","p":"","q":"Choose the word that best completes the sentence.<br><br>Each of the players on the team ______ a new jersey.","x":"The subject is “each,” which is singular. “Of the players on the team” just describes it. A singular subject takes “needs.” The other choices are plural verbs that match “players,” the trap word right before the blank.","t":"mc","c":["need","needs","are needing","have needed"],"a":1},{"id":"P-W-07","k":"pw-gram","lv":"M","p":"","q":"Choose the word that best completes the sentence.<br><br>The members of the jazz band packed ______ instruments into the van.","x":"The pronoun stands for “the members,” which is plural, so it’s “their.” “There” is a place, “they’re” means “they are,” and “its” is singular.","t":"mc","c":["its","there","they’re","their"],"a":3},{"id":"P-W-08","k":"pw-gram","lv":"M","p":"","q":"Choose the word that best completes the sentence.<br><br>Ms. Ortiz asked Jaylen and ______ to set up the chairs before the meeting.","x":"Cover up “Jaylen and” and read it again. You’d say “Ms. Ortiz asked me,” not “asked I,” so “me” is correct. “Myself” only works when you already appear earlier in the sentence, as in “I did it myself.”","t":"mc","c":["me","I","myself","mine"],"a":0},{"id":"P-W-09","k":"pw-gram","lv":"H","p":"","q":"Which sentence avoids an inappropriate shift in pronoun?","x":"Pick one way of referring to the reader and stick with it. Choice C uses “you” both times. Choice A switches from “you” to “one,” B switches from “people” to “you,” and D switches from “one” to “you.”","t":"mc","c":["When you visit the beach, one should wear sunscreen.","When people visit the beach, you should wear sunscreen.","When you visit the beach, you should wear sunscreen.","When one visits the beach, you should wear sunscreen."],"a":2},{"id":"P-W-10","k":"pw-gram","lv":"M","p":"","q":"Which sentence contains an inappropriate shift in verb tense?","x":"Choice D starts in the present (“blows”) and jumps to the past (“ran”) for two actions happening at the same moment. Choice A stays in the past, B stays in the present, and C stays in the future.","t":"mc","c":["The coach blew the whistle, and the players ran to the line.","The coach blows the whistle, and the players run to the line.","The coach will blow the whistle, and the players will run to the line.","The coach blows the whistle, and the players ran to the line."],"a":3},{"id":"P-W-11","k":"pw-usage","lv":"E","p":"","q":"Choose the word that best completes the sentence.<br><br>Marcus played ______ in last night’s game, scoring 22 points.","x":"The blank describes how Marcus played, which is an action, so it needs an adverb: “well.” “Good” is an adjective. It describes things, as in “a good game.”","t":"mc","c":["good","well","goodly","more good"],"a":1},{"id":"P-W-12","k":"pw-usage","lv":"M","p":"","q":"Choose the word that best completes the sentence.<br><br>The new schedule will ______ how many hours I can work each week.","x":"Here the word is an action that comes after “will,” so it’s the verb “affect” in its plain form. “Effect” is usually a noun that means a result. “Affects” doesn’t fit after “will.”","t":"mc","c":["effect","effects","affect","affects"],"a":2},{"id":"P-W-13","k":"pw-usage","lv":"E","p":"","q":"Choose the word that best completes the sentence.<br><br>My brother is taller ______ I am, but I can jump higher.","x":"“Than” is for comparisons, like taller than. “Then” is about time, as in “first this, then that.”","t":"mc","c":["then","than","that","as"],"a":1},{"id":"P-W-14","k":"pw-usage","lv":"H","p":"","q":"Which sentence uses adjectives and adverbs correctly?","x":"“Smelled” works like “seemed” here: it links the soup to a word describing it. That calls for the adjective “bad,” not the adverb “badly.” Choice C uses “real” where formal writing needs “really,” and “worser” in D isn’t a standard word.","t":"mc","c":["The soup smelled bad after sitting out all night.","The soup smelled badly after sitting out all night.","The soup smelled real bad after sitting out all night.","The soup smelled worser after sitting out all night."],"a":0},{"id":"P-W-15","k":"pw-org","lv":"M","p":"<p><span class=\"sn\">(1) Volunteering at an animal shelter can teach teens valuable skills.<\/span> <span class=\"sn\">(2) Volunteers learn to handle animals calmly and safely.<\/span> <span class=\"sn\">(3) They also practice responsibility by showing up for scheduled shifts.<\/span> <span class=\"sn\">(4) Dogs were first domesticated thousands of years ago.<\/span> <span class=\"sn\">(5) Some volunteers even discover a career they want to pursue, such as veterinary medicine.<\/span><\/p>","q":"Which sentence is least relevant to the main idea of the paragraph?","x":"The topic sentence says volunteering teaches teens skills. Sentences 2, 3, and 5 each give a skill or a benefit. Sentence 4 is a history fact about dogs that doesn’t support the topic, so it’s the one that doesn’t belong.","t":"mc","c":["Sentence 2","Sentence 3","Sentence 4","Sentence 5"],"a":2},{"id":"P-W-16","k":"pw-org","lv":"M","p":"<p><span class=\"sn\">(1) Then she stirred the eggs and milk into the flour mixture.<\/span> <span class=\"sn\">(2) Finally, she poured the batter into the hot pan.<\/span> <span class=\"sn\">(3) First, Lena mixed the flour and sugar in a bowl.<\/span> <span class=\"sn\">(4) While the batter rested, she heated a pan on the stove.<\/span><\/p>","q":"Which order of sentences makes the most logical paragraph?","x":"Start with “First,” which is sentence 3. Sentence 1 comes next because it makes the batter. Sentence 4 needs the batter to exist (“while the batter rested”), and sentence 2 needs the hot pan from sentence 4. So the order is 3, 1, 4, 2.","t":"mc","c":["3, 4, 1, 2","1, 3, 4, 2","4, 3, 1, 2","3, 1, 4, 2"],"a":3},{"id":"P-W-17","k":"pw-org","lv":"H","p":"","q":"Which choice best fills the blank?<br><br>Florida’s springs stay close to the same temperature all year, about 72 degrees. ______ manatees crowd into them during cold snaps in winter.","x":"The second sentence is a result of the first: manatees go to the springs because the water stays warm. “As a result” signals that cause and effect. “However” would signal a contrast, and “for example” and “similarly” don’t describe this link.","t":"mc","c":["However,","As a result,","For example,","Similarly,"],"a":1},{"id":"P-W-18","k":"pw-org","lv":"M","p":"<p><span class=\"sn\">A student reads this sentence in the school newsletter: “The robotics team meets every Tuesday and Thursday from 3:00 to 5:00 p.m., and new members may join at any meeting before the first competition in March.”<\/span><\/p>","q":"Which note most accurately records the information in the sentence?","x":"A good note keeps every key detail and changes none of them. Choice A has both days, the times, and the March deadline. Choice B drops Thursday, C gets the deadline backward, and D changes the days and drops the deadline.","t":"mc","c":["Robotics: Tue and Thu, 3–5 p.m.; new members can join until the first competition in March","Robotics: meets Tuesdays only, 3–5 p.m.","Robotics: new members must join in March","Robotics: meets every weekday, 3–5 p.m.; anyone can join at any time"],"a":0},{"id":"P-W-19","k":"pw-org","lv":"E","p":"","q":"Which sentence best supports this topic sentence?<br><br><i>Learning to cook can save you money.<\/i>","x":"The topic sentence is about saving money, so the support has to be about cost. Only choice C compares prices. The others are about cooking, but not about money.","t":"mc","c":["Many famous chefs trained in France.","Some people like to eat breakfast food for dinner.","A homemade pasta dinner for four can cost less than one restaurant meal.","Cooking shows are popular on streaming services."],"a":2}],"vocab":[["corroborate","verb","to confirm or support with evidence","A second lab’s results corroborated the first team’s findings."],["undermine","verb","to weaken, often gradually or without being obvious","Skipping sleep can undermine everything you studied the night before."],["mitigate","verb","to make less severe","Planting shade trees can mitigate the heat of a city street."],["ambivalent","adjective","having mixed feelings","He was ambivalent about the move: excited for college, sad to leave his friends."],["pragmatic","adjective","focused on what works in practice","Instead of a perfect plan, the team chose a pragmatic one they could finish."],["substantiate","verb","to back up a claim with evidence","The reporter couldn’t substantiate the rumor, so she didn’t publish it."],["tenuous","adjective","weak or thin; barely supported","The link between the two events is tenuous at best."],["disparate","adjective","very different from one another","The club brings together students with disparate interests."],["novel","adjective","new and original","The engineers proposed a novel way to store solar energy."],["nuanced","adjective","showing subtle differences or shades of meaning","Her argument was nuanced, not simply for or against."],["concede","verb","to admit that something is true, often reluctantly","The coach conceded that the other team played better."],["ephemeral","adjective","lasting a very short time","Most viral trends are ephemeral."],["meticulous","adjective","extremely careful and precise","The dentist was meticulous, checking every tooth twice."],["skeptical","adjective","doubtful; not easily convinced","Scientists were skeptical of the bold claim until it was tested."],["prolific","adjective","producing a large amount","She is a prolific songwriter who releases new music every month."],["resilient","adjective","able to recover quickly from difficulty","The resilient crops survived the drought."],["inadvertent","adjective","not intended; accidental","An inadvertent typo changed the meaning of the sentence."],["discern","verb","to notice or recognize, especially with effort","It was hard to discern the trail in the fog."],["plausible","adjective","seeming reasonable or likely","His excuse was plausible, so the teacher accepted it."],["scrutinize","verb","to examine very closely","Editors scrutinize every quote before it goes to print."],["sparse","adjective","thinly scattered; few","Trees are sparse on the windy dunes."],["underscore","verb","to emphasize","The data underscore the need for better lighting rules."],["tentative","adjective","not certain or final","We made tentative plans to meet on Saturday."],["warrant","verb","to justify or call for","The surprising results warrant further study."],["augment","verb","to increase or add to","He augmented his income with weekend shifts."],["deter","verb","to discourage someone from acting","Bright lights help deter break-ins."],["elusive","adjective","hard to find, catch, or understand","The answer remained elusive despite hours of work."],["feasible","adjective","possible to do","Is the plan feasible on our budget?"],["inherent","adjective","existing as a natural, built-in part","Some risk is inherent in any investment."],["intricate","adjective","very detailed and complex","The quilt had an intricate pattern of tiny stitches."],["pervasive","adjective","spread throughout","Traffic noise is pervasive in the city."],["refute","verb","to prove wrong","New evidence refuted the old theory."],["reconcile","verb","to make two things consistent","Historians tried to reconcile the two conflicting accounts."],["replicate","verb","to repeat or copy, especially a study’s results","Other labs could not replicate the result."],["robust","adjective","strong; holding up well under testing","The finding was robust across many studies."],["speculate","verb","to guess without firm evidence","Fans speculated about the show’s ending."],["unprecedented","adjective","never done or known before","The storm brought unprecedented flooding."],["viable","adjective","able to work successfully","Biking is a viable way to get to school here."],["equivocal","adjective","open to more than one interpretation; unclear","The report’s equivocal wording let both sides claim victory."],["dismissive","adjective","treating something as not worth considering","Early critics were dismissive of her work."]],"lessons":{"pert-how":[["The PERT has three parts: Math, Reading, and Writing. Each part has 30 multiple-choice questions.","<div class=\"trio\"><div class=\"card3 k\"><b>Math<\/b><span>30 questions<\/span><\/div><div class=\"card3 k\"><b>Reading<\/b><span>30 questions<\/span><\/div><div class=\"card3 k\"><b>Writing<\/b><span>30 questions<\/span><\/div><\/div>"],["There’s no time limit. Most people take about an hour per part, so slow down and read every choice.","<div class=\"big k\">No time limit<\/div><p class=\"sub k\">Slow down. Read every choice.<\/p>"],["You can’t skip a question or go back to change an answer. Check your answer before you submit it.","<div class=\"row\"><span class=\"chip k\">Pick<\/span><span class=\"arr k\">→<\/span><span class=\"chip k\">Check it<\/span><span class=\"arr k\">→<\/span><span class=\"chip hot k\">Submit<\/span><\/div><div class=\"row\"><s>Go back<\/s><s>Skip<\/s><\/div>"],["It’s adaptive. Right answers make the next question harder, so a hard question means you’re doing well.","<div class=\"stairs\"><span class=\"k st1\">Easy<\/span><span class=\"k st2\">Medium<\/span><span class=\"k st3\">Hard<\/span><\/div>"],["The calculator only appears on some math questions, and it works left to right. It turns 3 + 4 × 2 into 14, but the right answer is 11.","<div class=\"ln\">\\(3 + 4 \\times 2\\)<\/div><div class=\"row\"><span class=\"bx\">calculator: 14<\/span><span class=\"bo\">correct: 11<\/span><\/div>"],["Scratch paper is allowed for math, so write each step down instead of doing it in your head.","<div class=\"big k\">Write it down<\/div><p class=\"sub k\">Every step, on scratch paper.<\/p>"]],"pm-eq":[["An equation is a balance. Whatever you do to one side, do to the other side.","<div class=\"ln\">\\(5x - 7 = 3x + 9\\)<\/div><div class=\"ln\">\\(5x - 7 \\ins{-3x} = 3x + 9 \\ins{-3x}\\)<\/div><div class=\"ln\">\\(\\hl{2x - 7} = 9\\)<\/div>"],["Undo adding and subtracting first. Then undo multiplying and dividing.","<div class=\"ln\">\\(2x - 7 \\ins{+7} = 9 \\ins{+7}\\)<\/div><div class=\"ln\">\\(2x = 16\\)<\/div><div class=\"ln\">\\(\\hl{x = 8}\\)<\/div>"],["Check your answer by putting it back in. Both sides should match.","<div class=\"ln\">\\(5(8) - 7 = 33\\)<\/div><div class=\"ln\">\\(3(8) + 9 = 33\\)<\/div><div class=\"row\"><span class=\"bo\">both sides match<\/span><\/div>"],["Distribute first. A negative in front of parentheses hits every term inside.","<div class=\"ln\">\\(-4(x + 1)\\)<\/div><div class=\"ln\">\\(\\hl{-4x - 4}\\)<\/div><div class=\"row\"><span class=\"bx\">not −4x + 4<\/span><\/div>"],["Solving for a letter works the same way. To get w alone in P = 2ℓ + 2w, subtract 2ℓ, then divide by 2.","<div class=\"ln\">\\(P = 2\\ell + 2w\\)<\/div><div class=\"ln\">\\(P \\ins{-2\\ell} = 2w\\)<\/div><div class=\"ln\">\\(\\hl{w = \\frac{P - 2\\ell}{2}}\\)<\/div>"]],"pm-ineq":[["Solve an inequality the same way you solve an equation.","<div class=\"ln\">\\(2x - 1 \\le 5\\)<\/div><div class=\"ln\">\\(2x \\le 6
